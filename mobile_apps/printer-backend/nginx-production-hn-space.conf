# ============================================================
# Nginx 配置 — HN 云打印 生产（hn-space.cn）
#
# ⚠ 本文件是**生产实际生效**的配置（2026-10-23 从服务器 `nginx -T` 取回，脱敏后入库）。
#   计划 §S0-01 收尾要求"以线上为准"：仓库里的 nginx-https.conf 是模板（含 http2、
#   proxy_read_timeout 3600s、无 hn_login），**不要**拿它覆盖生产。
#
# 2026-10-23 S0-01 安全加固改动（docs/安全加固修复计划_2026-10-23.md §S0-01）：
#   · 新增 hn_sio（/socket.io/ 30r/m）与 hn_login（两个匿名登录入口 20r/m）请求桶、
#     hn_conn 并发连接桶；
#   · /socket.io/：limit_conn 6 + limit_req 30r/m burst 20 + proxy_read_timeout 120s
#     （原 86400s 且零限速 ⇒ 16 条匿名连接即可占满 threads=16）；
#   · /api/：body 2 MB + burst 200 + limit_conn 12（**不要**把 burst 压到 30：
#     单用户 6 个待验证 Word 的轮询就有 72 r/m，先打死的是正常人；2026-10-27 起 rate 提到 600r/m，
#     理由与实测证据见下方"限流口径修正"）；
#   · /api/upload 维持 50 MB（**不要**按报告片段放宽到 55m）+ limit_conn 6；
#   · /api/profile 3 MB + limit_conn 4；/api/login 与 /api/device_login 独立桶 + limit_conn 3；
#   · / 1 MB + burst 20 + proxy_read_timeout 60s；/updates/ 限速；
#   · 所有代理 location 补 X-Forwarded-Proto（配合后端 ProxyFix 的 x_proto=1）。
# 慢连接超时与 429 状态码在 /etc/nginx/conf.d/00-security-hardening.conf（http 上下文）。
#
# 2026-10-27 限流口径修正（现场：「APP 检查更新 → 网络错误」）：
#   · hn_api 60r/m（=1 r/s）**低于移动端自身的正常轮询速率** —— 2026-10-27 00:34 实测
#     一台手机 173 req/min ≈ 2.9 r/s（orders/license/admins/avatar/printer_status/
#     claiming_devices/me/storage/security/bind 等十来个接口各自轮询，且带 Authorization
#     的跨域请求每次还要多一个 OPTIONS 预检 = 双倍计数）；门店 NAT 后面通常还有第 2 台手机
#     与本地打印工具。实测 error.log：`limiting requests, excess: 42.654~72.588 by zone "hn_api"`。
#     ⇒ 桶必然长期满，**连 /updates/ 的更新清单请求也被 429**，App 只看到「网络错误」。
#   · 现改为 rate=600r/m（10 r/s）+ /api/ burst 200：3 台设备同 NAT 也够用。
#   · /updates/ 拆出独立桶 hn_updates（清单 + APK 下载与 API 轮询互不挤占）。
#   · 单 IP 10 r/s 仍是"每 IP 粗粒度"防线（更细的每用户配额在后端），未取消任何限速。
# ============================================================

# 防滥用：IP 维度请求限速（DDoS 防护），超过速率+burst 返回 429（见 conf.d/00-*.conf）
#   hn_upload  仅用于 /api/upload（防存储型 DDoS 灌文件）
#   hn_api     兜底覆盖其余 /api/ 接口（含 /api/ping 等无鉴权公开接口）
#   hn_sio     /socket.io/（握手 + 长轮询），S0-01 新增
#   hn_login   /api/login 与 /api/device_login（两个匿名入口），S0-01 新增
#   hn_updates /updates/（更新清单与安装包），2026-10-27 新增，与 API 轮询解耦
# 注意：这是粗粒度的"每 IP"上限，粒度大于后端的"每用户"限速；
#       共享出口 IP（学校/办公 NAT）若出现误杀，调大 rate/burst 或删除对应 limit_req，
#       后端每用户配额与排队超时淘汰仍是核心防线。
limit_req_zone $binary_remote_addr zone=hn_upload:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=hn_api:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=hn_sio:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=hn_login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=hn_updates:10m rate=60r/m;
# 并发连接（每 IP）：hn_conn 12 对共享 NAT 偏紧，上线后 24h 观察 429 来源，
# 必要时临时调 16–20，但**不要取消**（匿名 WS 耗尽线程正是 R1）。
limit_conn_zone $binary_remote_addr zone=hn_conn:10m;

server {
    listen 80;
    server_name hn-space.cn www.hn-space.cn;

    # ACME 挑战（Let's Encrypt 续期用）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # S0-01：默认请求体 2 MB（全局兜底）；50 MB 只留给 /api/upload
    client_max_body_size 2m;
    listen 443 ssl;
    server_name hn-space.cn www.hn-space.cn;

    ssl_certificate /etc/letsencrypt/live/hn-space.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hn-space.cn/privkey.pem;

    root /var/www/html;
    index index.html;

    # ACME 挑战（Let's Encrypt 续期用）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = / {
        return 301 https://blog.hn-space.cn/;
    }

    # 上传接口：严格限速（每 IP 30 次/分，burst 60 容纳一次性多文件上传）
    # 50 MB 是现行值，**不要**按报告片段改成 55m（那会悄悄放宽）
    location = /api/upload {
        client_max_body_size 50m;
        limit_req zone=hn_upload burst=60 nodelay;
        limit_conn hn_conn 6;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 头像/资料（multipart 上限 3 MB；后端另有同一道闸门）
    location = /api/profile {
        client_max_body_size 3m;
        limit_req zone=hn_api burst=30 nodelay;
        limit_conn hn_conn 4;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 两个匿名登录入口：独立桶（20 r/m，burst 5）+ 并发 3。
    # 与后端 BoundedSemaphore(4)/每 IP 10 次每分形成纵深（边缘先挡，应用层再挡）。
    location = /api/login {
        client_max_body_size 64k;
        limit_req zone=hn_login burst=5 nodelay;
        limit_conn hn_conn 3;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/device_login {
        client_max_body_size 64k;
        limit_req zone=hn_login burst=5 nodelay;
        limit_conn hn_conn 3;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余 API：兜底限速（每 IP 600 次/分 = 10 r/s，burst 200）+ 并发 12
    # （2026-10-27 由 60r/m 上调：移动端正常轮询就有 2.9 r/s，见文件头注释）
    location /api/ {
        client_max_body_size 2m;
        limit_req zone=hn_api burst=200 nodelay;
        limit_conn hn_conn 12;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        client_max_body_size 1m;
        limit_req zone=hn_api burst=20 nodelay;
        limit_conn hn_conn 12;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }


    # Self-update installer static files (local print tool updater.py)
    location /updates/ {
        alias /home/printer-backend/updates/;
        default_type application/octet-stream;
        add_header Access-Control-Allow-Origin *;
        # 更新包下载限速：清单只有几 KB、安装包几十 MB，按请求数限即可。
        # 2026-10-27：独立桶 hn_updates —— 旧写法与 /api/ 共用 hn_api，App 轮询把桶占满后
        # 连更新清单都 429（现场「检查更新：网络错误」就是这条链）。
        limit_req zone=hn_updates burst=60 nodelay;
        limit_conn hn_conn 8;
    }

    # Socket.IO：S0-01 的核心。匿名连接在**边缘**就被挡住（第 7 条起 429），
    # 后端的 Engine.IO 握手门（S0-02）是第二道。
    location /socket.io/ {
        limit_req zone=hn_sio burst=20 nodelay;
        limit_conn hn_conn 6;
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 120s 足够覆盖 WebSocket ping（25s）与长轮询（≤ ping_interval+timeout）；
        # 原 86400s 让死连接能挂一整天
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
