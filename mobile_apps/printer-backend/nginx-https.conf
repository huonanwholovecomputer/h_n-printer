# ============================================================
# Nginx 配置 — HN 云打印（HTTPS + Let's Encrypt，生产环境）
# 先按 nginx-http.conf 配置好 HTTP，运行 certbot 获取证书后再替换为此文件
# ============================================================

# 防滥用：IP 维度请求限速（DDoS 防护）
#   内存 10MB，约可记录 16 万 IP；超过速率+burst 的请求返回 503。
#   hn_upload 仅用于 /api/upload（上传接口，防存储型 DDoS 灌文件）
#   hn_api     兜底覆盖其余 /api/ 接口（含 /api/ping 等无鉴权公开接口）
#   注意：这是粗粒度的"每 IP"上限，粒度大于后端的"每用户"限速；
#   学校/办公等共享出口 IP 的场景若出现误杀，可调大 rate/burst 或删除对应 limit_req，
#   后端每用户配额与排队超时淘汰仍是核心防线。
limit_req_zone $binary_remote_addr zone=hn_upload:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=hn_api:10m rate=60r/m;

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name your-domain.com;

    # Let's Encrypt 验证
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 重定向也做兜底限速，防端口 80 被刷（ACME 续期依赖 80 端口可用）
    location / {
        limit_req zone=hn_api burst=150 nodelay;
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站点
server {
    listen 443 ssl http2;
    server_name your-domain.com;   # 替换为你的域名

    # SSL 证书（Let's Encrypt）
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 客户端上传文件大小限制（最大 50MB）
    client_max_body_size 50m;

    # 日志
    access_log /var/log/nginx/printer-backend-access.log;
    error_log  /var/log/nginx/printer-backend-error.log;

    # 上传接口：严格限速（每 IP 30 次/分，burst 60 容纳一次性多文件上传）
    location = /api/upload {
        limit_req zone=hn_upload burst=60 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 50m;
    }

    # Socket.IO：WebSocket 长连接 + 轮询，不参与限速（避免误杀长连接）
    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余 API：兜底限速（每 IP 60 次/分，burst 150）
    location /api/ {
        limit_req zone=hn_api burst=150 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 默认代理（首页、静态页面等）
    location / {
        proxy_pass http://127.0.0.1:5000;

        # 基本代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket 升级支持（Socket.IO 需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时（WebSocket 长连接）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 静态文件
    location /uploads/ {
        alias /opt/printer-backend/uploads/;
        expires 1h;
    }
}
