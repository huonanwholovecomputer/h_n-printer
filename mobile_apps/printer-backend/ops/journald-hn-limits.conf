# ===== S2-06 / S2-11：journald 容量上限（HN 打印后端）=====
# 安装位置：/etc/systemd/journald.conf.d/hn-limits.conf
#   sudo install -D -m 0644 hn-limits.conf /etc/systemd/journald.conf.d/hn-limits.conf
#   sudo systemctl restart systemd-journald   # 只影响日志服务，不重启后端
#
# 现状问题：journald 默认按磁盘 10% 上限滚动（本机 50 GB 盘 ≈ 5 GB），而 `collect_all`
# 会把客户端日志打包回传、nginx access.log 又有保留期 —— 日志无限增长会先吃掉磁盘，
# 触发「磁盘低于阈值拒绝上传」（R4/DS-20 同一类）。
[Journal]
SystemMaxUse=300M
SystemMaxFileSize=50M
SystemMaxFiles=20
MaxRetentionSec=30day
