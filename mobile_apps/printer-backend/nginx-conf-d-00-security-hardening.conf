# ============================================================
# S0-01 安全加固：边缘超时 / 限速状态码（2026-10-23）
# 依据：docs/安全加固修复计划_2026-10-23.md §S0-01（R4 慢连接 / R1 缓解①）
#
# 放在 conf.d/ 里（http 上下文，先于 sites-enabled 载入）—— 不改 nginx.conf 主文件，
# 回滚只需删掉本文件 + reload。
#
# 为什么这些值：
#   · client_header_timeout / client_body_timeout 收到 10s：慢连接（Slowloris 型）
#     用"每秒发一个字节"就能长期占住 worker 连接；10s 是首字节/两段读之间的空窗上限，
#     正常用户的 50 MB 上传（持续有数据）不受影响。
#   · send_timeout 30s：对端不读响应时尽快收尾。
#   · keepalive_timeout 30s：缩短空闲 keep-alive 占用（原默认 60/75）。
#   · reset_timedout_connection：超时连接直接 RST，不留半开连接。
#   · limit_req_status / limit_conn_status 改 429：默认 503 会把"被限速"与"后端挂了"
#     混在一起，access.log 与告警都没法按状态码区分（计划 §S0-08 的指标依赖这一点）。
# ============================================================

client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 30s;
keepalive_timeout 30s;

reset_timedout_connection on;

limit_req_status 429;
limit_conn_status 429;
