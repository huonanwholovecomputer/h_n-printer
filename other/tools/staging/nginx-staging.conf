# ============================================================
# HN 打印 · 隔离 staging 边缘层（Windows nginx）
#
# 来源：mobile_apps/printer-backend/nginx-production-hn-space.conf（生产实际生效配置）
#     + nginx-conf-d-00-security-hardening.conf（S0-01 http 上下文补丁）
# 改写：去掉 TLS / 域名 / ACME；proxy_pass 指向 127.0.0.1:__APP_PORT__；
#      绝对路径全部改成相对路径：nginx for Windows 的 argv 走 ANSI，命令行/配置里
#      带中文绝对路径会 CreateFile 1113，故一律 cwd + 相对路径（见 staging_common）。
#      **所有 limit_* / body / timeout 取值保持生产原值，不得为了测试放宽**
#      （放宽就失去"验证生产补丁"的意义）。
#
# 由 tools/staging/staging_common.py render_nginx_conf() 渲染，勿手改生成物。
# ============================================================

worker_processes  1;
error_log  logs/error.log  info;
pid        logs/nginx.pid;

events {
    worker_connections  512;
}

http {
    include       mime.types;   # 相对**本配置文件所在目录**（conf/），不是 nginx 前缀
    default_type  application/octet-stream;

    log_format  staging  '$remote_addr [$time_local] "$request" status=$status '
                         'bytes=$bytes_sent req_time=$request_time '
                         'upstream=$upstream_addr ustatus=$upstream_status '
                         'conn=$connection_requests';
    access_log  logs/access.log  staging;

    # 独立临时盘：S0-01 要证明"50 MB 灌盘止于 nginx、且 413 时零落盘"
    client_body_temp_path temp/client_body_temp;
    client_body_buffer_size 16k;

    # ---- conf.d/00-security-hardening.conf（S0-01，生产原值）----
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    reset_timedout_connection on;
    limit_req_status 429;
    limit_conn_status 429;
    server_tokens off;

    # ---- sites-enabled/printer-backend（S0-01，生产原值）----
    # hn_upload 仅 /api/upload；hn_api 兜底其余 /api/ 与 /；hn_sio = /socket.io/；
    # hn_login = 两个匿名登录入口；hn_conn = 每 IP 并发连接
    limit_req_zone $binary_remote_addr zone=hn_upload:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=hn_api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=hn_sio:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=hn_login:10m rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=hn_conn:10m;

    server {
        listen       127.0.0.1:__EDGE_PORT__;
        server_name  localhost;
        client_max_body_size 2m;

        # 上传接口：50 MB 是现行值（计划明令不得改成 55m）+ limit_conn 6
        location = /api/upload {
            client_max_body_size 50m;
            limit_req zone=hn_upload burst=60 nodelay;
            limit_conn hn_conn 6;
            proxy_pass http://127.0.0.1:__APP_PORT__;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 头像/资料：3 MB + limit_conn 4
        location = /api/profile {
            client_max_body_size 3m;
            limit_req zone=hn_api burst=30 nodelay;
            limit_conn hn_conn 4;
            proxy_pass http://127.0.0.1:__APP_PORT__;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 两个匿名登录入口：64k + 独立桶 20r/m burst 5 + limit_conn 3
        location = /api/login {
            client_max_body_size 64k;
            limit_req zone=hn_login burst=5 nodelay;
            limit_conn hn_conn 3;
            proxy_pass http://127.0.0.1:__APP_PORT__;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/device_login {
            client_max_body_size 64k;
            limit_req zone=hn_login burst=5 nodelay;
            limit_conn hn_conn 3;
            proxy_pass http://127.0.0.1:__APP_PORT__;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 其余 API：2 MB + burst 150（**不要**压到 30：6 个待验证 Word 轮询 = 72 r/m）+ limit_conn 12
        location /api/ {
            client_max_body_size 2m;
            limit_req zone=hn_api burst=150 nodelay;
            limit_conn hn_conn 12;
            proxy_pass http://127.0.0.1:__APP_PORT__;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 更新包静态目录（生产 alias /home/printer-backend/updates/）
        location /updates/ {
            alias updates/;
            default_type application/octet-stream;
            add_header Access-Control-Allow-Origin *;
            limit_req zone=hn_api burst=20 nodelay;
            limit_conn hn_conn 8;
        }

        # Socket.IO：S0-01 核心（16 条匿名连接 → 第 7 条起 429）
        location /socket.io/ {
            limit_req zone=hn_sio burst=20 nodelay;
            limit_conn hn_conn 6;
            proxy_pass http://127.0.0.1:__APP_PORT__/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # 兜底：1 MB + burst 20 + 60s 读超时
        location / {
            client_max_body_size 1m;
            limit_req zone=hn_api burst=20 nodelay;
            limit_conn hn_conn 12;
            proxy_pass http://127.0.0.1:__APP_PORT__;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
