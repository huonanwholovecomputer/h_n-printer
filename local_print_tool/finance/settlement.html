<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>打印项目 · 收支清算</title>
<style>
/* 注册自定义颜色属性：主题切换时 header 渐变等可平滑过渡（Chromium/Safari/新 Firefox 支持） */
@property --header-from { syntax: '<color>'; inherits: true; initial-value: #23244d; }
@property --header-to   { syntax: '<color>'; inherits: true; initial-value: #3b2f7d; }

/* ==================== 设计令牌 ==================== */
:root {
  --bg: #f3f4f8; --bg-soft: #eef0f5; --card: #ffffff; --card-2: #f8f9fc;
  --text: #1b1d2a; --muted: #6b7280; --border: #e3e6ee; --border-strong: #d3d7e2;
  --primary: #4f6ef7; --primary-strong: #3d5bf0; --primary-soft: #eef1ff;
  --green: #16a34a; --orange: #f59e0b; --pos: #16a34a; --neg: #e11d48;
  --shadow-sm: 0 1px 2px rgba(20,22,40,.06);
  --shadow-md: 0 8px 26px rgba(20,22,40,.09);
  --shadow-lg: 0 20px 55px rgba(20,22,40,.20);
  --radius: 14px; --radius-sm: 9px;
  --content-max: 1360px;   /* v5.1：宽屏内容宽度上限（居中布局），避免 100% 拉伸影响阅读；可在此调整 */
  --header-from: #23244d; --header-to: #3b2f7d;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0f1117; --bg-soft: #141722; --card: #1a1d29; --card-2: #202431;
  --text: #e8eaf2; --muted: #9aa1b5; --border: #262b3b; --border-strong: #343b4f;
  --primary: #6c86ff; --primary-strong: #8aa0ff; --primary-soft: rgba(108,134,255,.15);
  --green: #34d399; --orange: #fbbf24; --pos: #34d399; --neg: #fb7185;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
  --shadow-md: 0 8px 26px rgba(0,0,0,.40);
  --shadow-lg: 0 20px 55px rgba(0,0,0,.55);
  --header-from: #16182a; --header-to: #2a2450;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Segoe UI','Microsoft YaHei',-apple-system,sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.55;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ==================== 顶栏 ==================== */
.app-header {
  background: linear-gradient(135deg, var(--header-from), var(--header-to));
  color: #fff;
  box-shadow: 0 4px 20px rgba(15,15,40,.25);
}
.header-inner {
  max-width: var(--content-max); margin: 0 auto; padding: 12px 20px 0;   /* 宽屏居中后主题按钮不再悬停于内容右侧，恢复对称内边距 */
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.app-header h1 { font-size: 1.18rem; font-weight: 700; letter-spacing: .3px; display: flex; align-items: center; gap: 8px; }
.app-header h1 .logo { font-size: 1.5rem; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cloud-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 999px; font-size: .78rem; font-weight: 600;
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
}
.cloud-pill.ok { color: #b9f6ca; background: rgba(34,197,94,.18); border-color: rgba(34,197,94,.4); }
.cloud-pill.bad { color: #ffb4c2; background: rgba(244,63,94,.18); border-color: rgba(244,63,94,.4); }
.cloud-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.icon-btn {
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
  color: #fff; width: 34px; height: 34px; border-radius: 9px; cursor: pointer;
  font-size: 1rem; display: inline-flex; align-items: center; justify-content: center;
  transition: transform .18s ease, background .2s ease;
}
.icon-btn:hover { transform: translateY(-1px) scale(1.05); background: rgba(255,255,255,.2); }
.path-text { font-size: .74rem; color: rgba(255,255,255,.62); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 窗口较窄时（内容列贴近右上悬浮主题按钮，重叠临界约 1476px），重新为按钮预留右侧空间 */
@media (max-width: 1475px) {
  .header-inner { padding-right: 64px; }
}

/* ==================== Tab 导航 ==================== */
.tab-nav {
  max-width: var(--content-max); margin: 0 auto; padding: 8px 20px 10px;
  display: flex; gap: 4px; overflow-x: auto;
}
.tab-nav button {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 15px; border: none; border-radius: 10px;
  background: transparent; color: rgba(255,255,255,.78); cursor: pointer;
  font-size: .86rem; font-weight: 500; font-family: inherit; white-space: nowrap;
  transition: background .2s ease, color .2s ease, transform .15s ease;
}
.tab-nav button:hover { background: rgba(255,255,255,.13); color: #fff; transform: translateY(-1px); }
.tab-nav button.on { background: #fff; color: var(--header-from); font-weight: 700; box-shadow: 0 3px 12px rgba(0,0,0,.2); }
.tab-nav button .ico { font-size: 1.02rem; }

/* ==================== 主区域 ==================== */
main { max-width: var(--content-max); margin: 0 auto; padding: 20px 20px 60px; }
.tab { display: none; }
.tab.on { display: block; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ==================== 卡片与区块 ==================== */
.section {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
  transition: box-shadow .25s ease, transform .25s ease;
}
.section:hover { box-shadow: var(--shadow-md); }
.section h2 { font-size: 1.02rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.section h2 .hint { font-weight: 400; font-size: .8rem; color: var(--muted); }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
}
.kpi-card::before { content:''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 0 3px 3px 0; }
.kpi-card.c-blue::before { background: var(--primary); }
.kpi-card.c-green::before { background: var(--green); }
.kpi-card.c-orange::before { background: var(--orange); }
.kpi-card.c-red::before { background: var(--neg); }
.kpi-card .kpi-ico { font-size: 1.2rem; }
.kpi-card .num { font-size: 1.55rem; font-weight: 800; line-height: 1.25; letter-spacing: -.3px; }
.kpi-card .lbl { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }
.kpi-card .sub { font-size: .76rem; color: var(--muted); margin-top: 3px; }

/* ==================== 表格 ==================== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; }
th, td { padding: 10px 14px; text-align: center; border-bottom: 1px solid var(--border); }
th { background: var(--card-2); font-weight: 600; font-size: .8rem; color: var(--muted); }
td.l { text-align: left; }
tbody tr { transition: background .15s ease; }
tbody tr:hover { background: var(--card-2); }
.tfoot td { font-weight: 700; background: var(--card-2); border-top: 2px solid var(--border); }
.pos { color: var(--pos); font-weight: 700; }
.neg { color: var(--neg); font-weight: 700; }

/* ==================== 按钮 / 表单 ==================== */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 8px 16px; border: 1px solid var(--border-strong); border-radius: 9px; cursor: pointer;
  font-size: .85rem; font-weight: 500; font-family: inherit; background: var(--card); color: var(--text);
  transition: all .18s ease; position: relative; overflow: hidden;
}
.btn:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.btn:active { transform: translateY(0); }
.btn.pri { background: var(--primary); color: #fff; border-color: transparent; }
.btn.pri:hover { background: var(--primary-strong); color: #fff; box-shadow: 0 6px 16px rgba(79,110,247,.35); }
.btn.danger { color: var(--neg); border-color: rgba(225,29,72,.45); }
.btn.danger:hover { background: rgba(225,29,72,.08); color: var(--neg); border-color: var(--neg); }
.btn.green { background: var(--green); color: #fff; border-color: transparent; }
.btn.green:hover { background: #0f9d50; color: #fff; box-shadow: 0 6px 16px rgba(22,163,74,.3); }
.btn.sm { padding: 4px 11px; font-size: .78rem; border-radius: 7px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--card-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; }

.input, input[type=text], input[type=number], input[type=password], input[type=date], input[type=color], select {
  padding: 8px 12px; border: 1px solid var(--border-strong); border-radius: 9px;
  font-size: .88rem; font-family: inherit; background: var(--card); color: var(--text);
  transition: border-color .18s ease, box-shadow .18s ease;
}
.input:focus, input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
input[type=number] { width: 110px; }
input[type=date] { width: 150px; }
input:disabled, select:disabled { opacity: .5; cursor: not-allowed; }
input[type=range] { accent-color: var(--primary); }
/* 滑块聚焦/拖动时不套用通用 input 聚焦的 box-shadow 方框 */
input[type=range]:focus, input[type=range]:focus-visible { outline: none; box-shadow: none; }

.filter-bar {
  display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap;
  padding: 16px 18px; margin-bottom: 16px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm);
}
.filter-bar .f-item label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; }

/* ==================== 云端 · 全局口径栏（v6.0） ==================== */
.scope-bar {
  padding: 14px 18px 10px; margin-bottom: 16px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm);
}
.scope-row { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
.scope-row .f-item > label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.scope-summary {
  margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--border);
  font-size: .8rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
}
.scope-summary b { color: var(--text); }
.dd { position: relative; display: inline-block; }
.dd-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px;
  border: 1px solid var(--border-strong); border-radius: 9px; background: var(--card); color: var(--text);
  font-size: .88rem; cursor: pointer; font-family: inherit; transition: border-color .15s ease;
}
.dd-btn:hover { border-color: var(--primary); }
.dd-btn.filtered { border-color: var(--primary); color: var(--primary); font-weight: 700; }
.dd-btn .dd-caret { font-size: .7rem; color: var(--muted); }
.dd-panel {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 70; min-width: 210px;
  max-height: 300px; overflow: auto; padding: 6px;
  background: var(--card); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: var(--shadow-md);
}
.dd-head { display: flex; justify-content: space-between; padding: 2px 4px 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.dd-head button { font-size: .74rem; color: var(--primary); background: none; border: none; cursor: pointer; padding: 2px 6px; font-family: inherit; }
.dd-head button:hover { text-decoration: underline; }
.dd-group { font-size: .72rem; color: var(--muted); font-weight: 700; padding: 6px 8px 2px; }
.dd-opt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: .85rem; user-select: none; }
.dd-opt:hover { background: var(--card-2); }
.dd-opt input { accent-color: var(--primary); cursor: pointer; flex: none; }
.status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.status-dot.sent { background: #2E7D32; } .status-dot.printing { background: #1565C0; }
.status-dot.queued { background: #E65100; } .status-dot.failed { background: #C62828; }
.status-dot.canceled { background: #9E9E9E; } .status-dot.offline_unknown { background: #F57F17; }
.status-dot.rejected { background: #E65100; } .status-dot.accepted { background: #1565C0; }
.status-dot.abandoned { background: #7B1FA2; } .status-dot.reserved { background: #F57F17; }
.status-dot.scheduled { background: #F57F17; } .status-dot.waiting { background: #00897B; } .status-dot.downloading { background: #1565C0; }

/* ==================== 标签 ==================== */
.tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .74rem; font-weight: 600; }
.tag.g { background: rgba(22,163,74,.13); color: var(--pos); }
.tag.r { background: rgba(225,29,72,.12); color: var(--neg); }
.tag.b { background: rgba(79,110,247,.13); color: var(--primary); }
.tag.y { background: rgba(245,158,11,.16); color: #b45309; }
[data-theme="dark"] .tag.y { color: #fbbf24; }
.tag.p { background: rgba(139,92,246,.15); color: #8b5cf6; }
[data-theme="dark"] .tag.p { color: #a78bfa; }
/* 订单类型固定槽位网格（v5.23）：相同/同类标签在不同订单间竖直对齐——
   单行 7 槽：自打/接单 | 自动 | 预约 | 免费 | 派送 | 加急 | 封面。
   每个槽位固定宽度，无标签时留空占位，保证跨行对齐。 */
.type-grid { display: grid; grid-template-columns: repeat(7, 58px); gap: 4px; }
.type-cell { display: flex; align-items: center; justify-content: center; min-height: 22px; }
/* 订单状态标签配色：与微信小程序 status-* 完全一致（亮色=小程序亮色主题，深色=小程序暗色主题） */
.tag.st-sent            { background: #E8F5E9; color: #2E7D32; }
.tag.st-printing        { background: #E3F2FD; color: #1565C0; }
.tag.st-accepted        { background: #E3F2FD; color: #1565C0; }
.tag.st-queued          { background: #FFF3E0; color: #E65100; }
.tag.st-failed          { background: #FFEBEE; color: #C62828; }
.tag.st-canceled        { background: #F5F5F5; color: #9E9E9E; }
.tag.st-rejected        { background: #FFF3E0; color: #E65100; }
.tag.st-abandoned       { background: #F3E5F5; color: #7B1FA2; }
.tag.st-reserved        { background: #FFF8E1; color: #F57F17; }
.tag.st-offline_unknown { background: #FFF8E1; color: #F57F17; }
[data-theme="dark"] .tag.st-sent            { background: rgba(129,199,132,.15); color: #81C784; }
[data-theme="dark"] .tag.st-printing        { background: rgba(100,181,246,.15); color: #64B5F6; }
[data-theme="dark"] .tag.st-accepted        { background: rgba(100,181,246,.15); color: #64B5F6; }
[data-theme="dark"] .tag.st-queued          { background: rgba(255,179,77,.15); color: #FFB74D; }
[data-theme="dark"] .tag.st-failed          { background: rgba(229,115,115,.15); color: #E57373; }
[data-theme="dark"] .tag.st-canceled        { background: rgba(174,174,178,.15); color: #AEAEB2; }
[data-theme="dark"] .tag.st-rejected        { background: rgba(255,179,77,.15); color: #FFB74D; }
[data-theme="dark"] .tag.st-abandoned       { background: rgba(186,104,200,.15); color: #BA68C8; }
[data-theme="dark"] .tag.st-reserved        { background: rgba(255,213,79,.15); color: #FFD54F; }
[data-theme="dark"] .tag.st-offline_unknown { background: rgba(255,213,79,.15); color: #FFD54F; }
.tag.st-scheduled      { background: #FFF8E1; color: #F57F17; }
.tag.st-waiting        { background: #E0F2F1; color: #00897B; }
.tag.st-downloading    { background: #E3F2FD; color: #1565C0; }
[data-theme="dark"] .tag.st-scheduled      { background: rgba(255,213,79,.15); color: #FFD54F; }
[data-theme="dark"] .tag.st-waiting        { background: rgba(77,182,172,.15); color: #4DB6AC; }
[data-theme="dark"] .tag.st-downloading    { background: rgba(100,181,246,.15); color: #64B5F6; }
.member-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: .82rem; font-weight: 600; color: #fff; box-shadow: var(--shadow-sm); }
.member-del { cursor: pointer; opacity: .65; font-size: 1rem; transition: opacity .15s ease; }
.member-del:hover { opacity: 1; }

/* v24：管理员订单统计 —— 自打/接单比例条 */
.ratio-bar { display: inline-flex; width: 90px; height: 10px; border-radius: 5px; overflow: hidden; background: rgba(127,127,127,.15); margin-right: 8px; vertical-align: -1px; }
.ratio-bar .ratio-own { background: #007AFF; height: 100%; }
.ratio-bar .ratio-acc { background: #FF9500; height: 100%; }
.unlock-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(22,163,74,.1); border: 1px solid rgba(22,163,74,.3); color: var(--pos); padding: 5px 12px; border-radius: 999px; font-size: .8rem; font-weight: 600; }
.lock-bar {
  display: flex; align-items: center; gap: 14px; justify-content: space-between; flex-wrap: wrap;
  background: var(--primary-soft); border: 1px dashed var(--primary);
  padding: 10px 16px; border-radius: 10px; margin-bottom: 14px; font-size: .85rem;
}

/* ==================== 转账指令 ==================== */
.settle-box { background: var(--card); border: 2px solid var(--orange); border-radius: var(--radius); padding: 20px; margin-top: 18px; }
.settle-box h2 { color: var(--orange); margin-bottom: 12px; }
/* 资金重分配表格横线加深（卡片背景与普通卡片一致，避免横线被亮背景淹没） */
.settle-box table th, .settle-box table td { border-bottom: 1px solid var(--border-strong); }
.transfer { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: 1.02rem; }
.transfer .arrow { font-size: 1.25rem; color: var(--muted); }
.transfer .amount { font-weight: 800; font-size: 1.15rem; color: var(--pos); }

/* ==================== 图表 ==================== */
.chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 16px; }
.chart-grid .section { margin-bottom: 0; }
.chart-wrap { position: relative; width: 100%; height: 270px; }
.chart-wrap.tall { height: 330px; }
.chart-wrap canvas { width: 100% !important; height: 100% !important; }

/* ==================== 模态框 ==================== */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 200; background: rgba(15,15,35,.5); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  opacity: 0; transition: opacity .2s ease;
}
.modal-backdrop.in { opacity: 1; }
.modal-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); width: 100%; max-width: 420px; padding: 22px;
  transform: scale(.94) translateY(8px); transition: transform .22s cubic-bezier(.2,.9,.3,1.3);
}
.modal-backdrop.in .modal-card { transform: scale(1) translateY(0); }
.modal-card h3 { font-size: 1.05rem; margin-bottom: 12px; }
.modal-card .modal-body { margin-bottom: 18px; font-size: .9rem; }
.modal-card .modal-body input, .modal-card .modal-body select { width: 100%; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

/* ==================== Toast ==================== */
#toastWrap { position: fixed; bottom: 26px; right: 26px; z-index: 300; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
.toast {
  background: var(--text); color: var(--bg); padding: 11px 20px; border-radius: 11px;
  font-size: .85rem; font-weight: 500; box-shadow: var(--shadow-lg);
  animation: toastIn .3s cubic-bezier(.2,.9,.3,1.2) both; max-width: 340px;
}
.toast.error { background: var(--neg); color: #fff; }
.toast.success { background: var(--green); color: #fff; }
@keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.92); } to { opacity: 1; transform: none; } }
.toast.out { transition: all .3s ease; opacity: 0; transform: translateY(10px); }

/* ==================== 空状态 / 骨架屏 ==================== */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty .ico { font-size: 3rem; margin-bottom: 8px; }
.skeleton { background: linear-gradient(100deg, var(--card-2) 40%, var(--border) 50%, var(--card-2) 60%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: 8px; }
@keyframes shimmer { to { background-position: -200% 0; } }
.loading-spin { display: inline-block; width: 18px; height: 18px; border: 2.5px solid var(--border-strong); border-top-color: var(--primary); border-radius: 50%; animation: spin .65s linear infinite; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ==================== 订单明细 ==================== */
/* 订单明细卡片单独突破 main 的 max-width 居中布局，扩展到整个视口宽度（左右留 20px 与页面内边距一致）；
   窄窗口下 main 本就占满，calc 自动归零不影响。表格 min-width 较大时宽屏能更充分利用空间。 */
#cloud-orders {
  margin-left: calc(50% - 50vw + 20px);
  margin-right: calc(50% - 50vw + 20px);
}
.order-row { cursor: pointer; }
.order-row.expanded { background: var(--primary-soft); }
/* 展开容器：整块内容高度 0fr↔1fr 过渡，下方订单行随高度平滑下移/上移 */
.file-expand-cell { padding: 0; border-bottom: none; }
.file-expand.open .file-expand-cell { border-bottom: 1px solid var(--border); }
.file-expand-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .32s cubic-bezier(.4, 0, .2, 1);
}
.file-expand.open .file-expand-body { grid-template-rows: 1fr; }
.file-expand-inner { min-height: 0; overflow: hidden; }
/* 文件明细网格：文件名弹性占宽，信息列定宽 */
/* 备注行：背景与文件列表表头一致（--card-2 灰底），不用主题蓝 */
.order-remark {
  margin: 6px 0;
  padding: 8px 12px;
  background: var(--card-2);
  border-radius: 4px;
  font-size: .78rem;
  line-height: 1.7;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-all;
}
.file-grid { display: grid; grid-template-columns: minmax(0, 1fr) 72px 64px 104px 78px 96px; gap: 10px; align-items: center; padding: 6px 14px; font-size: .8rem; }
.file-grid .fn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.file-grid.file-sub-head { font-size: .72rem; font-weight: 600; color: var(--muted); background: var(--card-2); border-top: 1px solid var(--border-strong); padding-top: 5px; padding-bottom: 5px; }
.file-grid.file-sub-row { color: var(--muted); border-top: 1px dashed var(--border); }
.expand-icon { display: inline-block; transition: transform .2s ease; font-size: .68rem; margin-right: 4px; color: var(--muted); }
.order-row.expanded .expand-icon { transform: rotate(90deg); }
/* 订单明细表：固定布局，列宽由表头决定，展开子行不重排列宽；min-width 保证窄窗口仍可横向滚动。
   类型列 270px = 全量类型标签宽度（450px）的 60%（接单+自动+预约+加急+派送+封面+免费），
   宽窗口时多余空间按比例放大各列，类型列只会更宽不会更窄。 */
.order-table { table-layout: fixed; width: 100%; min-width: 1582px; }
.order-table .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bound-badge { font-size: .7rem; padding: 1px 8px; border-radius: 999px; font-weight: 600; }
.bound-badge.yes { background: rgba(22,163,74,.13); color: var(--pos); }
.bound-badge.no { background: var(--card-2); color: var(--muted); }

/* ==================== 设置行 ==================== */
.settings-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.settings-row:last-child { border-bottom: none; }
.settings-row label { min-width: 96px; font-weight: 600; font-size: .88rem; }

/* ==================== 离线阻断层 ==================== */
#blockOverlay {
  position: fixed; inset: 0; z-index: 400; background: var(--bg);
  display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 24px;
}
#blockOverlay.show { display: flex; animation: fadeIn .3s ease; }
#blockOverlay .ico { font-size: 56px; }
#blockOverlay h2 { color: var(--text); }
#blockOverlay p { color: var(--muted); max-width: 380px; }

/* ==================== 云端 v5：运营驾驶舱组件 ==================== */
/* 对账/异常提示条：置顶通栏（有差额/未绑定用户时才渲染） */
.alert-banner {
  display: flex; align-items: center; gap: 14px;
  background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.35);
  border-left: 4px solid var(--orange); border-radius: var(--radius);
  padding: 13px 18px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
}
.alert-banner.danger { background: rgba(225,29,72,.08); border-color: rgba(225,29,72,.3); border-left-color: var(--neg); }
.alert-banner .ico { font-size: 1.25rem; flex: none; }
.alert-banner .msg { flex: 1; font-size: .88rem; }
.alert-banner .msg b { color: var(--orange); }
.alert-banner.danger .msg b { color: var(--neg); }
.alert-banner .msg .sub { display: block; font-size: .74rem; color: var(--muted); margin-top: 2px; }
.alert-banner button {
  flex: none; padding: 6px 13px; border-radius: 8px; border: 1px solid var(--orange);
  background: transparent; color: var(--orange); font-weight: 600; cursor: pointer;
  font-size: .78rem; font-family: inherit; transition: all .18s ease;
}
.alert-banner button:hover { background: rgba(245,158,11,.12); }
.alert-banner.danger button { border-color: var(--neg); color: var(--neg); }
.alert-banner.danger button:hover { background: rgba(225,29,72,.1); }

/* Hero KPI（4 卡）：迷你趋势线 / 环比徽标 / 半环仪表盘 */
.hero-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 18px; }
.hero-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; min-height: 118px;
}
.hero-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 0 3px 3px 0; }
.hero-card.c-green::before { background: var(--green); }
.hero-card.c-blue::before { background: var(--primary); }
.hero-card.c-orange::before { background: var(--orange); }
.hero-card .top-row { display: flex; align-items: flex-start; justify-content: space-between; }
.hero-card .ico { font-size: 1.15rem; }
.hero-card .badge { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.badge.up { color: var(--pos); background: rgba(22,163,74,.12); }
.badge.down { color: var(--neg); background: rgba(225,29,72,.12); }
.hero-card .num { font-size: 1.55rem; font-weight: 800; margin-top: 8px; letter-spacing: -.3px; line-height: 1.25; }
.hero-card .lbl { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }
.hero-card .sub { font-size: .73rem; color: var(--muted); margin-top: 6px; }
.gauge-wrap { position: relative; height: 88px; margin-top: 4px; }
.gauge-wrap canvas { width: 100% !important; height: 100% !important; }
.gauge-center { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-size: 1.3rem; font-weight: 800; color: var(--primary); }

/* 订单漏斗（订单 → 文件 → 打印页 → 完成） */
.funnel-strip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.f-step { display: flex; align-items: baseline; gap: 6px; }
.f-step .fv { font-size: 1.12rem; font-weight: 800; color: var(--primary); }
.f-step .fl { font-size: .76rem; color: var(--muted); }
.f-arrow { color: var(--border-strong); font-size: 1rem; }
.f-meta { margin-left: auto; font-size: .8rem; color: var(--pos); font-weight: 600; }

/* 分段控制器（收益视角 / 运营视角） */
.segmented { display: inline-flex; background: var(--card-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; margin-bottom: 14px; }
.segmented button {
  border: none; background: transparent; padding: 7px 16px; border-radius: 999px;
  font-size: .82rem; font-weight: 600; color: var(--muted); cursor: pointer;
  font-family: inherit; transition: all .18s ease; white-space: nowrap;
}
.segmented button:hover { color: var(--text); }
.segmented button.on { background: var(--card); color: var(--primary); box-shadow: var(--shadow-sm); }

/* 👥 成员排行榜（进度条卡片） */
.rank-list { display: flex; flex-direction: column; gap: 10px; }
.rank-row { display: grid; grid-template-columns: 30px 175px 1fr 108px 62px; align-items: center; gap: 12px; }
.rank-medal { font-size: 1.02rem; text-align: center; }
.rank-name { display: flex; align-items: center; gap: 6px; font-size: .84rem; font-weight: 600; min-width: 0; }
.rank-name .rank-nick { font-size: .7rem; color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.rank-bar { height: 10px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
.rank-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), var(--primary-strong)); transition: width .6s ease; }
.rank-amt { text-align: right; font-weight: 700; font-size: .88rem; color: var(--pos); white-space: nowrap; }
.rank-orders { text-align: right; font-size: .76rem; color: var(--muted); white-space: nowrap; }
.rank-row.unbound { cursor: pointer; }
.rank-row.unbound:hover .rank-name { color: var(--neg); }
.rank-row.unbound .rank-fill { background: linear-gradient(90deg, var(--neg), #f87171); }
.rank-row.unbound .rank-amt { color: var(--neg); }

/* 趋势分析：区间切换工具栏（v5.2）+ v5.15 自绘日历组件 */
.trend-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.trend-toolbar .segmented { margin-bottom: 0; }
.trend-toolbar .trend-metrics { margin-left: auto; }
.trend-dates { display: inline-flex; align-items: center; gap: 6px; }
/* 日期字段：伪输入框，点击弹出日历 */
.date-field {
  display: inline-flex; align-items: center; gap: 5px; width: 124px;
  padding: 5px 9px; border: 1px solid var(--border-strong); border-radius: 8px;
  background: var(--card); color: var(--text); font-size: .78rem; cursor: pointer;
  font-family: inherit; transition: border-color .18s ease, box-shadow .18s ease;
}
.date-field:hover { border-color: var(--primary); }
.date-field.on { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
.date-field .cal-ico { font-size: .82rem; line-height: 1; }
.date-field .df-txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.date-field .df-txt.placeholder { color: var(--muted); }
/* 日历浮层 */
.cal-pop {
  position: fixed; z-index: 220; width: 254px;
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: var(--shadow-lg); padding: 10px;
  animation: calIn .18s ease both;
}
@keyframes calIn { from { opacity: 0; transform: translateY(-4px) scale(.97); } to { opacity: 1; transform: none; } }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-title { font-weight: 700; font-size: .85rem; }
.cal-nav {
  border: none; background: transparent; color: var(--muted); font-size: 1rem; cursor: pointer;
  width: 26px; height: 26px; border-radius: 7px; font-family: inherit; line-height: 1;
  transition: background .15s ease, color .15s ease;
}
.cal-nav:hover { background: var(--card-2); color: var(--text); }
.cal-nav:disabled { opacity: .35; cursor: default; }
.cal-nav:disabled:hover { background: transparent; color: var(--muted); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-dow { text-align: center; font-size: .68rem; color: var(--muted); padding: 3px 0; }
.cal-day {
  border: none; background: transparent; color: var(--text); font-size: .78rem; cursor: pointer;
  height: 28px; border-radius: 8px; font-family: inherit; transition: background .12s ease;
}
.cal-day:hover { background: var(--primary-soft); }
.cal-day.sel { background: var(--primary); color: #fff; font-weight: 700; }
.cal-day.today { box-shadow: inset 0 0 0 1.5px var(--primary); }
.cal-day.range { background: var(--primary-soft); color: var(--primary); }
.cal-day.disabled { color: var(--border-strong); cursor: not-allowed; }
.cal-day.disabled:hover { background: transparent; }
.cal-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.cal-hint { font-size: .72rem; color: var(--muted); }
.cal-close {
  border: none; background: transparent; color: var(--muted); cursor: pointer;
  font-size: .74rem; font-family: inherit; padding: 3px 8px; border-radius: 7px;
  transition: background .15s ease, color .15s ease;
}
.cal-close:hover { background: var(--card-2); color: var(--text); }

/* 每日趋势：指标切换 + 环形图中心文字 */
.trend-metrics { margin-left: auto; display: inline-flex; background: var(--card-2); border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
.trend-metrics button {
  border: none; background: transparent; padding: 4px 10px; border-radius: 999px;
  font-size: .74rem; font-weight: 600; color: var(--muted); cursor: pointer; font-family: inherit; transition: all .18s ease;
}
.trend-metrics button.on { background: var(--card); color: var(--primary); box-shadow: var(--shadow-sm); }
.donut-center { position: absolute; left: 0; right: 0; top: 48%; transform: translateY(-50%); text-align: center; pointer-events: none; }
.donut-center .dc-num { font-size: 1.02rem; font-weight: 800; }
.donut-center .dc-lbl { font-size: .66rem; color: var(--muted); }

/* 订单明细：状态色条 */
tr.st-bar td:first-child { position: relative; }
tr.st-bar td:first-child::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 0 2px 2px 0; background: var(--row-stc, transparent); }
/* v5.16：订单明细分页条（参考小程序/APP 打印任务分页） */
.orders-pager { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 10px 0 4px; font-size: .78rem; color: var(--muted); }
.orders-pager .pager-info { margin-right: auto; }
.orders-pager .pager-btns { display: inline-flex; align-items: center; gap: 4px; }
.orders-pager .page-btn {
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  min-width: 26px; height: 26px; padding: 0 6px; border-radius: 7px; cursor: pointer;
  font-size: .78rem; font-family: inherit; line-height: 1; transition: all .15s ease;
}
.orders-pager .page-btn:hover:not(:disabled):not(.on) { background: var(--card-2); border-color: var(--border-strong); }
.orders-pager .page-btn.on { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }
.orders-pager .page-btn:disabled { opacity: .35; cursor: default; }
.orders-pager .page-ellipsis { padding: 0 2px; }
.orders-pager .pager-size select { padding: 3px 6px; border: 1px solid var(--border-strong); border-radius: 7px; background: var(--card); color: var(--text); font-size: .78rem; }

@media (max-width: 900px) { .hero-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .rank-row { grid-template-columns: 26px 108px 1fr 88px 52px; gap: 8px; } }

/* ==================== 响应式 ==================== */
@media (max-width: 760px) {
  .chart-grid { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .header-inner { flex-direction: column; align-items: flex-start; }
  .header-right { margin-left: 0; width: 100%; }
}

/* 主题切换瞬间：全页平滑渐变过渡（仅切换时启用，平时不生效以免影响悬停等微交互速度） */
html.theme-switching, html.theme-switching *,
html.theme-switching *::before, html.theme-switching *::after {
  transition: background-color .5s ease, color .5s ease, border-color .5s ease,
              box-shadow .5s ease, --header-from .5s ease, --header-to .5s ease !important;
}

/* ==================== 悬浮控件（右上主题 / 右下返回顶部，所有界面通用） ==================== */
.floating-btn {
  position: fixed; z-index: 90;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(127,127,127,.25);
  background: rgba(255,255,255,.72);
  color: var(--text);
  backdrop-filter: blur(12px) saturate(160%);
  -webkit-backdrop-filter: blur(12px) saturate(160%);
  box-shadow: 0 4px 16px rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.7);
  cursor: pointer; user-select: none; font-family: inherit;
  transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .3s ease, background .3s ease, box-shadow .3s ease;
}
.floating-btn:hover { transform: translateY(-1px) scale(1.06); }
.floating-btn:active { transform: scale(.86); }
#themeToggle { top: 14px; right: 16px; width: 42px; height: 42px; border-radius: 21px; font-size: 1.15rem; }
#backToTop {
  right: 96px; bottom: 96px; width: 40px; height: 40px; border-radius: 20px;
  opacity: 0; transform: scale(.8); pointer-events: none;
}
#backToTop.show { opacity: 1; transform: scale(1); pointer-events: auto; }
[data-theme="dark"] .floating-btn {
  background: rgba(26,26,28,.55); color: #e8eaf2;
  box-shadow: 0 4px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
}
/* 返回顶部箭头：双短线拼成 ^ 形（与小程序一致） */
.scroll-top-arrow { position: relative; width: 13px; height: 11px; }
.scroll-top-arrow::before, .scroll-top-arrow::after {
  content: ''; position: absolute; left: 50%; top: 0; width: 2.5px; height: 11px;
  border-radius: 2px; background: currentColor; transform-origin: 50% 0%;
}
.scroll-top-arrow::before { transform: translateX(-50%) rotate(-35deg); }
.scroll-top-arrow::after { transform: translateX(-50%) rotate(35deg); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; }
}

/* ==================== 防误操作：禁用元素拖动（文字选择已放开） ==================== */
/* 允许整页选中文字（已解除禁用）；输入框/下拉框/可编辑区保留选择 */
body { user-select: text; -webkit-user-select: text; -moz-user-select: text; }
/* 图片/按钮等默认不可拖拽（页面暂无图片，此条仅作兜底） */
img, button { -webkit-user-drag: none; }
</style>

<body>
<header class="app-header">
  <div class="header-inner">
    <h1><span class="logo">🖨️</span> 打印项目 · 收支清算</h1>
    <div class="header-right">
      <span class="cloud-pill" id="cloudPill"><span class="dot"></span> 检测中…</span>
      <span class="path-text" id="storageFilePath">☁ 云端</span>
    </div>
  </div>
  <nav class="tab-nav" id="tabNav">
    <button class="on" data-tab="dash"><span class="ico">📊</span>收支清算</button>
    <button data-tab="entry"><span class="ico">📝</span>手动记账</button>
    <button data-tab="cloud"><span class="ico">📡</span>云端数据</button>
    <button data-tab="history"><span class="ico">📅</span>历史记录</button>
    <button data-tab="settings"><span class="ico">⚙️</span>设置</button>
    <button data-tab="auth"><span class="ico">🔐</span>授权</button>
    <button data-tab="about"><span class="ico">ℹ️</span>关于</button>
  </nav>
</header>

<main>
  <div class="tab on" id="tab-dash"></div>
  <div class="tab" id="tab-entry"></div>
  <div class="tab" id="tab-cloud"></div>
  <div class="tab" id="tab-history"></div>
  <div class="tab" id="tab-settings"></div>
  <div class="tab" id="tab-auth"></div>
  <div class="tab" id="tab-about"></div>
</main>

<script>
/* 首帧绘制前恢复 tab 选中态（防闪）：默认 HTML 写死「收支清算」选中，
   若上次/深链指向其他 tab，这里在浏览器绘出首帧之前同步搬移 on 类，
   避免「先闪一下总览选中再切换」。只改类名不渲染内容——内容仍由
   页面尾部的 switchTab(window.__initialTab) 统一走正常初始化。 */
(function () {
  var tab = null;
  try { tab = new URLSearchParams(location.search).get('tab'); } catch (e) {}
  var fromUrl = tab === 'settings' || tab === 'auth';
  if (!fromUrl) {
    try { tab = sessionStorage.getItem('finance_last_tab'); } catch (e2) {}
  }
  var valid = ['dash', 'entry', 'cloud', 'history', 'settings', 'auth', 'about'];
  if (!tab || valid.indexOf(tab) === -1) tab = 'dash';
  // FINANCE_MODE 此时还没赋值，这里按同样规则解析一次（仅用于本地模式隐藏授权入口的判定）

/* ==================== 结算算法（与 printer_config / 后端共享口径） ====================
   金额一律用「整数分」累加（parseCents 换算），避免浮点误差；返回结果均为分。 */
function calcMonth(m) {
  var members = getMembers();
  var rate = getRate();
  var scoreCap = getScoreCap();
  var exps = m.expenses || [];
  var inc = m.income || {};
  var scores = m.scores || {};
  var totalExp = exps.reduce(function (s, e) { return s + parseCents(e.amount); }, 0);
  var perPerson = members.length > 0 ? Math.round(totalExp / members.length) : 0;
  var totalInc = 0;
  members.forEach(function (mem) { totalInc += parseCents(inc[mem.id] || 0); });

  var scoreTotals = {}, totalScore = 0;
  members.forEach(function (mem) {
    var items = scores[mem.id] || [];
    scoreTotals[mem.id] = items.reduce(function (s, x) { return s + Math.min(x.score || 0, scoreCap); }, 0);
    totalScore += scoreTotals[mem.id];
  });

  var paid = {};
  members.forEach(function (m) { paid[m.id] = 0; });
  exps.forEach(function (e) { paid[e.payer] = (paid[e.payer] || 0) + parseCents(e.amount); });

  var investPool = Math.round(totalInc * rate);
  var servicePool = totalInc - investPool;
  var memberCount = members.length || 1;

  var investReturn = {};
  members.forEach(function (mem) { investReturn[mem.id] = Math.round(investPool / memberCount); });

  var serviceReturn = {};
  members.forEach(function (mem) {
    var ratio = totalScore > 0 ? scoreTotals[mem.id] / totalScore : 1 / memberCount;
    serviceReturn[mem.id] = Math.round(servicePool * ratio);
  });

  var redist = {};
  members.forEach(function (mem) { redist[mem.id] = investReturn[mem.id] + serviceReturn[mem.id]; });

  var net = {};
  members.forEach(function (mem) {
    net[mem.id] = redist[mem.id] - perPerson - parseCents(inc[mem.id] || 0) + (paid[mem.id] || 0);
  });

  var balances = members.map(function (m) { return { id: m.id, net: net[m.id] }; });
  // 转账阈值：1 分（整数分，≤ -1 分为欠款方，≥ 1 分为收款方）
  var payers = balances.filter(function (b) { return b.net <= -1; }).sort(function (a, b) { return a.net - b.net; });
  var receivers = balances.filter(function (b) { return b.net >= 1; }).sort(function (a, b) { return a.net - b.net; });
  var transfers = [];
  var pi = 0, ri = 0;
  var rem = {};
  balances.forEach(function (b) { rem[b.id] = b.net; });
  while (pi < payers.length && ri < receivers.length) {
    var debt = Math.abs(rem[payers[pi].id]);
    var credit = rem[receivers[ri].id];
    var amt = Math.min(debt, credit);
    if (amt >= 1) transfers.push({ from: payers[pi].id, to: receivers[ri].id, amount: amt });
    rem[payers[pi].id] += amt;
    rem[receivers[ri].id] -= amt;
    if (Math.abs(rem[payers[pi].id]) < 1) pi++;
    if (Math.abs(rem[receivers[ri].id]) < 1) ri++;
  }

  return { rate: rate, totalExp: totalExp, perPerson: perPerson, totalInc: totalInc, scoreTotals: scoreTotals, totalScore: totalScore,
           paid: paid, investPool: investPool, servicePool: servicePool, investReturn: investReturn, serviceReturn: serviceReturn,
           redist: redist, net: net, transfers: transfers, members: members, memberCount: memberCount, scoreCap: scoreCap };
}

    var h = '<div class="modal-card" role="dialog">';

    h += '<button class="btn ' + (opts.danger ? 'danger' : 'pri') + '" data-act="ok">' + (opts.confirmText || '确定') + '</button>';

    }

    if (inputEl) setTimeout(function () { inputEl.focus(); }, 60);
    function close(val) {

/* ==================== 数字滚动 ==================== */
function countUp(el, target, opts) {
  var dur = (opts && opts.dur) || 850;
  var dec = (opts && opts.dec) != null ? opts.dec : 2;
  var fmt = (opts && opts.fmt) || function (n) { return n.toFixed(dec); };
  var start = null;
  function step(ts) {
    if (!start) start = ts;
    var p = Math.min((ts - start) / dur, 1);
    var ease = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(target * ease);
    if (p < 1) requestAnimationFrame(step); else el.textContent = fmt(target);
  }
  requestAnimationFrame(step);
}

function chartTextColor() {

/* 饼状图引线标签：从扇区内部一点出发 → 弧外折点 → 水平短段到文字（指示块属性，替代图例）。
   文字紧邻折点放置，超出画布边缘时自动回缩锚定边缘，引线尽可能短。
   防重叠处理（v4.4 修复）：
   · 过小扇区（弧角 < MIN_ARC）跳过标注，避免多状态时小扇区文字互相重叠（tooltip 仍可查明细）；
   · 同侧标签按 y 排序做碰撞检测：垂直间距不足时向下错开，放不下则隐藏；
   · 引线水平段只画到文字近边前 2px，杜绝「引线压在文字上」的叠字问题。 */
var _leaderLabelPlugin = {
  id: 'leaderLabels',
  afterDatasetsDraw: function (chart) {
    if (chart.config.type !== 'doughnut') return;
    var meta = chart.getDatasetMeta(0);
    var arcs = meta && meta.data;
    if (!arcs || !arcs.length) return;
    var ds = chart.data.datasets[0] || {};
    var bgs = ds.backgroundColor || [];
    var labels = chart.data.labels || [];
    var ctx = chart.ctx;
    var w = chart.width, h = chart.height;
    ctx.save();
    ctx.font = '600 12px -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.textBaseline = 'middle';

    var MIN_ARC = 0.09;   // 弧度：小于该弧角的扇区不画标签（≈5.2°，约 1.4%）。
                          // 足够低让 1%+ 的孤立小扇区也能标注；拥挤场景由下方碰撞检测错开/隐藏兜底
    var LABEL_GAP = 16;   // 同侧标签最小垂直间距（px）
    var EDGE = 12;        // 上下留边

    // ── 第 1 步：收集候选标签（跳过过小扇区）──
    var items = [];
    arcs.forEach(function (arc, i) {
      if (!arc || typeof arc.startAngle !== 'number') return;
      var span = arc.endAngle - arc.startAngle;
      if (span < MIN_ARC) return;
      var mid = arc.startAngle + span / 2;
      var cx = arc.x, cy = arc.y;
      var inner = arc.innerRadius, outer = arc.outerRadius;
      // 标注文字/线段颜色：取扇区色的「加深」色阶，与扇区填充色区分开——
      // 保留「标签→扇区」的色彩关联，同时避免文字/线段与扇区颜色完全重合（统一压暗 20%）
      var col = _mixToBlack(bgs[i] || '#888', 0.20);
      var cosM = Math.cos(mid), sinM = Math.sin(mid);
      var right = cosM >= 0;
      // 起点：扇区内部（环厚中点，指示该块）
      var r0 = inner + (outer - inner) / 2;
      var sx = cx + cosM * r0, sy = cy + sinM * r0;
      // 折点：弧外一点
      var bx = cx + cosM * (outer + 6), by = cy + sinM * (outer + 6);
      // 上下留边，避免垂直方向文字出界
      by = Math.max(EDGE, Math.min(h - EDGE, by));
      var txt = labels[i] || '';
      // v4.4：超长标签截断加省略号（悬停 tooltip 可看全文），防止文字溢出画布
      var MAX_TW = Math.max(110, Math.floor(w * 0.32));
      var tw = ctx.measureText(txt).width;
      if (tw > MAX_TW) {
        while (txt.length > 1 && ctx.measureText(txt + '…').width > MAX_TW) {
          txt = txt.slice(0, -1);
        }
        txt += '…';
        tw = ctx.measureText(txt).width;
      }
      items.push({ right: right, sx: sx, sy: sy, bx: bx, by: by, txt: txt, tw: tw, col: col, hidden: false });
    });
    if (!items.length) { ctx.restore(); return; }

    // ── 第 2 步：同侧标签碰撞检测 —— 按 y 排序，间距不足向下错开，放不下则隐藏 ──
    var sides = { true: [], false: [] };
    items.forEach(function (it) { sides[it.right].push(it); });
    [true, false].forEach(function (isRight) {
      var arr = sides[isRight];
      if (!arr.length) return;
      arr.sort(function (a, b) { return a.by - b.by; });
      var prevBy = -Infinity;
      arr.forEach(function (it) {
        if (!it.hidden && it.by - prevBy < LABEL_GAP) {
          var newBy = prevBy + LABEL_GAP;
          if (newBy <= h - EDGE) it.by = newBy;   // 向下错开，引线随之弯曲指向新位置
          else it.hidden = true;                   // 已无空间 → 隐藏该标注
        }
        if (!it.hidden) prevBy = it.by;
      });
    });

    // ── 第 3 步：绘制（水平段只到文字近边前 2px，避免压字）──
    items.forEach(function (it) {
      if (it.hidden) return;
      var bx = it.bx, by = it.by;
      var lx, align;
      if (it.right) {
        if (bx + 8 + it.tw <= w - 4) { lx = bx + 8; align = 'left'; }
        else { lx = w - 8; align = 'right'; }
      } else {
        if (bx - 8 - it.tw >= 4) { lx = bx - 8; align = 'right'; }
        else { lx = 8; align = 'left'; }
      }
      // 文字近边（水平段终点，线只画到文字前 2px，不压字）：
      // 文字在折点右侧 → 近边=文字左缘；文字在折点左侧 → 近边=文字右缘
      // v4.4：水平安全钳制 —— 文字左右缘绝不越出画布（超长标签已省略号截断，此处兜底）
      var tl = (align === 'left') ? (lx + 4) : (lx - 4 - it.tw);
      if (tl < 4) { align = 'left'; lx = 8; tl = 12; }
      else if (tl + it.tw > w - 4) { align = 'right'; lx = w - 8; tl = w - 12 - it.tw; }
      var textNear = it.right ? tl : (tl + it.tw);
      // 折线：内部起点 → 折点 → 水平段（止于文字近边前 2px）
      ctx.strokeStyle = it.col;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(it.sx, it.sy);
      ctx.lineTo(bx, by);
      ctx.lineTo(textNear - 2, by);
      ctx.stroke();
      // 文字
      ctx.fillStyle = it.col;
      ctx.textAlign = align;
      ctx.fillText(it.txt, align === 'left' ? lx + 4 : lx - 4, by);
    });
    ctx.restore();
  }
};

/* 颜色向白色混合生成高亮色，用于柱状图悬停放大效果 */
function _mixToWhite(c, amt) {
  var m = String(c).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  var r, g, b;
  if (m) { r = +m[1]; g = +m[2]; b = +m[3]; }
  else {
    var h = String(c).replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    r = parseInt(h.slice(0, 2), 16); g = parseInt(h.slice(2, 4), 16); b = parseInt(h.slice(4, 6), 16);
  }
  r = Math.round(r + (255 - r) * amt);
  g = Math.round(g + (255 - g) * amt);
  b = Math.round(b + (255 - b) * amt);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
/* 颜色向黑色混合（v5.11：浅色主题悬停时柱体变暗） */
function _mixToBlack(c, amt) {
  var m = String(c).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  var r, g, b;
  if (m) { r = +m[1]; g = +m[2]; b = +m[3]; }
  else {
    var h = String(c).replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    r = parseInt(h.slice(0, 2), 16); g = parseInt(h.slice(2, 4), 16); b = parseInt(h.slice(4, 6), 16);
  }
  r = Math.round(r * (1 - amt));
  g = Math.round(g * (1 - amt));
  b = Math.round(b * (1 - amt));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* 通用柱状图（v5.9 起用于 ≤60 天的日粒度：每天一柱）：柱 = 当前指标

function _renderBucketTrend(canvasId, points, metric, granularity) {

  if (!canvas || !points || !points.length) return;
  var ctx = canvas.getContext('2d');

  var mainColor = tc.main;
  var lineData = points.map(function (p) {
    return metric === 'revenue' ? Math.round((p.revenue || 0) * 100) / 100
         : metric === 'count' ? (p.count || 0)
         : metric === 'pages' ? (p.pages || 0) : (p.files || 0);

    hoverBackgroundColor: function () {

    },

      interaction: { mode: 'index', intersect: false },

function _computeDailyTrend(orders) {
  var map = {};
  orders.forEach(function (o) {
    var day = _fmtDate(o.created_at);
    if (!map[day]) map[day] = { date: day, count: 0, revenue: 0, pages: 0, files: 0 };
    map[day].count++;
    map[day].revenue += o.is_admin_print ? 0 : ((o.revenue || 0) + (o.receivable || 0));   // v5.1 自打不计；v5.17 含待处理（应收未收并入）
    map[day].pages += o.total_page_count || 0;
    map[day].files += o.files_count || 0;
  });
  return Object.keys(map).sort().map(function (d) { return map[d]; });
}
function _countByStatus(orders) {
  var map = {};
  orders.forEach(function (o) { var s = o.status || 'unknown'; map[s] = (map[s] || 0) + 1; });
  return map;
}

function _renderServiceBar(canvasId, svc, svcRev) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  // v5.19：附加服务构成由柱状图改为饼状图（引线标签，与其它饼状图一致）
  var svcColors = { 加急: '#e11d48', 派送: '#f59e0b', 封面: '#8b5cf6', 自动打印: '#4f6ef7', 预约: '#14b8a6' };
  var labels = [], data = [], colors = [];
  Object.keys(svc).forEach(function (k) {
    var v = svc[k];
    if (!v) return;
    labels.push(k + ' ' + v + '单');
    data.push(v);
    colors.push(svcColors[k] || '#f97316');
  });
  if (!data.length) return;
  _cloudCharts[canvasId] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, hoverBackgroundColor: colors.map(function (c) { return _mixToWhite(c, 0.15); }), hoverBorderColor: 'transparent', borderWidth: 2, borderColor: 'transparent', hoverOffset: 12 }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '55%',
      layout: { padding: 26 },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function (c) {
          var name = (labels[c.dataIndex] || '').split(' ')[0];
          var rev = (svcRev || {})[name] || 0;
          return labels[c.dataIndex] + (rev > 0 ? ' · 收益贡献 ' + RMB(rev) : '');
        } } }
      },
      animation: { animateRotate: true, duration: 1000, easing: 'easeOutQuart' }
    },
    plugins: [_leaderLabelPlugin]
  });
}
function _renderDuplexDonut(canvasId, dup) {

/* 危险操作统一前置：要求 settings 已解锁，未解锁则先弹密码框 */
function confirmUnlockSettings(fn) {
  if (unlocked.settings) { fn(); return; }
  requestPassword('settings', '设置').then(function (ok) { if (ok) fn(); });
}
function delMonth(key) {
  confirmUnlockSettings(function () {
    openConfirm('确定删除「' + labelOf(key) + '」的所有采购 / 代收 / 评分数据？此操作不可恢复。', '删除').then(function (ok) {
      if (!ok) return;
      ['expenses', 'income', 'scores'].forEach(function (k) { STORE.records[k] = STORE.records[k].filter(function (r) { return monthKeyOf(r.date) !== key; }); });
      delete STORE.notes[key];
      save();
      if (currentKey === key) currentKey = currentMonthKey();
      renderAll();
      toast('已删除 ' + labelOf(key), 'success');
    });
  });
}
function downloadJSON(data, filename) {
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}
function exportData() { downloadJSON(STORE, '打印项目_清算备份_' + todayStr() + '.json'); toast('✅ 已导出', 'success'); }
function importData(e) {
  var file = e.target.files[0];
  if (!file) return;
  confirmUnlockSettings(function () {
    var reader = new FileReader();
    reader.onload = function (ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (!data.records && !data.months) throw new Error('格式错误');
        STORE = migrateConfig(sanitizeStore(data));   // 导入即净化 name/id/color
        currentKey = currentMonthKey();
        save();
        renderAll();
        toast('✅ 已导入 ' + allMonthKeys().length + ' 个月', 'success');
      } catch (err) { toast('❌ 导入失败：' + err.message, 'error'); }
    };
    reader.readAsText(file);
  });
}
function resetData() {
  confirmUnlockSettings(function () {
    openConfirm('⚠ 确定删除所有数据？建议先导出备份。', '重置').then(function (ok) {
      if (!ok) return;
      STORE = migrateConfig(null);
      currentKey = currentMonthKey();
      unlocked = { score: false, expense: false, income: false, settings: false };
      save();
      renderAll();
      toast('已重置，数据已清空');
    });
  });
}

/* ==================== 打印价格（收支统计设置 → 全局定价） ====================
   云端模式：读写服务器 pricing.json（/api/proxy/pricing，printer token 鉴权），
             小程序/APP 计费显示、后端订单计价、本地打印首页全部共用这一份价格。
   本地模式：存 STORE.config.pricing（print_data.json），仅影响本地打印工具。 */
var _pricingDpKeys = [], _pricingUpKeys = [];
var _cloudPricing = null;
/* 优先级档位业务顺序（低→中→高）；渲染加急价列表时强制按此排序，不依赖数据键顺序 */
var URGENCY_ORDER = ['低', '中', '高'];
function pricingRowsHTML(prefix, dict, unit, keyArr, editable) {
  var h = '', i = 0;
  keyArr.length = 0;
  var keys = Object.keys(dict || {});
  if (prefix === 'up') {
    // 优先级加急价：按 低→中→高 顺序展示；未知档位按字典序排最后
    keys = keys.slice().sort(function (a, b) {
      var ia = URGENCY_ORDER.indexOf(a), ib = URGENCY_ORDER.indexOf(b);
      if (ia >= 0 && ib >= 0) return ia - ib;
      if (ia >= 0) return -1;
      if (ib >= 0) return 1;
      return a < b ? -1 : (a > b ? 1 : 0);
    });
  }
  keys.forEach(function (k) {
    keyArr.push(k);
    h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">' +
         '<span style="min-width:110px;font-size:.85rem;color:var(--text)">' + esc(k) + '</span>' +
         '<input type="number" id="' + prefix + i + '" step="0.01" min="0" max="100" value="' + (+dict[k] || 0) + '" style="width:80px">' +
         '<span style="font-size:.78rem;color:var(--muted)">' + unit + '</span>' +
         (editable ? '<button class="btn danger sm" style="padding:2px 8px" onclick="removePricingRow(\'' + prefix + '\',' + i + ')">✕</button>' : '') +
         '</div>';
    i++;
  });
  if (editable) {
    h += '<div style="margin-top:6px"><button class="btn sm" onclick="addPricingRow(\'' + prefix + '\')">➕ 添加地点</button></div>';
  }
  return h || '<span style="color:var(--muted);font-size:.82rem">无</span>';
}
function addPricingRow(prefix) {
  var name = prompt('输入新地点名称：', '新地点');
  if (!name || !name.trim()) return;
  name = name.trim();
  if (_pricingDpKeys.indexOf(name) >= 0) { toast('该地点已存在', 'error'); return; }
  _pricingDpKeys.push(name);
  renderPricingList('dp');
  toast('已添加「' + name + '」，点击「保存价格」生效', 'success');
}
function removePricingRow(prefix, idx) {
  var keys = prefix === 'dp' ? _pricingDpKeys : _pricingUpKeys;
  if (idx < 0 || idx >= keys.length) return;
  var name = keys[idx];
  if (!confirm('确定删除地点「' + name + '」吗？')) return;
  keys.splice(idx, 1);
  renderPricingList(prefix);
  toast('已删除「' + name + '」，点击「保存价格」生效', 'success');
}
function renderPricingList(prefix) {
  var keys = prefix === 'dp' ? _pricingDpKeys : _pricingUpKeys;
  var vals = {};
  keys.forEach(function (k, i) {
    var el = document.getElementById(prefix + i);
    vals[k] = el ? (+el.value || 0) : 0;
  });
  var el = document.getElementById(prefix === 'dp' ? 'pricingDeliveryList' : 'pricingUrgencyList');
  if (el) el.innerHTML = pricingRowsHTML(prefix, vals, prefix === 'dp' ? '百分比' : '元', keys, prefix === 'dp');
}
function loadCloudPricingForm() {
  if (_cloudPricing) { fillPricingForm(_cloudPricing); return; }
  fetch('/api/proxy/pricing', { headers: apiHeaders() })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!(res && res.success)) return;
      _cloudPricing = res.pricing || {};
      fillPricingForm(_cloudPricing);
    })
    .catch(function () {});
}
function fillPricingForm(p) {
  var el = document.getElementById('pricingSimplex');
  if (el) el.value = (p.simplex_price != null) ? p.simplex_price : '';
  el = document.getElementById('pricingDuplex');
  if (el) el.value = (p.duplex_price != null) ? p.duplex_price : '';
  el = document.getElementById('pricingCover');
  if (el) el.value = (p.cover_page_price != null) ? p.cover_page_price : '';
  var dl = document.getElementById('pricingDeliveryList');
  if (dl) dl.innerHTML = pricingRowsHTML('dp', p.delivery_percentages || {}, '百分比', _pricingDpKeys, true);
  var ul = document.getElementById('pricingUrgencyList');
  if (ul) ul.innerHTML = pricingRowsHTML('up', p.urgency_prices || {}, '元', _pricingUpKeys, false);
}
function collectPricingForm() {
  var p = { simplex_price: 0, duplex_price: 0, cover_page_price: 0, delivery_percentages: {}, urgency_prices: {} };
  var e = document.getElementById('pricingSimplex'); if (e) p.simplex_price = +e.value || 0;
  e = document.getElementById('pricingDuplex'); if (e) p.duplex_price = +e.value || 0;
  e = document.getElementById('pricingCover'); if (e) p.cover_page_price = +e.value || 0;
  _pricingDpKeys.forEach(function (k, i) {
    e = document.getElementById('dp' + i);
    p.delivery_percentages[k] = e ? (+e.value || 0) : 0;
  });
  _pricingUpKeys.forEach(function (k, i) {
    e = document.getElementById('up' + i);
    p.urgency_prices[k] = e ? (+e.value || 0) : 0;
  });
  return p;
}
function savePricing() {
  var p = collectPricingForm();
  if (!(p.simplex_price > 0) || !(p.duplex_price > 0)) { toast('单面价 / 双面价必须大于 0', 'error'); return; }
  if (FINANCE_MODE === 'local') {
    STORE.config.pricing = p;
    save();
    renderSettings();
    toast('✅ 打印价格已保存（本地 print_data.json）', 'success');
    return;
  }
  fetch('/api/proxy/pricing', { method: 'POST', headers: apiHeaders(), body: JSON.stringify({ pricing: p }) })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res && res.success) {
        _cloudPricing = res.pricing || p;
        toast('✅ 打印价格已保存到云端，全端生效', 'success');
      } else toast('❌ ' + ((res && res.message) || '保存失败'), 'error');
    })
    .catch(function () { toast('❌ 网络错误', 'error'); });
}
function updatePassword(key) {
  var input = $('#pwd-' + key);
  if (!input) return;
  var v = input.value.trim();
  if (!v || v.length < 4) { toast('密码至少 4 位', 'error'); return; }
  // 只存 SHA-256 哈希，不再存明文（旧明文配置仍可校验，兼容迁移）
  hashPassword(v).then(function (h) {
    STORE.config.passwords[key] = 'sha256:' + h;
    save();
    input.value = '';
    toast('✅ ' + MODULE_NAMES[key] + ' 密码已更新', 'success');
  });
}
function updateScoreCap(val) {
  if (val < 1) val = 1;
  STORE.config.scoreCap = val;
  save();
  renderCurrent();
  toast('✅ 评分上限已设为 ' + val + ' 分', 'success');
}
function addMember() {
  var name = $('#newMemberName').value.trim();
  if (!name) { toast('请输入姓名', 'error'); return; }
  var members = getMembers();
  members.push({ id: 'm' + Date.now().toString(36).slice(-4), name: name, color: $('#newMemberColor').value });
  STORE.config.members = members;
  save();
  $('#newMemberName').value = '';
  renderSettings();
  toast('✅ 已添加成员：' + name, 'success');
}
function removeMember(mid) {
  var members = getMembers();
  var idx = members.findIndex(function (m) { return m.id === mid; });
  if (idx === -1) return;
  var name = members[idx].name;
  // 删除前扫描该成员名下的垫付 / 代收记录，避免金额静默消失
  var paidN = 0, paidC = 0, incN = 0, incC = 0;
  (STORE.records.expenses || []).forEach(function (e) { if (e.payer === mid) { paidN++; paidC += parseCents(e.amount); } });
  (STORE.records.income || []).forEach(function (r) { if (r.memberId === mid) { incN++; incC += parseCents(r.amount); } });
  var msg = '确定移除成员「' + name + '」？';
  if (paidN || incN) {
    var parts = [];
    if (paidN) parts.push(paidN + ' 条垫付（合计 ' + RMB(paidC) + ' 元）');
    if (incN) parts.push(incN + ' 条代收（合计 ' + RMB(incC) + ' 元）');
    msg += '该成员名下有 ' + parts.join('、') + '，删除后这些金额将从结算中消失。';
  }
  msg += '已有记录不会丢失，但不再参与后续计算。';
  openConfirm(msg, '移除').then(function (ok) {
    if (!ok) return;
    members.splice(idx, 1);
    STORE.config.members = members;
    save();
    renderSettings();
    toast('已移除：' + name);
  });
}
function manualBind() {
  var oid = $('#bindOpenid').value.trim();
  if (!oid) { toast('请输入 openid', 'error'); return; }
  var mid = $('#bindMember').value;
  updateBinding(oid, mid);
  $('#bindOpenid').value = '';
  renderSettings();
  toast('✅ 已绑定', 'success');
}

/* ==================== TAB: 授权（2026-11） ====================
   多设备共连云服务器时的设备授权管理：
   1. 本设备所有者 —— 从成员列表选择，绑定到后端设备注册表（计算机名 → 成员姓名）；
   2. 云端设备列表 —— 所有连接过云服务器的设备：计算机名称 / 在线状态 / 所有者 / 是否接单。
   独立密码保护（密码 key = 'auth'，默认与其它模块一致，可在「设置」中修改）。 */
function renderAuth() {
  var el = $('#tab-auth');
  if (FINANCE_MODE === 'local') {
    el.innerHTML = '<div class="section" style="text-align:center;padding:60px 20px"><div class="empty"><div class="ico">🔐</div><h3>授权模块仅云端模式可用</h3><p style="margin-top:6px">当前为本地模式。启用云端功能后，可在本模块绑定本设备所有者，并查看所有连接云服务器的设备。</p></div></div>';
    return;
  }
  if (!unlocked.auth) {
    el.innerHTML = '<div class="section" style="text-align:center;padding:60px 20px"><div class="empty"><div class="ico">🔐</div><h3>授权模块已锁定</h3><p style="margin-top:6px">绑定设备所有者、查看在线设备需先解锁授权模块（独立密码）。</p><button class="btn pri" style="margin-top:16px" onclick="unlockFlow(\'auth\',\'设备授权\')">🔑 输入密码解锁</button></div></div>';
    return;
  }
  var members = getMembers();
  var h = '';
  h += '<div class="section"><h2>💻 本设备 <span class="hint">（本机信息，来自本地打印工具 · 所有者从成员列表选择）</span></h2>';
  h += '<div id="auth-local-device" style="color:var(--muted)">加载中…</div></div>';
  h += '<div class="section"><h2>📡 云端设备列表 <span class="hint">（连接过云服务器的所有设备 · 在线状态实时）</span></h2>';
  h += '<div id="auth-devices" style="color:var(--muted)">加载中…</div></div>';
  el.innerHTML = h;
  loadAuthData(members);
}

function loadAuthData(members) {
  // ── 本设备信息 + 所有者绑定（所有者以后端设备注册表为准）──
  Promise.all([
    fetch('/api/local/device', { headers: apiHeaders() }).then(function (r) { return r.json(); }),
    fetch('/api/proxy/printer/devices', { headers: apiHeaders() }).then(function (r) { return r.json(); }).catch(function () { return null; })
  ]).then(function (results) {
    var box = $('#auth-local-device');
    if (!box) return;
    var dev = results[0] && results[0].device;
    if (!dev || !dev.client_id) { box.innerHTML = '<span style="color:var(--muted)">无法获取本机设备信息</span>'; return; }
    // 从后端设备列表反查本机所有者（若列表拉取失败则显示未绑定）
    // 兼容两种响应形态：顶层 devices（/api/printer/devices）或 data.devices 包装
    var currentOwner = '';
    var devList = results[1] && (results[1].devices || (results[1].data && results[1].data.devices));
    if (Array.isArray(devList)) {
      devList.forEach(function (d) { if (d.client_id === dev.client_id) currentOwner = d.owner_name || ''; });
    }
    var h = '<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:10px">';
    h += '<div><span style="color:var(--muted);font-size:.8rem">计算机名称</span><div style="font-weight:700">' + esc(dev.device_name || dev.client_id) + '</div></div>';
    h += '<div><span style="color:var(--muted);font-size:.8rem">设备 ID</span><div style="font-family:monospace;font-size:.78rem">' + esc(dev.client_id) + '</div></div>';
    h += '<div><span style="color:var(--muted);font-size:.8rem">接单状态</span><div>' + (dev.take_orders ? '<span class="tag g">接单中</span>' : '<span class="tag">未接单</span>') + '</div></div>';
    h += '</div>';
    h += '<div class="settings-row"><label>本设备所有者</label>';
    if (!members.length) {
      h += '<select id="authOwnerSel" disabled><option value="">（暂无成员，请先在「设置」添加）</option></select>';
    } else {
      h += '<select id="authOwnerSel">';
      h += '<option value="">（未绑定）</option>';
      members.forEach(function (m) { h += '<option value="' + esc(m.name) + '"' + (m.name === currentOwner ? ' selected' : '') + '>' + esc(m.name) + '</option>'; });
      h += '</select>';
    }
    h += '<button class="btn green sm" onclick="saveAuthOwner()">💾 保存</button>';
    h += '<span style="color:var(--muted);font-size:.78rem">' + (currentOwner ? '当前所有者：' + esc(currentOwner) : '未绑定所有者') + '</span>';
    h += '</div>';
    box.innerHTML = h;
  }).catch(function () { var b = $('#auth-local-device'); if (b) b.innerHTML = '<span style="color:var(--muted)">本机信息获取失败</span>'; });

  // ── 云端设备列表（经 stats_server 代理，携带打印机 token）──
  fetch('/api/proxy/printer/devices', { headers: apiHeaders() })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      var box = $('#auth-devices');
      if (!box) return;
      if (!res || !res.success) {
        box.innerHTML = '<span style="color:var(--muted)">' + esc((res && res.message) || '设备列表获取失败（云端未连接？）') + '</span>';
        return;
      }
      var list = res.devices || (res.data && res.data.devices) || [];
      if (!list.length) {
        box.innerHTML = '<span style="color:var(--muted)">暂无设备记录（本地打印工具连接云端后自动登记）</span>';
        return;
      }
      var h = '<div class="table-wrap"><table><thead><tr><th class="l">计算机名称</th><th>在线状态</th><th>所有者</th><th>接单</th><th>操作</th></tr></thead><tbody>';
      list.forEach(function (d) {
        h += '<tr><td class="l">' + esc(d.device_name) +
             '<div style="font-family:monospace;font-size:.72rem;color:var(--muted)">' + esc(d.client_id) + '</div></td>';
        h += '<td>' + (d.online ? '<span class="tag g">🟢 在线</span>' : '<span class="tag">⚫ 离线</span>') + '</td>';
        h += '<td>' + (d.owner_name ? esc(d.owner_name) : '<span style="color:var(--muted)">未绑定</span>') + '</td>';
        h += '<td>' + (d.is_active ? '<span class="tag g">接单中</span>' : '<span style="color:var(--muted)">—</span>') + '</td>';
        h += '<td><button class="btn danger sm" onclick="deleteDevice(\'' + esc(d.client_id) + '\')">🗑 删除</button></td></tr>';
      });
      h += '</tbody></table></div>';
      h += '<div style="margin-top:10px"><button class="btn sm" onclick="loadAuthData(getMembers())">🔄 刷新</button><span style="color:var(--muted);font-size:.78rem;margin-left:10px">每 15 秒自动刷新</span></div>';
      box.innerHTML = h;
    })
    .catch(function () { var b = $('#auth-devices'); if (b) b.innerHTML = '<span style="color:var(--muted)">设备列表获取失败</span>'; });
}

function saveAuthOwner() {
  var sel = $('#authOwnerSel');
  if (!sel) { toast('请先在「设置」中添加成员', 'error'); return; }
  var owner = sel.value.trim();
  fetch('/api/local/device', { headers: apiHeaders() })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      var dev = res && res.device;
      if (!dev || !dev.client_id) { toast('无法获取本机设备 ID', 'error'); return null; }
      return fetch('/api/proxy/printer/bind_owner', {
        method: 'POST', headers: apiHeaders(),
        body: JSON.stringify({ client_id: dev.client_id, owner_name: owner })
      }).then(function (r) { return r.json(); });
    })
    .then(function (res) {
      if (!res) return;
      if (res && res.success) { toast('✅ 本设备所有者已保存', 'success'); loadAuthData(getMembers()); }
      else toast('❌ ' + ((res && res.message) || '保存失败'), 'error');
    })
    .catch(function () { toast('❌ 网络错误', 'error'); });
}
/* 删除设备注册表中的一台设备（清理软件升级产生的同机旧 ID 等历史遗留）。
   经 stats_server 代理调用后端 /api/printer/devices/delete（携带打印机 token）。 */
function deleteDevice(clientId) {
  if (!clientId) return;
  openConfirm('确定删除该设备吗？删除后离线设备不会自动恢复（在线设备下次连接会重新登记）；若该设备是当前「接单」设备，接单状态将一并清空。', '删除').then(function (ok) {
    if (!ok) return;
    fetch('/api/proxy/printer/devices/delete', {
      method: 'POST', headers: apiHeaders(),
      body: JSON.stringify({ client_id: clientId })
    }).then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.success) { toast('✅ 设备已删除', 'success'); loadAuthData(getMembers()); }
        else toast('❌ ' + ((res && res.message) || '删除失败'), 'error');
      })
      .catch(function () { toast('❌ 网络错误', 'error'); });
  });
}
/* 授权页设备列表自动刷新（仅当前处于授权页且已解锁时执行，避免后台空转） */
setInterval(function () {

    '<p style="margin-top:10px">v5.4：指标配色 —— 趋势分析四指标专属颜色（收益绿/订单蓝/页数紫/文件青），峰值同色放大/实色突出，指标切换按钮高亮跟随指标色。</p>' +
    '<p style="margin-top:10px">v5.5：单指标展示 —— 趋势图切换指标时仅显示当前指标对应数据，移除叠加的订单数辅助序列与双轴。</p>' +
    '<p style="margin-top:10px">v5.6：移除「本月」维度 —— 趋势分析始终基于独立时间区间，默认近30天，首次进入自动加载。</p>' +
    '<p style="margin-top:10px">v5.7：曲线细节 —— 日粒度曲线平时不显示数据点（仅峰值标注点常显），鼠标悬停到某天时显示该天的选中点；曲线与 x 轴围成的面积改为纯色填充。</p>' +
    '<p style="margin-top:10px">v5.8：主题联动 —— 切换浅色/深色主题时，图表中的图例文字（可点击隐藏维度）、坐标轴刻度与轴标题颜色同步刷新，不再残留旧主题配色。</p>' +
    '<p style="margin-top:10px">v5.9：趋势切片 —— 新增近60天区间；≤60 天用柱状图（每天一柱），&gt;60 天用平滑折线图；宽范围不再按月/年划分，改为时间轴均匀切片、固定最多 60 片，保留数据变化趋势。</p>' +
    '<p style="margin-top:10px">v5.10：图表交互 —— 不再高亮/加亮最大值（柱状图所有柱同色、折线不突出峰值点，仅保留峰值文字标注）；图例仅作标识，点击不再切换数据集显隐。</p>' +
    '<p style="margin-top:10px">v5.11：柱体样式 —— 趋势柱状图柱体改为不透明实色；鼠标悬停时深色模式柱体加亮、浅色模式柱体变暗，且随主题切换自动生效。</p>' +
    '<p style="margin-top:10px">v5.12：折线填充 —— 平滑折线图与 x 轴围成的面积改为不透明实色填充（与柱体一致）。</p>' +
    '<p style="margin-top:10px">v5.13：趋势区间扩充 —— 新增近90天、近1年快捷区间（&gt;60 天自动进入 60 片切片平滑折线展示）。</p>' +
    '<p style="margin-top:10px">v5.14：自定义日期范围限制 —— 日期选择器禁止选择未来日期，最早可选日期限定为最早有数据的月份；提交时二次校验兜底。</p>' +
    '<p style="margin-top:10px">v5.15：自绘日历组件 —— 自定义日期改用自研弹出日历（周一开头、选中/今天/区间高亮、范围外日期禁用、取消自动回滚），浅色/深色主题随 CSS 变量自动适配，选完起止日期自动应用。</p>' +
    '<p style="margin-top:10px">v5.16：趋势切片 60→90 —— 宽区间（&gt;60 天）平滑折线图的切片数由 60 增至 90，细节更丰富；≤60 天仍为逐日柱状图；日历月份导航禁止切入全部日期不可用的月份；移除 Hero 卡片右下角迷你趋势线；趋势指标切换改为局部重绘（不再整页重建导致全部图表闪烁）；订单明细移除「入账进度/已入账」两列，分解信息并入金额列悬浮提示；订单明细新增分页（10/20/50/100 条每页，页码省略号导航，参考小程序/APP 打印任务分页），翻页/状态筛选只局部刷新订单区块；移除「⚠️ 需要处理」异常监控卡片（打印失败/放弃打印/查看异常订单入口），订单异常仍可在明细状态筛选中查看。</p>' +
    '<p style="margin-top:10px">v5.17：收益口径合并 —— 「应收未收」并入「已入账」，统一改名为「云端收益记录」（= 已打印完成 sent + 待处理金额合计）；KPI 合并为单卡，成员收益明细 / 对账 / 收益构成 / 趋势 / 排行榜同步使用合并口径，待处理文件数保留在卡片副行提示。</p>' +
    '<p style="margin-top:10px">v5.18：趋势区间 —— 新增「本月」并与顶部云端月份绑定（切换月份自动跟随）；移除「本周」「近7天」快捷区间；趋势分析卡片置顶展示；成员收益明细 / 排行榜按归属成员合并（本地订单并入归属管理员行，本地/云端不再分行）。</p>' +
    '<p style="margin-top:10px">v5.19：云端页精简 —— 移除订单漏斗与成员排行榜；「管理员订单统计」与「成员收益明细」合并精简为「🧾 成员订单数量统计」（编号 / 成员 / 免费打印 / 订单总数四列，管理员与普通用户统一口径，不再请求后端 owners 统计）。</p>' +
    '<p style="margin-top:10px">v5.20：统一口径栏 —— 顶部新增全局口径栏（时间 / 成员 / 来源），单选决定「看哪些数据」，指标 / 视角 / 状态 / 分页等「怎么展示」控件留在模块内部；KPI、趋势、图表、订单明细共用同一份筛选数据；「成员账目」合并展示（成员 / 免费打印 / 订单/云端收益记录 / 手动代收 / 差额），来源筛选不影响对账列，上月环比徽标（自然月口径）。</p>' +
    '<p style="margin-top:10px">v5.21：打印价格统一管理 + 收益口径修正 —— 设置页新增「打印价格」区块（单双面价 / 派送地点百分比 / 优先级加急价 / 首页费：云端模式写服务器 pricing.json 全端生效，本地模式存 print_data.json；支持添加 / 删除派送地点，密码保护）；收益统计计入订单级附加服务费（派送 / 加急 / 首页，按订单有效文件状态归入已入账或应收未收，放弃 / 取消 / 打回 / 失败订单不计）；订单明细金额配色：自打且已完成订单金额用蓝色与「自打」标记一致；设置页移除「外观」主题板块（右上角主题切换保留）；优先级加急价按 低 → 中 → 高 顺序展示。</p>' +
    '<p style="margin-top:10px">v5.22：设备授权 + 多设备接单 —— 新增「🔐 授权」标签页（独立密码保护）：① 本设备所有者从成员列表绑定，绑定后本地打印工具新建标签页默认归属该所有者、默认关闭「管理员自行打印」；② 云端设备列表展示所有连接过云服务器的设备（计算机名称 / 在线状态 / 所有者 / 是否接单，每 15 秒自动刷新，绑定后即时广播生效）。多设备共连服务器时仅「启用接单」的设备接收订单（同一时间唯一接管者，被其他设备占用时提示接管者名称与所有者）；订单明细「用户」列改为显示下单用户昵称（绑定微信小程序/APP 后优先微信小程序昵称，修改昵称实时同步）；修复授权页设备列表/所有者刷新被代理过滤的问题。</p>' +
    '<p style="margin-top:10px">v5.23：设备删除 + 图表与价格修正 —— ① 授权页云端设备列表新增「🗑 删除」按钮（清理软件升级产生的同机旧 ID 与历史遗留设备；删除当前接单设备时自动清空接管记录）；② 饼状图引线标签防重叠：过小扇区跳过标注、同侧标签碰撞检测自动错开/隐藏、引线水平段只画到文字近边前 2px（不再压字）；③ 打印价格：本地模式首页费默认值统一为 0.10（与云端 pricing.json 一致）。</p>' +
    '<p style="margin-top:10px">v5.24：多设备接单 + 时间到秒 —— ① 「启用接单」重构为可接单设备列表（多台设备可同时启用），订单记录实际接单设备；订单明细新增「接单设备」列（{所有者}的设备 | {设备}，历史订单归属姚懿祥的设备）；② 运营视角新增「接单设备比例」饼图（按订单数，悬停看收益）；③ 订单明细「时间」「开始打印」精确到秒；④ 口径栏滚动收起：滚动到订单明细附近时口径栏平滑上滑淡出、向上滚动自动滑回；⑤ 订单明细新增「开始打印」列（悬停展示下单→开始打印的等待时长）。</p>' +
    '<p style="margin-top:10px">v5.25：界面细节优化 —— ① 口径栏改为普通固定卡片：移除吸顶悬浮与滚动收起动画，不再遮挡订单明细；② 刷新记住所在标签页：F5 刷新后停留在原 tab（新开会话仍从收支清算开始）；③ 消除刷新时「收支清算」选中态闪烁：tab 恢复提前到首帧绘制前同步完成。</p>' +
    '<p style="margin-top:10px">页面仅由本地打印工具启动，数据实时保存在云端服务器。</p>' +
    '</div>' +
    '</div>');
}

/* ==================== 初始化 ==================== */
var _configLoaded = false;
function loadConfig() {
  if (FINANCE_MODE === 'local') {
    // 本地模式：不查云端，直接读本地 print_data.json；无本地数据则用空 STORE
    _loadFromLocalFile().then(function (localData) {
      if (localData) STORE = migrateConfig(localData);
      else STORE = migrateConfig(null);
      finishLocalLoad();
    });
    return;
  }
  // 云端模式：先拉云端，再比对本地，决定是否合并同步
  _loadFromServer().then(function (res) {
    if (!res.ok) { setCloudState(false); return; }
    setCloudState(true);
    var cloudData = res.data;
    var hadCloud = !!cloudData;
    if (cloudData) STORE = migrateConfig(cloudData);
    else STORE = migrateConfig(null);
    // 拉本地，判断是否两者都有真实数据 → 弹「合并」询问
    _loadFromLocalFile().then(function (localData) {
      if (localData) localData = migrateConfig(localData);
      var localReal = hasRealData(localData);
      var cloudReal = hasRealData(cloudData);
      if (localReal && cloudReal && localData) {
        // 两边都有真实数据 → 询问合并（安全合并；密码/评分单向权威保护）
        openConfirm(
          '检测到本地与云端均存在收支数据（本地为离线期间产生，云端为多人共用）。\n\n' +
          '为避免数据丢失，将执行「安全合并」：\n' +
          '· 订单/流水/成员按记录合并（去重；示例占位名不并入）\n' +
          '· 密码与服务评分以云端为权威（本地无法覆盖云端密码与评分）\n\n' +
          '是否合并并上传云端？',
          '合并'
        ).then(function (ok) {
          if (ok) {
            STORE = mergeStores(localData, cloudData || localData);
            // 合并结果写回本地 + 云端
            _saveToServer(STORE, true).then(function (sr) {
              if (sr.ok) toast('✅ 已安全合并本地与云端数据并上传', 'success');
              else toast('⚠️ 合并结果已保留，云端保存失败', 'error');
            });
            _saveToLocalFile(STORE);
            finishLoad(true);
          } else {
            // 用户取消合并：以云端为准（云端是多人共用权威）
            finishLoad(true);
          }
        });
        return;
      }
      // 无云端真实数据但本地有 → 本地一次性迁移到云端（CEO 首次部署）
      if (!cloudReal && localReal && localData) {
        STORE = migrateConfig(localData);
        save();
        // CEO 首次部署：数据已上云，清空本地副本（成员/密码/评分/流水以云端为准）
        fetch('/api/local/data', { method: 'DELETE', headers: apiHeaders() })
          .then(function (r) {
            toast('✅ 已从本地文件迁移到云端，本地数据副本已清空', 'success');
          })
          .catch(function () {
            toast('✅ 已从本地文件迁移到云端（本地副本清理失败，可在「设置 → 数据管理」重置）', 'success');
          });
      }
      // 旧版本地绑定迁移（仅当尚无云端绑定）
      if (!(STORE.config.memberBindings || []).length) {
        fetch('/api/local/bindings', { headers: apiHeaders() })
          .then(function (r) { return r.json(); })
          .then(function (bres) {
            if (bres && bres.success && bres.bindings) {
              var arr = [];
              Object.keys(bres.bindings).forEach(function (oid) { var mid = bres.bindings[oid]; if (mid) arr.push({ openid: oid, memberId: mid }); });
              if (arr.length) { STORE.config.memberBindings = arr; save(); }
            }
            finishLoad(hadCloud);
          })
          .catch(function () { finishLoad(hadCloud); });
      } else {
        finishLoad(hadCloud);
      }
    });
  });
}
function finishLocalLoad() {
  replayOfflinePending();   // 本地模式同样重放暂存
  var keys = allMonthKeys();
  currentKey = keys.length ? keys[keys.length - 1] : currentMonthKey();
  renderAll();
  // 本地模式：cloud tab 走本地订单库，无需 loadCloudMonths
  _localOrdersReady = false;
  renderCloud();
  setCloudStateLocal();     // 本地模式云端徽标固定显示"本地模式"
  if (hasRealData(STORE)) toast('✅ 已加载本地收支数据（' + monthRecordCount(currentKey) + ' 条当月记录）');
  else toast('ℹ️ 欢迎使用，请在「记账」录入数据（本地模式）');
}
function setCloudStateLocal() {
  var pill = $('#cloudPill');
  if (pill) {
    pill.className = 'cloud-pill ok';
    pill.innerHTML = '<span class="dot"></span> 本地模式';
  }
  var ind = $('#storageFilePath');
  if (ind) ind.textContent = '📁 本地';
  var ov = $('#blockOverlay');
  if (ov) ov.classList.remove('show');
}
function finishLoad(hadCloud) {
  replayOfflinePending();   // 云端可达：重放上次离线暂存的未保存数据
  var keys = allMonthKeys();
  currentKey = keys.length ? keys[keys.length - 1] : currentMonthKey();
  // 云端月份预加载
  loadCloudMonths().then(function () { _cloudMonthsReady = true; renderCloud(); });
  renderAll();
  checkHealth();
  setInterval(checkHealth, 30000);
  if (hadCloud) toast('✅ 已加载云端配置（' + monthRecordCount(currentKey) + ' 条当月记录）');
  else toast('ℹ️ 欢迎使用，请在「记账」录入数据');
}
function replayOfflinePending() {
  try {
    var raw = localStorage.getItem('finance_offline_pending');
    if (!raw) return;
    var pending = JSON.parse(raw);
    localStorage.removeItem('finance_offline_pending');
    STORE = migrateConfig(sanitizeStore(pending));
    save();
    toast('🔄 已恢复本地暂存数据并重新保存', 'success');
  } catch (e2) { /* 暂存数据损坏则直接丢弃 */ }
}

(function () {
  // 导航
  $$('#tabNav button').forEach(function (btn) {
    btn.addEventListener('click', function () { switchTab(this.dataset.tab); });
  });
  // 本地模式：把「云端」页按钮改名为「本地订单」；「授权」模块仅云端模式可用 → 隐藏入口
  if (FINANCE_MODE === 'local') {
    var _cloudBtn = document.querySelector('#tabNav button[data-tab="cloud"]');
    if (_cloudBtn) _cloudBtn.innerHTML = '<span class="ico">📡</span>本地订单';
    var _authBtn = document.querySelector('#tabNav button[data-tab="auth"]');
    if (_authBtn) _authBtn.style.display = 'none';
  }
  $('#themeToggle').addEventListener('click', cycleThemeMode);
  // 返回顶部：滚动超过 200px 显示，点击平滑回到顶部
  var _backToTop = $('#backToTop');
  function _updateBackToTop() { _backToTop.classList.toggle('show', (window.scrollY || document.documentElement.scrollTop) > 200); }
  _updateBackToTop();
  window.addEventListener('scroll', _updateBackToTop, { passive: true });
  _backToTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  $('#blockRetry').addEventListener('click', retryConnect);
  // 初始 tab 早在 <main> 后的防闪脚本里已定（深链 > 上次 tab > 总览，存 window.__initialTab），
  // 此处选中态已就位，switchTab 只补走正常初始化（currentTab/渲染/动画），不会产生视觉跳变
  switchTab(window.__initialTab || 'dash');
  // 初始为 loading 骨架
  renderAll();
  loadConfig();
})();
</script>
