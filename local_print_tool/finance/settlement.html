<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>打印项目 · 收支清算</title>
<style>
/* 注册自定义颜色属性：主题切换时 header 渐变等可平滑过渡（Chromium/Safari/新 Firefox 支持） */
@property --header-from { syntax: '<color>'; inherits: true; initial-value: #23244d; }
@property --header-to   { syntax: '<color>'; inherits: true; initial-value: #3b2f7d; }

/* ==================== 设计令牌 ==================== */
:root {
  --bg: #f3f4f8; --bg-soft: #eef0f5; --card: #ffffff; --card-2: #f8f9fc;
  --text: #1b1d2a; --muted: #6b7280; --border: #e3e6ee; --border-strong: #d3d7e2;
  --primary: #4f6ef7; --primary-strong: #3d5bf0; --primary-soft: #eef1ff;
  --green: #16a34a; --orange: #f59e0b; --pos: #16a34a; --neg: #e11d48;
  --shadow-sm: 0 1px 2px rgba(20,22,40,.06);
  --shadow-md: 0 8px 26px rgba(20,22,40,.09);
  --shadow-lg: 0 20px 55px rgba(20,22,40,.20);
  --radius: 14px; --radius-sm: 9px;
  --content-max: 1360px;   /* v5.1：宽屏内容宽度上限（居中布局），避免 100% 拉伸影响阅读；可在此调整 */
  --header-from: #23244d; --header-to: #3b2f7d;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0f1117; --bg-soft: #141722; --card: #1a1d29; --card-2: #202431;
  --text: #e8eaf2; --muted: #9aa1b5; --border: #262b3b; --border-strong: #343b4f;
  --primary: #6c86ff; --primary-strong: #8aa0ff; --primary-soft: rgba(108,134,255,.15);
  --green: #34d399; --orange: #fbbf24; --pos: #34d399; --neg: #fb7185;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
  --shadow-md: 0 8px 26px rgba(0,0,0,.40);
  --shadow-lg: 0 20px 55px rgba(0,0,0,.55);
  --header-from: #16182a; --header-to: #2a2450;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Segoe UI','Microsoft YaHei',-apple-system,sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.55;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ==================== 顶栏 ==================== */
.app-header {
  background: linear-gradient(135deg, var(--header-from), var(--header-to));
  color: #fff;
  box-shadow: 0 4px 20px rgba(15,15,40,.25);
}
.header-inner {
  max-width: var(--content-max); margin: 0 auto; padding: 12px 20px 0;   /* 宽屏居中后主题按钮不再悬停于内容右侧，恢复对称内边距 */
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.app-header h1 { font-size: 1.18rem; font-weight: 700; letter-spacing: .3px; display: flex; align-items: center; gap: 8px; }
.app-header h1 .logo { font-size: 1.5rem; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cloud-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 999px; font-size: .78rem; font-weight: 600;
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
}
.cloud-pill.ok { color: #b9f6ca; background: rgba(34,197,94,.18); border-color: rgba(34,197,94,.4); }
.cloud-pill.bad { color: #ffb4c2; background: rgba(244,63,94,.18); border-color: rgba(244,63,94,.4); }
.cloud-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.icon-btn {
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
  color: #fff; width: 34px; height: 34px; border-radius: 9px; cursor: pointer;
  font-size: 1rem; display: inline-flex; align-items: center; justify-content: center;
  transition: transform .18s ease, background .2s ease;
}
.icon-btn:hover { transform: translateY(-1px) scale(1.05); background: rgba(255,255,255,.2); }
.path-text { font-size: .74rem; color: rgba(255,255,255,.62); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 窗口较窄时（内容列贴近右上悬浮主题按钮，重叠临界约 1476px），重新为按钮预留右侧空间 */
@media (max-width: 1475px) {
  .header-inner { padding-right: 64px; }
}

/* ==================== Tab 导航 ==================== */
.tab-nav {
  max-width: var(--content-max); margin: 0 auto; padding: 8px 20px 10px;
  display: flex; gap: 4px; overflow-x: auto;
}
.tab-nav button {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 15px; border: none; border-radius: 10px;
  background: transparent; color: rgba(255,255,255,.78); cursor: pointer;
  font-size: .86rem; font-weight: 500; font-family: inherit; white-space: nowrap;
  transition: background .2s ease, color .2s ease, transform .15s ease;
}
.tab-nav button:hover { background: rgba(255,255,255,.13); color: #fff; transform: translateY(-1px); }
.tab-nav button.on { background: #fff; color: var(--header-from); font-weight: 700; box-shadow: 0 3px 12px rgba(0,0,0,.2); }
.tab-nav button .ico { font-size: 1.02rem; }

/* ==================== 主区域 ==================== */
main { max-width: var(--content-max); margin: 0 auto; padding: 20px 20px 60px; }
.tab { display: none; }
.tab.on { display: block; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ==================== 卡片与区块 ==================== */
.section {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
  transition: box-shadow .25s ease, transform .25s ease;
}
.section:hover { box-shadow: var(--shadow-md); }
.section h2 { font-size: 1.02rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.section h2 .hint { font-weight: 400; font-size: .8rem; color: var(--muted); }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
}
.kpi-card::before { content:''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 0 3px 3px 0; }
.kpi-card.c-blue::before { background: var(--primary); }
.kpi-card.c-green::before { background: var(--green); }
.kpi-card.c-orange::before { background: var(--orange); }
.kpi-card.c-red::before { background: var(--neg); }
.kpi-card .kpi-ico { font-size: 1.2rem; }
.kpi-card .num { font-size: 1.55rem; font-weight: 800; line-height: 1.25; letter-spacing: -.3px; }
.kpi-card .lbl { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }
.kpi-card .sub { font-size: .76rem; color: var(--muted); margin-top: 3px; }

/* ==================== 表格 ==================== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; }
th, td { padding: 10px 14px; text-align: center; border-bottom: 1px solid var(--border); }
th { background: var(--card-2); font-weight: 600; font-size: .8rem; color: var(--muted); }
td.l { text-align: left; }
/* 采购表的「数量」格（v7.9）：单价 / 「填数量后按月摊销」那行小字**不参与行高**。
   2026-10-27 现场：黄字让「数量」格比同行其它格高出 13px，整格垂直居中时输入框被顶上去，
   与 日期 / 金额 / 代付人 那一排看得见的错位（用户截图框住的正是这里）。
   做法 = 有数量列时给整行单元格预留同样的底部空白，小字绝对定位进这块空白 ⇒
   每个格的内容盒一样高、所有输入框仍对齐，小字只居中挂在下面。 */
.exp-table.has-qty td { padding-bottom: 22px; }
.exp-qty { position: relative; }
.exp-qty-note { position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; font-size: .72rem; line-height: 1.2; white-space: nowrap; }
tbody tr { transition: background .15s ease; }
tbody tr:hover { background: var(--card-2); }
.tfoot td { font-weight: 700; background: var(--card-2); border-top: 2px solid var(--border); }
.pos { color: var(--pos); font-weight: 700; }
.neg { color: var(--neg); font-weight: 700; }

/* ==================== 按钮 / 表单 ==================== */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 8px 16px; border: 1px solid var(--border-strong); border-radius: 9px; cursor: pointer;
  font-size: .85rem; font-weight: 500; font-family: inherit; background: var(--card); color: var(--text);
  transition: all .18s ease; position: relative; overflow: hidden;
}
.btn:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.btn:active { transform: translateY(0); }
.btn.pri { background: var(--primary); color: #fff; border-color: transparent; }
.btn.pri:hover { background: var(--primary-strong); color: #fff; box-shadow: 0 6px 16px rgba(79,110,247,.35); }
.btn.danger { color: var(--neg); border-color: rgba(225,29,72,.45); }
.btn.danger:hover { background: rgba(225,29,72,.08); color: var(--neg); border-color: var(--neg); }
.btn.green { background: var(--green); color: #fff; border-color: transparent; }
.btn.green:hover { background: #0f9d50; color: #fff; box-shadow: 0 6px 16px rgba(22,163,74,.3); }
.btn.sm { padding: 4px 11px; font-size: .78rem; border-radius: 7px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--card-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; }

.input, input[type=text], input[type=number], input[type=password], input[type=date], input[type=color], select {
  padding: 8px 12px; border: 1px solid var(--border-strong); border-radius: 9px;
  font-size: .88rem; font-family: inherit; background: var(--card); color: var(--text);
  transition: border-color .18s ease, box-shadow .18s ease;
}
.input:focus, input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
input[type=number] { width: 110px; }
input[type=date] { width: 150px; }
input:disabled, select:disabled { opacity: .5; cursor: not-allowed; }
input[type=range] { accent-color: var(--primary); }
/* 滑块聚焦/拖动时不套用通用 input 聚焦的 box-shadow 方框 */
input[type=range]:focus, input[type=range]:focus-visible { outline: none; box-shadow: none; }

.filter-bar {
  display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap;
  padding: 16px 18px; margin-bottom: 16px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm);
}
.filter-bar .f-item label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; }

/* ==================== 云端 · 全局口径栏（v6.0） ==================== */
.scope-bar {
  padding: 14px 18px 10px; margin-bottom: 16px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm);
}
.scope-row { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
.scope-row .f-item > label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.scope-summary {
  margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--border);
  font-size: .8rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
}
.scope-summary b { color: var(--text); }
.dd { position: relative; display: inline-block; }
.dd-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px;
  border: 1px solid var(--border-strong); border-radius: 9px; background: var(--card); color: var(--text);
  font-size: .88rem; cursor: pointer; font-family: inherit; transition: border-color .15s ease;
}
.dd-btn:hover { border-color: var(--primary); }
.dd-btn.filtered { border-color: var(--primary); color: var(--primary); font-weight: 700; }
.dd-btn .dd-caret { font-size: .7rem; color: var(--muted); }
.dd-panel {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 70; min-width: 210px;
  max-height: 300px; overflow: auto; padding: 6px;
  background: var(--card); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: var(--shadow-md);
}
.dd-head { display: flex; justify-content: space-between; padding: 2px 4px 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.dd-head button { font-size: .74rem; color: var(--primary); background: none; border: none; cursor: pointer; padding: 2px 6px; font-family: inherit; }
.dd-head button:hover { text-decoration: underline; }
.dd-group { font-size: .72rem; color: var(--muted); font-weight: 700; padding: 6px 8px 2px; }
.dd-opt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: .85rem; user-select: none; }
.dd-opt:hover { background: var(--card-2); }
.dd-opt input { accent-color: var(--primary); cursor: pointer; flex: none; }
.status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.status-dot.sent { background: #2E7D32; } .status-dot.printing { background: #1565C0; }
.status-dot.queued { background: #E65100; } .status-dot.failed { background: #C62828; }
.status-dot.canceled { background: #9E9E9E; } .status-dot.offline_unknown { background: #F57F17; }
.status-dot.rejected { background: #E65100; } .status-dot.accepted { background: #1565C0; }
.status-dot.abandoned { background: #7B1FA2; } .status-dot.reserved { background: #F57F17; }
.status-dot.scheduled { background: #F57F17; } .status-dot.waiting { background: #00897B; } .status-dot.downloading { background: #1565C0; }

/* ==================== 标签 ==================== */
.tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .74rem; font-weight: 600; }
.tag.g { background: rgba(22,163,74,.13); color: var(--pos); }
.tag.r { background: rgba(225,29,72,.12); color: var(--neg); }
.tag.b { background: rgba(79,110,247,.13); color: var(--primary); }
.tag.y { background: rgba(245,158,11,.16); color: #b45309; }
[data-theme="dark"] .tag.y { color: #fbbf24; }
.tag.p { background: rgba(139,92,246,.15); color: #8b5cf6; }
[data-theme="dark"] .tag.p { color: #a78bfa; }
/* v7.3：外部打印监视（绕过本工具直接打印、经人工确认出纸的作业）来源标签 —— 青绿色，
   与 小程序绿 / APP 蓝 / 本地橙 / 预约黄 / 加急红 / 封面紫 都不同色。标签 4 个字，
   所以单独收一点字号与左右 padding，让它在「来源」列里整块显示、不压到「用户」列。 */
.tag.ext { background: rgba(13,148,136,.14); color: #0d9488; padding: 2px 6px; font-size: .70rem; }
[data-theme="dark"] .tag.ext { background: rgba(45,212,191,.16); color: #2dd4bf; }
/* 订单类型固定槽位网格（v5.23）：相同/同类标签在不同订单间竖直对齐——
   槽序：自打/接单 | 自动 | 预约 | 免费 | 派送 | 加急 | 封面。
   每个槽位固定宽度，无标签时留空占位，保证跨行对齐。
   v6.9：槽位数不再恒为 7 —— 全表无人使用的槽整列移除（_typeSlotsUsed / _orderTypeTags），
   因此 grid-template-columns 与列宽由 JS 按实际槽位内联给出（常量见 TYPE_SLOT_W / TYPE_SLOT_GAP），
   此处只留布局骨架。 */
.type-grid { display: grid; }
.type-cell { display: flex; align-items: center; justify-content: center; min-height: 22px; position: relative; }
/* 类型槽只有 58px：标签本身不许折行（折了就成竖排"接/单"），小箭头绝对定位在槽角、不占宽度 */
.type-cell .tag { white-space: nowrap; }
.type-cell .st-edit.can { white-space: nowrap; }
/* v7.1b：小箭头不再绝对定位/缩字号 —— 与「状态」列同一个 .st-caret（同字号、同行内、同样点开/点收），
   在 58px 槽里 nowrap 后放得下；之前贴角的小点就是"样式不一致"的直接原因。 */
/* 订单状态标签配色：与微信小程序 status-* 完全一致（亮色=小程序亮色主题，深色=小程序暗色主题） */
.tag.st-sent            { background: #E8F5E9; color: #2E7D32; }
.tag.st-printing        { background: #E3F2FD; color: #1565C0; }
.tag.st-accepted        { background: #E3F2FD; color: #1565C0; }
.tag.st-queued          { background: #FFF3E0; color: #E65100; }
.tag.st-failed          { background: #FFEBEE; color: #C62828; }
.tag.st-canceled        { background: #F5F5F5; color: #9E9E9E; }
.tag.st-rejected        { background: #FFF3E0; color: #E65100; }
.tag.st-abandoned       { background: #F3E5F5; color: #7B1FA2; }
.tag.st-reserved        { background: #FFF8E1; color: #F57F17; }
.tag.st-offline_unknown { background: #FFF8E1; color: #F57F17; }
[data-theme="dark"] .tag.st-sent            { background: rgba(129,199,132,.15); color: #81C784; }
[data-theme="dark"] .tag.st-printing        { background: rgba(100,181,246,.15); color: #64B5F6; }
[data-theme="dark"] .tag.st-accepted        { background: rgba(100,181,246,.15); color: #64B5F6; }
[data-theme="dark"] .tag.st-queued          { background: rgba(255,179,77,.15); color: #FFB74D; }
[data-theme="dark"] .tag.st-failed          { background: rgba(229,115,115,.15); color: #E57373; }
[data-theme="dark"] .tag.st-canceled        { background: rgba(174,174,178,.15); color: #AEAEB2; }
[data-theme="dark"] .tag.st-rejected        { background: rgba(255,179,77,.15); color: #FFB74D; }
[data-theme="dark"] .tag.st-abandoned       { background: rgba(186,104,200,.15); color: #BA68C8; }
[data-theme="dark"] .tag.st-reserved        { background: rgba(255,213,79,.15); color: #FFD54F; }
[data-theme="dark"] .tag.st-offline_unknown { background: rgba(255,213,79,.15); color: #FFD54F; }
.tag.st-scheduled      { background: #FFF8E1; color: #F57F17; }
.tag.st-waiting        { background: #E0F2F1; color: #00897B; }
.tag.st-downloading    { background: #E3F2FD; color: #1565C0; }
/* S1-09：离线未同步（灰蓝、待处理）与云端拒收（洋红、要人工介入） */
.tag.st-unsynced           { background: #ECEFF1; color: #455A64; }
.tag.st-unsynced-rejected  { background: #FCE4EC; color: #AD1457; }
[data-theme="dark"] .tag.st-scheduled      { background: rgba(255,213,79,.15); color: #FFD54F; }
[data-theme="dark"] .tag.st-waiting        { background: rgba(77,182,172,.15); color: #4DB6AC; }
[data-theme="dark"] .tag.st-downloading    { background: rgba(100,181,246,.15); color: #64B5F6; }
[data-theme="dark"] .tag.st-unsynced           { background: rgba(176,190,197,.18); color: #B0BEC5; }
[data-theme="dark"] .tag.st-unsynced-rejected  { background: rgba(244,143,177,.18); color: #F48FB1; }
.member-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: .82rem; font-weight: 600; color: #fff; box-shadow: var(--shadow-sm); }
.member-del { cursor: pointer; opacity: .65; font-size: 1rem; transition: opacity .15s ease; }
.member-del:hover { opacity: 1; }

/* v7.0：订单状态订正 —— 「状态」表头的锁定开关（默认🔒，防误触）+ 解锁后逐单的小箭头与状态菜单。
   锁定态不渲染箭头、状态标签不可点（点行仍然只是展开文件明细），解锁后才给每单一个选择入口。 */
.st-lock { border: none; background: transparent; cursor: pointer; font-size: .78rem; line-height: 1; padding: 0 2px; vertical-align: -1px; opacity: .85; }
.st-lock:hover { opacity: 1; transform: scale(1.12); }
.st-lock.on { filter: drop-shadow(0 0 4px rgba(79,110,247,.55)); opacity: 1; }
.st-edit { display: inline-flex; align-items: center; gap: 2px; border-radius: 999px; }
.st-edit.can { cursor: pointer; padding-right: 2px; outline: 1px dashed rgba(79,110,247,.55); outline-offset: 2px; }
.st-edit.can:hover { background: rgba(79,110,247,.12); }
.st-caret { border: none; background: transparent; color: var(--primary); cursor: pointer; font-size: .66rem; line-height: 1; padding: 0 1px; pointer-events: none; }
.st-menu { position: fixed; z-index: 220; min-width: 138px; padding: 5px; background: var(--card); border: 1px solid var(--border-strong); border-radius: 11px; box-shadow: 0 12px 30px rgba(0,0,0,.22); }
.st-menu-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 6px 8px; border: none; background: transparent; border-radius: 8px; cursor: pointer; font-size: .8rem; color: var(--text); }
.st-menu-item:hover { background: rgba(79,110,247,.14); }
.st-menu-item.cur { background: rgba(79,110,247,.10); cursor: default; }
.st-menu-cur { color: var(--muted); font-size: .7rem; }
.type-grid .st-edit.can { padding: 0; }

/* v24：管理员订单统计 —— 自打/接单比例条 */
.ratio-bar { display: inline-flex; width: 90px; height: 10px; border-radius: 5px; overflow: hidden; background: rgba(127,127,127,.15); margin-right: 8px; vertical-align: -1px; }
.ratio-bar .ratio-own { background: #007AFF; height: 100%; }
.ratio-bar .ratio-acc { background: #FF9500; height: 100%; }
.unlock-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(22,163,74,.1); border: 1px solid rgba(22,163,74,.3); color: var(--pos); padding: 5px 12px; border-radius: 999px; font-size: .8rem; font-weight: 600; }
.lock-bar {
  display: flex; align-items: center; gap: 14px; justify-content: space-between; flex-wrap: wrap;
  background: var(--primary-soft); border: 1px dashed var(--primary);
  padding: 10px 16px; border-radius: 10px; margin-bottom: 14px; font-size: .85rem;
}

/* ==================== 转账指令 ==================== */
.settle-box { background: var(--card); border: 2px solid var(--orange); border-radius: var(--radius); padding: 20px; margin-top: 18px; }
.settle-box h2 { color: var(--orange); margin-bottom: 12px; }
/* 资金重分配表格横线加深（卡片背景与普通卡片一致，避免横线被亮背景淹没） */
.settle-box table th, .settle-box table td { border-bottom: 1px solid var(--border-strong); }
.transfer { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: 1.02rem; }
.transfer .arrow { font-size: 1.25rem; color: var(--muted); }
.transfer .amount { font-weight: 800; font-size: 1.15rem; color: var(--pos); }
/* 实际转账卡片：与上面橙色「建议转账」区分开（蓝色=真实数据） */
.settle-box-real { border-color: var(--primary); }
.settle-box-real h2 { color: var(--primary); }

/* ==================== 📐 结算公式说明块（v7.3） ====================
   可折叠：常驻只占一行（<summary>），展开才把 8 步公式摊开，不干扰日常看数。
   用原生 <details> 而不是自写开关 —— 不需要 JS 记状态、刷新后默认收起、键盘可达。 */
.formula-box { background: var(--card); border: 1px solid var(--border-strong); border-radius: var(--radius); margin-top: 18px; box-shadow: var(--shadow-sm); }
.formula-box > summary {
  cursor: pointer; padding: 12px 16px; font-weight: 700; font-size: .95rem;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  list-style: none; user-select: none; border-radius: var(--radius);
}
.formula-box > summary::-webkit-details-marker { display: none; }
.formula-box > summary .hint { font-weight: 400; font-size: .8rem; color: var(--muted); }
/* 展开/收起提示紧跟在标题文案之后（不靠右对齐）：右上角有个固定的 🌓 主题悬浮按钮
   （.floating-btn，top:14 right:16），窄窗口下它正好压在大卡片的右上角 —— 提示若右对齐
   就会被它盖住。跟着标题走则任何宽度都点得到。 */
.formula-box > summary::after { content: '展开 ▾'; margin-left: 8px; font-size: .78rem; font-weight: 400; color: var(--primary); }
.formula-box[open] > summary::after { content: '收起 ▴'; }
.formula-box[open] > summary { border-bottom: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; }
.formula-body { padding: 14px 16px 8px; font-size: .86rem; line-height: 1.9; }
.formula-body h3 { font-size: .9rem; margin: 12px 0 6px; color: var(--primary); }
.formula-body h3:first-child { margin-top: 0; }
.formula-body code {
  font-family: Consolas, 'Courier New', monospace; font-size: .84rem;
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px;
}
.formula-code {
  font-family: Consolas, 'Courier New', monospace; font-size: .84rem; line-height: 1.85;
  display: block; padding: 10px 12px; margin: 6px 0 8px;
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px;
  white-space: pre-wrap; word-break: break-word;
}
.formula-body table { margin: 6px 0 10px; }
.formula-body table th, .formula-body table td { font-size: .84rem; padding: 7px 10px; }
.formula-body .note { color: var(--muted); font-size: .8rem; }
.formula-body .chk { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.formula-body .chk.ok { color: var(--pos); }
.formula-body .chk.bad { color: var(--neg); }

/* ==================== 图表 ==================== */
.chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 16px; }
.chart-grid .section { margin-bottom: 0; }
.chart-wrap { position: relative; width: 100%; height: 270px; }
.chart-wrap.tall { height: 330px; }
.chart-wrap canvas { width: 100% !important; height: 100% !important; }

/* ==================== 模态框 ==================== */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 200; background: rgba(15,15,35,.5); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  opacity: 0; transition: opacity .2s ease;
}
.modal-backdrop.in { opacity: 1; }
.modal-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); width: 100%; max-width: 420px; padding: 22px;
  transform: scale(.94) translateY(8px); transition: transform .22s cubic-bezier(.2,.9,.3,1.3);
}
.modal-backdrop.in .modal-card { transform: scale(1) translateY(0); }
.modal-card h3 { font-size: 1.05rem; margin-bottom: 12px; }
.modal-card .modal-body { margin-bottom: 18px; font-size: .9rem; }
.modal-card .modal-body input, .modal-card .modal-body select { width: 100%; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

/* ==================== Toast ==================== */
#toastWrap { position: fixed; bottom: 26px; right: 26px; z-index: 300; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
.toast {
  background: var(--text); color: var(--bg); padding: 11px 20px; border-radius: 11px;
  font-size: .85rem; font-weight: 500; box-shadow: var(--shadow-lg);
  animation: toastIn .3s cubic-bezier(.2,.9,.3,1.2) both; max-width: 340px;
}
.toast.error { background: var(--neg); color: #fff; }
.toast.success { background: var(--green); color: #fff; }
@keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.92); } to { opacity: 1; transform: none; } }
.toast.out { transition: all .3s ease; opacity: 0; transform: translateY(10px); }

/* ==================== 空状态 / 骨架屏 ==================== */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty .ico { font-size: 3rem; margin-bottom: 8px; }
.skeleton { background: linear-gradient(100deg, var(--card-2) 40%, var(--border) 50%, var(--card-2) 60%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: 8px; }
@keyframes shimmer { to { background-position: -200% 0; } }
.loading-spin { display: inline-block; width: 18px; height: 18px; border: 2.5px solid var(--border-strong); border-top-color: var(--primary); border-radius: 50%; animation: spin .65s linear infinite; vertical-align: middle; }
/* 横条正文只有 .88rem，18px 的圈会把行高顶起来 —— 横幅内缩小并跟文字基线对齐。
   取数中必须是「看得出在转」的动效，静态 ⏳ 表情看起来跟卡死没区别（2026-10-29 用户反馈） */
.alert-banner .loading-spin { width: 14px; height: 14px; border-width: 2px; margin-right: 8px; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ==================== 订单明细 ==================== */
/* 订单明细卡片单独突破 main 的 max-width 居中布局，扩展到整个视口宽度（左右留 20px 与页面内边距一致）；
   窄窗口下 main 本就占满，calc 自动归零不影响。表格 min-width 较大时宽屏能更充分利用空间。 */
#cloud-orders {
  margin-left: calc(50% - 50vw + 20px);
  margin-right: calc(50% - 50vw + 20px);
}
.order-row { cursor: pointer; }
.order-row.expanded { background: var(--primary-soft); }
/* 展开容器：整块内容高度 0fr↔1fr 过渡，下方订单行随高度平滑下移/上移 */
.file-expand-cell { padding: 0; border-bottom: none; }
.file-expand.open .file-expand-cell { border-bottom: 1px solid var(--border); }
.file-expand-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .32s cubic-bezier(.4, 0, .2, 1);
}
.file-expand.open .file-expand-body { grid-template-rows: 1fr; }
.file-expand-inner { min-height: 0; overflow: hidden; }
/* 文件明细网格：文件名弹性占宽，信息列定宽 */
/* 备注行：背景与文件列表表头一致（--card-2 灰底），不用主题蓝 */
.order-remark {
  margin: 6px 0;
  padding: 8px 12px;
  background: var(--card-2);
  border-radius: 4px;
  font-size: .78rem;
  line-height: 1.7;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-all;
}
.file-grid { display: grid; grid-template-columns: minmax(0, 1fr) 72px 64px 104px 72px 78px 96px; gap: 10px; align-items: center; padding: 6px 14px; font-size: .8rem; }
.file-grid .fn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.file-grid.file-sub-head { font-size: .72rem; font-weight: 600; color: var(--muted); background: var(--card-2); border-top: 1px solid var(--border-strong); padding-top: 5px; padding-bottom: 5px; }
.file-grid.file-sub-row { color: var(--muted); border-top: 1px dashed var(--border); }
.expand-icon { display: inline-block; transition: transform .2s ease; font-size: .68rem; margin-right: 4px; color: var(--muted); }
.order-row.expanded .expand-icon { transform: rotate(90deg); }
/* 订单明细表：固定布局，列宽由表头决定，展开子行不重排列宽。
   v6.9：「类型」列按实际用到的槽位数缩窄，腾出的宽度补给「时间 / 开始打印 / 接单设备」，
   列宽与 min-width 全部由 _orderColWidths() 在渲染时内联给出（下表 min-width 仅作 JS 未执行时的兜底）。
   min-width = 各列宽之和：窗口比它窄时 .table-wrap 横向滚动，比它宽时多余空间按列宽比例摊到各列。 */
.order-table { table-layout: fixed; width: 100%; min-width: 1518px; }
.order-table .ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bound-badge { font-size: .7rem; padding: 1px 8px; border-radius: 999px; font-weight: 600; }
.bound-badge.yes { background: rgba(22,163,74,.13); color: var(--pos); }
.bound-badge.no { background: var(--card-2); color: var(--muted); }

/* ==================== 设置行 ==================== */
.settings-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.settings-row:last-child { border-bottom: none; }
.settings-row label { min-width: 96px; font-weight: 600; font-size: .88rem; }

/* ==================== 离线阻断层 ==================== */
#blockOverlay {
  position: fixed; inset: 0; z-index: 400; background: var(--bg);
  display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 24px;
}
#blockOverlay.show { display: flex; animation: fadeIn .3s ease; }
#blockOverlay .ico { font-size: 56px; }
#blockOverlay h2 { color: var(--text); }
#blockOverlay p { color: var(--muted); max-width: 380px; }

/* ==================== 云端 v5：运营驾驶舱组件 ==================== */
/* 对账/异常提示条：置顶通栏（有差额/未绑定用户时才渲染） */
.alert-banner {
  display: flex; align-items: center; gap: 14px;
  background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.35);
  border-left: 4px solid var(--orange); border-radius: var(--radius);
  padding: 13px 18px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
}
.alert-banner.danger { background: rgba(225,29,72,.08); border-color: rgba(225,29,72,.3); border-left-color: var(--neg); }
.alert-banner .ico { font-size: 1.25rem; flex: none; }
.alert-banner .msg { flex: 1; font-size: .88rem; }
.alert-banner .msg b { color: var(--orange); }
.alert-banner.danger .msg b { color: var(--neg); }
.alert-banner .msg .sub { display: block; font-size: .74rem; color: var(--muted); margin-top: 2px; }
.alert-banner button {
  flex: none; padding: 6px 13px; border-radius: 8px; border: 1px solid var(--orange);
  background: transparent; color: var(--orange); font-weight: 600; cursor: pointer;
  font-size: .78rem; font-family: inherit; transition: all .18s ease;
}
.alert-banner button:hover { background: rgba(245,158,11,.12); }
.alert-banner.danger button { border-color: var(--neg); color: var(--neg); }
.alert-banner.danger button:hover { background: rgba(225,29,72,.1); }

/* Hero KPI（4 卡）：迷你趋势线 / 环比徽标 / 半环仪表盘 */
.hero-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 18px; }
.hero-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; min-height: 118px;
}
.hero-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 0 3px 3px 0; }
.hero-card.c-green::before { background: var(--green); }
.hero-card.c-blue::before { background: var(--primary); }
.hero-card.c-orange::before { background: var(--orange); }
.hero-card.c-purple::before { background: #8b5cf6; }
.hero-card .top-row { display: flex; align-items: flex-start; justify-content: space-between; }
.hero-card .ico { font-size: 1.15rem; }
.hero-card .badge { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.badge.up { color: var(--pos); background: rgba(22,163,74,.12); }
.badge.down { color: var(--neg); background: rgba(225,29,72,.12); }
.hero-card .num { font-size: 1.55rem; font-weight: 800; margin-top: 8px; letter-spacing: -.3px; line-height: 1.25; }
.hero-card .lbl { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 3px; }
.hero-card .sub { font-size: .73rem; color: var(--muted); margin-top: 6px; }
.gauge-wrap { position: relative; height: 88px; margin-top: 4px; }
.gauge-wrap canvas { width: 100% !important; height: 100% !important; }
.gauge-center { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-size: 1.3rem; font-weight: 800; color: var(--primary); }

/* 订单漏斗（订单 → 文件 → 打印页 → 完成） */
.funnel-strip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.f-step { display: flex; align-items: baseline; gap: 6px; }
.f-step .fv { font-size: 1.12rem; font-weight: 800; color: var(--primary); }
.f-step .fl { font-size: .76rem; color: var(--muted); }
.f-arrow { color: var(--border-strong); font-size: 1rem; }
.f-meta { margin-left: auto; font-size: .8rem; color: var(--pos); font-weight: 600; }

/* 分段控制器（收益视角 / 运营视角） */
.segmented { display: inline-flex; background: var(--card-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px; margin-bottom: 14px; }
.segmented button {
  border: none; background: transparent; padding: 7px 16px; border-radius: 999px;
  font-size: .82rem; font-weight: 600; color: var(--muted); cursor: pointer;
  font-family: inherit; transition: all .18s ease; white-space: nowrap;
}
.segmented button:hover { color: var(--text); }
.segmented button.on { background: var(--card); color: var(--primary); box-shadow: var(--shadow-sm); }

/* 👥 成员排行榜（进度条卡片） */
.rank-list { display: flex; flex-direction: column; gap: 10px; }
.rank-row { display: grid; grid-template-columns: 30px 175px 1fr 108px 62px; align-items: center; gap: 12px; }
.rank-medal { font-size: 1.02rem; text-align: center; }
.rank-name { display: flex; align-items: center; gap: 6px; font-size: .84rem; font-weight: 600; min-width: 0; }
.rank-name .rank-nick { font-size: .7rem; color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.rank-bar { height: 10px; border-radius: 999px; background: var(--card-2); overflow: hidden; }
.rank-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), var(--primary-strong)); transition: width .6s ease; }
.rank-amt { text-align: right; font-weight: 700; font-size: .88rem; color: var(--pos); white-space: nowrap; }
.rank-orders { text-align: right; font-size: .76rem; color: var(--muted); white-space: nowrap; }
.rank-row.unbound { cursor: pointer; }
.rank-row.unbound:hover .rank-name { color: var(--neg); }
.rank-row.unbound .rank-fill { background: linear-gradient(90deg, var(--neg), #f87171); }
.rank-row.unbound .rank-amt { color: var(--neg); }

/* 趋势分析：区间切换工具栏（v5.2）+ v5.15 自绘日历组件 */
.trend-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.trend-toolbar .segmented { margin-bottom: 0; }
.trend-toolbar .trend-metrics { margin-left: auto; }
.trend-dates { display: inline-flex; align-items: center; gap: 6px; }
/* 日期字段：伪输入框，点击弹出日历 */
.date-field {
  display: inline-flex; align-items: center; gap: 5px; width: 124px;
  padding: 5px 9px; border: 1px solid var(--border-strong); border-radius: 8px;
  background: var(--card); color: var(--text); font-size: .78rem; cursor: pointer;
  font-family: inherit; transition: border-color .18s ease, box-shadow .18s ease;
}
.date-field:hover { border-color: var(--primary); }
.date-field.on { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
.date-field .cal-ico { font-size: .82rem; line-height: 1; }
.date-field .df-txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.date-field .df-txt.placeholder { color: var(--muted); }
/* 日历浮层 */
.cal-pop {
  position: fixed; z-index: 220; width: 254px;
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: var(--shadow-lg); padding: 10px;
  animation: calIn .18s ease both;
}
@keyframes calIn { from { opacity: 0; transform: translateY(-4px) scale(.97); } to { opacity: 1; transform: none; } }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-title { font-weight: 700; font-size: .85rem; }
.cal-nav {
  border: none; background: transparent; color: var(--muted); font-size: 1rem; cursor: pointer;
  width: 26px; height: 26px; border-radius: 7px; font-family: inherit; line-height: 1;
  transition: background .15s ease, color .15s ease;
}
.cal-nav:hover { background: var(--card-2); color: var(--text); }
.cal-nav:disabled { opacity: .35; cursor: default; }
.cal-nav:disabled:hover { background: transparent; color: var(--muted); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-dow { text-align: center; font-size: .68rem; color: var(--muted); padding: 3px 0; }
.cal-day {
  border: none; background: transparent; color: var(--text); font-size: .78rem; cursor: pointer;
  height: 28px; border-radius: 8px; font-family: inherit; transition: background .12s ease;
}
.cal-day:hover { background: var(--primary-soft); }
.cal-day.sel { background: var(--primary); color: #fff; font-weight: 700; }
.cal-day.today { box-shadow: inset 0 0 0 1.5px var(--primary); }
.cal-day.range { background: var(--primary-soft); color: var(--primary); }
.cal-day.disabled { color: var(--border-strong); cursor: not-allowed; }
.cal-day.disabled:hover { background: transparent; }
.cal-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.cal-hint { font-size: .72rem; color: var(--muted); }
.cal-close {
  border: none; background: transparent; color: var(--muted); cursor: pointer;
  font-size: .74rem; font-family: inherit; padding: 3px 8px; border-radius: 7px;
  transition: background .15s ease, color .15s ease;
}
.cal-close:hover { background: var(--card-2); color: var(--text); }

/* 每日趋势：指标切换 + 环形图中心文字 */

/* 主题切换瞬间：全页平滑渐变过渡（仅切换时启用，平时不生效以免影响悬停等微交互速度）。
   这是 View Transitions 不可用时的降级路径——颜色属性走主线程、元素多时会掉帧，
   故时长压到 .24s（感知更利落），并去掉最贵的 box-shadow 动画（每帧重模糊）。 */
html.theme-switching, html.theme-switching *,
html.theme-switching *::before, html.theme-switching *::after {
  transition: background-color .24s ease, color .24s ease, border-color .24s ease,
              --header-from .24s ease, --header-to .24s ease !important;
}
/* View Transitions（首选路径）：整页快照走合成线程交叉淡入，元素数量无关。
   默认时长 250ms 略快，这里统一到 .3s 并给出去程/回程一致的缓动。 */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .3s; animation-timing-function: ease; }
@media (prefers-reduced-motion: reduce) {
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}

/* 首帧绘制前恢复 tab 选中态（防闪）：默认 HTML 写死「收支清算」选中，
   若上次/深链指向其他 tab，这里在浏览器绘出首帧之前同步搬移 on 类，
   避免「先闪一下总览选中再切换」。只改类名不渲染内容——内容仍由
   页面尾部的 switchTab(window.__initialTab) 统一走正常初始化。 */
(function () {
  var tab = null;
  try { tab = new URLSearchParams(location.search).get('tab'); } catch (e) {}
  var fromUrl = tab === 'settings' || tab === 'auth';
  if (!fromUrl) {
    try { tab = sessionStorage.getItem('finance_last_tab'); } catch (e2) {}
  }
  var valid = ['dash', 'entry', 'cloud', 'printers', 'history', 'settings', 'auth', 'about'];
  if (!tab || valid.indexOf(tab) === -1) tab = 'dash';
  // FINANCE_MODE 此时还没赋值，这里按同样规则解析一次（仅用于本地模式隐藏授权入口的判定）
  var mode = '__FINANCE_MODE__';
  try {
    var mm = (location.hash || '').match(/(?:^|[?&])mode=([^&]+)/) || (location.search || '').match(/(?:^|[?&])mode=([^&]+)/);
    if (mm && mm[1]) { var mv = decodeURIComponent(mm[1]); if (mv === 'cloud' || mv === 'local') mode = mv; }
  } catch (e3) {}
  if (mode !== 'cloud' && mode !== 'local') mode = 'cloud';
  if (mode === 'local' && tab === 'auth') tab = 'dash';
  window.__initialTab = tab;
  document.querySelectorAll('.tab, #tabNav button').forEach(function (el) { el.classList.remove('on'); });
  var t = document.getElementById('tab-' + tab); if (t) t.classList.add('on');
  var b = document.querySelector('#tabNav button[data-tab="' + tab + '"]'); if (b) b.classList.add('on');
})();
</script>

<script>
/* ==================== 启动令牌（由本地打印工具服务器注入） ==================== */
var LAUNCH_TOKEN = '__LAUNCH_TOKEN__';
var FINANCE_MODE = '__FINANCE_MODE__';   // 'cloud' 或 'local'：收支清算数据/配置的存储来源
(function () {
  // 兼容 #token= 与 ?token= 两种传入：fragment 优先（浏览器不把 fragment 发给服务器，避免令牌进日志/Referer）
  var m = (location.hash || '').match(/(?:^|[?&])token=([^&]+)/);
  if (!m) m = (location.search || '').match(/(?:^|[?&])token=([^&]+)/);
  if (m && m[1]) {
    try { LAUNCH_TOKEN = decodeURIComponent(m[1]); } catch (e) { /* 非法编码则沿用注入值 */ }
  }
  // 存储模式：优先从 URL 参数读（运行时切换也能体现），否则用服务器注入值
  var mm = (location.hash || '').match(/(?:^|[?&])mode=([^&]+)/);
  if (!mm) mm = (location.search || '').match(/(?:^|[?&])mode=([^&]+)/);
  if (mm && mm[1]) {
    var mv = decodeURIComponent(mm[1]);
    if (mv === 'cloud' || mv === 'local') FINANCE_MODE = mv;
  }
  if (FINANCE_MODE !== 'cloud' && FINANCE_MODE !== 'local') FINANCE_MODE = 'cloud';
  /* S2-10：地址栏里的启动凭据用完就清 —— nonce 是一次性的（服务端已当场作废），
     token 只可能来自老的 ?token= 兼容入口；两者都不该留在浏览器历史/截图/Referer 里。
     只删这两个参数，mode / tab 等其余参数原样保留（深链照旧可用）；
     LAUNCH_TOKEN 已在上面读进变量，清掉地址栏不影响后续 X-Launch-Token 请求头。 */
  try {
    if (window.history && history.replaceState && location.search) {
      var _q = new URLSearchParams(location.search);
      if (_q.has('nonce') || _q.has('token')) {
        _q.delete('nonce');
        _q.delete('token');
        var _qs = _q.toString();
        history.replaceState(null, '',
          location.pathname + (_qs ? '?' + _qs : '') + (location.hash || ''));
      }
    }
  } catch (e) { /* 老浏览器没有 URLSearchParams/replaceState：保持原地址不变即可 */ }
})();
/* S1-05：解锁会话自动带在**所有**请求头里（读操作服务端不校验，写操作必须要它）。
   会话变量在下面的「密码 / 解锁会话」段声明；用 typeof 兜住脚本加载顺序。 */
function apiHeaders() {
  var h = { 'X-Launch-Token': LAUNCH_TOKEN, 'Content-Type': 'application/json' };
  if (typeof FINANCE_SESSION !== 'undefined' && FINANCE_SESSION) h['X-Finance-Session'] = FINANCE_SESSION;
  return h;
}

/* ==================== 常量 ==================== */
/* v4.2：不再预置示例成员（张三/李四/王五）。成员名单由用户在「设置 → 成员管理」添加，

var DEFAULT_MEMBERS = [];
var PLACEHOLDER_MEMBER_NAMES = ['张三', '李四', '王五'];
var DEFAULT_SCORE_CAP = 15;
var DEFAULT_RATE = 0.05;
/* S1-05（2026-10-23 财务安全加固）：**代码里不再有可用的默认密码**。
   `_PW_123456` 只是「旧默认密码的指纹」（sha256('123456')），用途只有一个：把仍是 123456 的

   `DEFAULT_PASSWORDS` 现在全是空串 = 「未设置」—— 迁移时补齐的是空值，不是密码。 */
var _PW_123456 = 'sha256:8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92';
var LEGACY_DEFAULT_PASSWORDS = { score: _PW_123456, expense: _PW_123456, income: _PW_123456, settings: _PW_123456, auth: _PW_123456, transfer: _PW_123456, orderstatus: _PW_123456, orderprinter: _PW_123456 };
var DEFAULT_PASSWORDS = { score: '', expense: '', income: '', transfer: '', settings: '', auth: '', orderstatus: '', orderprinter: '' };

/* 密码最小长度（与服务端 stats_server.MIN_PASSWORD_LEN 同口径） */

/* ==================== 存储层 ==================== */
function _saveToServer(data, force) {
  var clientVersion = (data.meta && typeof data.meta.version === 'number') ? data.meta.version : 0;
  var payload = { data: data, client_version: clientVersion };
  return fetch('/api/proxy/finance/config', { method: 'POST', headers: apiHeaders(), body: JSON.stringify(payload) })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!(res && res.success)) {
        _writeAuthProblem(res);
        return { ok: false, message: (res && res.message) || '保存失败' };
      }
      var sv = res.server_version;
      var conflict = false;
      if (typeof sv === 'number') {
        conflict = sv > clientVersion + 1;   // 期间有其他设备写入
        data.meta.version = sv;              // 以服务器版本为准
      } else {
        data.meta.version = clientVersion + 1;  // 后端暂未实现：本地自增
      }
      return { ok: true, conflict: conflict, server_version: sv };
    })
    .catch(function (e) { return { ok: false, message: String(e) }; });
}
function _loadFromServer() {
  return fetch('/api/proxy/finance/config', { headers: apiHeaders() })
    .then(function (r) { return r.json(); })
    .then(function (res) { return (res && res.success) ? { ok: true, data: res.data } : { ok: false, message: (res && res.message) || '获取配置失败' }; })
    .catch(function (e) { return { ok: false, message: String(e) }; });
}
function _loadFromLocalFile() {
  return fetch('/api/local/data', { headers: apiHeaders() })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      // S1-05 ④：服务端顺带下发数据完整性状态（校验失败 ⇒ 只读保护 + 顶部横幅）
      if (res && typeof res === 'object') {
        if (typeof res.read_only !== 'undefined') {
          _integrityReadOnly = !!res.read_only;
          _integrityState = res.integrity || '';
          try { syncIntegrityBanner(); } catch (e) {}
        }
        return (res.success && res.data) ? res.data : null;
      }
      return null;
    })
    .catch(function () { return null; });
}
function _saveToLocalFile(data) {
  return fetch('/api/local/data', { method: 'POST', headers: apiHeaders(), body: JSON.stringify({ data: data }) })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!(res && res.success)) {
        if (res && res.code === 'integrity_readonly') {
          _integrityReadOnly = true;
          _integrityState = res.integrity || 'mismatch';
          try { syncIntegrityBanner(); } catch (e) {}
        } else {
          _writeAuthProblem(res);
        }
        return { ok: false, message: (res && res.message) || '保存失败' };
      }
      return { ok: true };
    })
    .catch(function (e) { return { ok: false, message: String(e) }; });
}

/* ==================== 有效数据判定（排除纯示例/默认空壳） ==================== */
function hasRealData(store) {
  if (!store) return false;
  var recs = store.records;
  if (recs) {

   项目声明的「全额结清时 实际盈亏 == 应得盈亏」永久不成立（实测 maxGap = 2 分，

  if (!isMonthKey(startKey) || !isMonthKey(endKey) || startKey > endKey) return out;
  var y = +startKey.slice(0, 4), mo = +startKey.slice(5, 7);
  var ey = +endKey.slice(0, 4), em = +endKey.slice(5, 7);
  for (var guard = 0; guard < 600; guard++) {
    out.push(y + '-' + (mo < 10 ? '0' + mo : '' + mo));
    if (y === ey && mo === em) break;
    mo++;

  var lots = [];
  (purchases || []).forEach(function (e) {
    var kind = expenseKind(e);
    var units = expenseUnits(e);
    var month = monthKeyOf(e.date);
    if (kind === 'other' || units <= 0 || !isMonthKey(month) || month > targetKey) return;
    lots.push({ id: String(e.id == null ? '' : e.id), kind: kind,
                item: String(e.item == null ? '' : e.item), date: normDateStr(e.date),
                payer: String(e.payer == null ? '' : e.payer),

      .sort(function (a, b) { return a.date === b.date ? (a.order - b.order) : (a.date < b.date ? -1 : 1); });

    days.forEach(function (d) {

      var need = Math.round(dayMap[d] || 0), mk = d.slice(0, 7);
      for (var i = 0; i < active.length && need > 0; i++) {

        if (lot.remaining <= 0) continue;
        var take = Math.min(lot.remaining, need);
        lot.remaining -= take; lot.consumed += take; need -= take;
        lot.perMonth[mk] = (lot.perMonth[mk] || 0) + take;

      if (need > 0) self.uncovered[kind][mk] = (self.uncovered[kind][mk] || 0) + need;

        cum += (lot.perMonth[mk] || 0);
        var cents = Math.round(lot.priceCents * cum / lot.units);
        lot.months[mk] = { units: lot.perMonth[mk] || 0, cents: cents - prevCents, cumUnits: cum };
        prevCents = cents;
      });
      var tm = lot.months[targetKey] || { units: 0, cents: 0, cumUnits: 0 };
      var unitYuan = lot.priceCents / lot.units / 100;
      if (tm.cents > 0) {
        self.rows.push({ id: 'amort:' + lot.id, kind: lot.kind, lotId: lot.id, payer: lot.payer,
                         item: CONSUMABLE_KIND[kind].label + '摊销（本月 ' + tm.units + ' ' + CONSUMABLE_KIND[kind].unit + '）',
                         cents: tm.cents, units: tm.units, purchaseItem: lot.item });
      }
      self.lots.push({ id: lot.id, kind: lot.kind, label: CONSUMABLE_KIND[kind].label,
                       item: lot.item, date: lot.date, payer: lot.payer,
                       priceCents: lot.priceCents, units: lot.units,
                       unit: CONSUMABLE_KIND[kind].unit, unitYuan: unitYuan,
                       usedUnits: tm.cumUnits, chargedCents: prevCents,
                       remainingCents: Math.max(0, lot.priceCents - prevCents),
                       monthUnits: tm.units, monthCents: tm.cents });

      self.totalUnits += tm.units;

  var scoreCap = getScoreCap();

  var scores = m.scores || {};

  /* 🔴-F2：只把「付款人仍是当前成员」的采购计入结算。旧写法 totalExp 含全部记录，

     差整整 100 元；Σpaid ≠ totalExp 也让 🔴-C1 的 Σnet == 0 不成立。
     处置与 transfers 一致（非成员记录不进结算），但**不静默**：另汇总 orphanPayerExp，

  var purchaseWeights = members.map(function (mem) { return useUsage ? (usagePages[mem.id] || 0) : 1; });

  /* ══════════ v7.5：设备寿命消耗的两种计费方式（所有者 ≠ 接单设备） ══════════

        **二次计费**。正确做法是「谁用谁出损耗费」：使用者按自己消耗的寿命价值，把
        **其他所有者应得的那几份**付给他们（现金转账）。
        · 所有者 = 共有（全体成员均等）或某个成员（个人所有：全额付给他）；
        · 使用者自己那一份（s_i）是自己资产缩水，不产生现金；
        · 使用者实际承担全额损耗；其他所有者收现后被自己的资产缩水抵平（净 0）；

    /* v7.7：已结算的机器在这个月有冻结快照 ⇒ 页数 / 金额 / 分摊全用快照（不再看订单归属）；

      depByPrinter.push({ id: p.id, name: p.name, client_id: p.client_id || '', price: +p.price || 0,

  var perPersonShare = apportionCents(totalExp, purchaseWeights, members);
  var investReturn = apportionCents(investPool, members.map(function () { return 1; }), members);
  var serviceReturn = apportionCents(servicePool, members.map(function (mem) {

  var redist = {};
  members.forEach(function (mem) { redist[mem.id] = investReturn[mem.id] + serviceReturn[mem.id]; });

  var settleNet = {};

  var payers = balances.filter(function (b) { return b.net <= -1; }).sort(function (a, b) { return a.net - b.net; });

    rem[payers[pi].id] += amt;
    rem[receivers[ri].id] -= amt;
    if (Math.abs(rem[payers[pi].id]) < 1) pi++;
    if (Math.abs(rem[receivers[ri].id]) < 1) ri++;

  wearTransfers.forEach(function (t) { transfers.push(t); });

  /* ── 实际转账（现金口径，v6.4） ────────────────────────────────────
     与上面「建议转账指令」不同：这是真的转了多少。决定「谁实际吃亏」。
     m.transfers 由 monthFromRecords 按「结算月份」筛出（记录只存 month，不存日期）。
     只统计收付双方都还在成员名单里的记录（成员被删除后其历史转账不再影响结算）。 */
  /* known（成员白名单）已在函数开头构造 —— 采购结算也要用（🔴-F2） */
  var sent = {}, recv = {};
  members.forEach(function (m) { sent[m.id] = 0; recv[m.id] = 0; });
  var transferTotal = 0;
  (m.transfers || []).forEach(function (t) {
    if (!known[t.from] || !known[t.to] || t.from === t.to) return;
    var amt = parseCents(t.amount);
    if (amt === 0) return;
    sent[t.from] += amt;
    recv[t.to] += amt;
    transferTotal += amt;
  });

  /* 账面盈亏（应得）B_i = 应得收入 − 采购应摊 − 团队共担机折旧 + 损耗费净额
        · 团队共担机折旧：非现金成本，直接扣（机器钱没进过采购账）；
        · 损耗费净额：共同出资机的寿命消耗**不重复计团队成本**，只把"该谁付给谁"记在使用者头上
          —— 使用者这项是负的（付出去了），其他所有者是正的（收到补偿），合计为 0。
     实际盈亏（现金）C_i = 代收 + 实收转账 − 垫付 − 实付转账 − 团队共担机折旧。
        损耗费不在 C 里另扣 —— 它已经作为**真实转账**（T_i）流过一遍，
        这样「建议转账全部照做 ⇒ C_i = B_i」仍然成立。 */
  var bookPL = {}, actualNet = {}, actualPL = {}, settleGap = {};
  members.forEach(function (mem) {
    bookPL[mem.id] = redist[mem.id] - perPersonShare[mem.id] - (depByMember[mem.id] || 0) + (wearNet[mem.id] || 0);
    actualNet[mem.id] = recv[mem.id] - sent[mem.id];
    actualPL[mem.id] = parseCents(inc[mem.id] || 0) - (paid[mem.id] || 0) + actualNet[mem.id] - (depByMember[mem.id] || 0);
    settleGap[mem.id] = net[mem.id] - actualNet[mem.id];   // 正=仍应收，负=已超付
  });

  return { rate: rate, totalExp: totalExp, perPerson: perPerson, perPersonShare: perPersonShare,
           totalInc: totalInc, scoreTotals: scoreTotals, totalScore: totalScore,
           paid: paid, orphanPayerExp: orphanPayerExp, investPool: investPool, servicePool: servicePool, investReturn: investReturn, serviceReturn: serviceReturn,
           redist: redist, net: net, transfers: transfers, members: members, memberCount: memberCount, scoreCap: scoreCap,
           sent: sent, recv: recv, transferTotal: transferTotal, actualNet: actualNet, actualPL: actualPL, settleGap: settleGap,
           /* v7.4 新增：分摊口径与用量、设备折旧 */
           basis: basis, basisFallback: basisFallback, useUsage: useUsage,
           purchaseWeights: purchaseWeights, usagePages: usagePages, usageTotal: usageTotal,
           depByMember: depByMember, depByPrinter: depByPrinter, depTotal: depTotal,
           depUnallocated: depUnallocated, depPagesUnattributed: depPagesUnattributed,
           pagesUnregisteredPrinter: pagesUnregisteredPrinter,
           bookPL: bookPL, settleNet: settleNet, wearNet: wearNet,
           wearByMember: wearByMember, wearTransfers: wearTransfers,
           wearTotal: wearTotal, wearUnallocated: wearUnallocated,

            /* v7.9：本月采购的「计费行」（普通采购 + 耗材摊销，不含能摊销的整笔耗材采购）
               与耗材摊销明细（rows / lots / byBuyer）。页面只展示，不再另算一份。 */

}

/* ==================== 保存 ==================== */
var _saveTimer = null;
function save() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(function () { _doSave(false); }, 250);
}
/* 保存请求携带 client_version，响应返回 server_version；
   若 server_version > client_version + 1 说明期间有其他设备写入 → 弹冲突确认（覆盖则强制保存）。
   后端暂未实现版本号时，前端本地自增 meta.version，等待后端配合。 */
function _doSave(force) {
  /* S1-05 ③：写操作必须带 finance_session（服务端会 403）。没有会话 = 还没解锁任何模块 ——
     首次部署迁移、离线暂存重放这类"自动保存"会走到这里，先记下来，解锁成功后自动补做。 */
  if (!FINANCE_SESSION) {
    _pendingSave = true;
    _afterUnlock(function () { _doSave(force); });
    return;
  }
  if (FINANCE_MODE === 'local') {
    // 本地模式：配置/数据存本地 print_data.json
    _saveToLocalFile(STORE).then(function (r) {
      if (!r.ok) { toast('⚠️ 本地保存失败', 'error'); return; }
      var ind = $('#storageFilePath');
      if (ind) ind.textContent = '📁 本地 · 已保存';
      // 本地无并发冲突，版本号自增
      if (STORE.meta) STORE.meta.version = (STORE.meta.version || 0) + 1;
    });
    return;
  }
  _saveToServer(STORE, force).then(function (r) {
    if (!r.ok) {
      // 云端不可达：暂存本地，联网后启动时自动重放
      try { localStorage.setItem('finance_offline_pending', JSON.stringify(STORE)); } catch (e2) {}
      toast('⚠️ 云端保存失败，已暂存本地，联网后自动同步', 'error');
      return;
    }
    var ind = $('#storageFilePath');
    if (ind) ind.textContent = '☁ 云端 · 已保存';
    if (!force && r.conflict) {
      openConfirm('云端数据已被其他设备修改（服务器 v' + r.server_version + '），是否覆盖？', '覆盖').then(function (ok) {
        if (ok) _doSave(true);
      });
    }
  });
}

/* ==================== Toast ==================== */
/* replace=true：先把当前屏上的 toast 清空再加这一条 —— 订正失败时要盖掉上一条成功的 ✅，
   否则「❌ …」与「✅ …」同屏会被读成"部分成功"。默认 false = 既有堆叠行为一字不变。 */
function toast(msg, type, replace) {
  var wrap = $('#toastWrap');
  if (replace && wrap) wrap.innerHTML = '';
  var el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 320); }, 2200);
}

/* ==================== 模态框 ==================== */
function openModal(opts) {
  return new Promise(function (resolve) {
    var root = $('#modalRoot');
    var m = document.createElement('div');
    m.className = 'modal-backdrop';
    var h = '<div class="modal-card" role="dialog">';
    h += '<h3>' + (opts.title || '') + '</h3>';
    h += '<div class="modal-body">' + (opts.body || '') + '</div>';
    h += '<div class="modal-actions">';
    if (opts.cancelText) h += '<button class="btn ghost" data-act="cancel">' + (opts.cancelText || '取消') + '</button>';
    h += '<button class="btn ' + (opts.danger ? 'danger' : 'pri') + '" data-act="ok">' + (opts.confirmText || '确定') + '</button>';
    h += '</div></div>';
    m.innerHTML = h;
    root.appendChild(m);
    var inputEl = null;
    if (opts.input) {
      inputEl = document.createElement('input');
      inputEl.type = opts.input.type || 'text';
      inputEl.placeholder = opts.input.placeholder || '';
      m.querySelector('.modal-body').appendChild(inputEl);
    }
    requestAnimationFrame(function () { m.classList.add('in'); });
    if (inputEl) setTimeout(function () { inputEl.focus(); }, 60);
    function close(val) {
      m.classList.remove('in');
      setTimeout(function () { m.remove(); }, 190);
      resolve(val);
    }
    m.addEventListener('click', function (e) { if (e.target === m) close(null); });
    var okBtn = m.querySelector('[data-act=ok]');
    var cancelBtn = m.querySelector('[data-act=cancel]');
    okBtn.addEventListener('click', function () { close(inputEl ? inputEl.value : true); });
    if (cancelBtn) cancelBtn.addEventListener('click', function () { close(null); });
    if (inputEl) inputEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') okBtn.click(); });
  });
}

/* 首次设置密码：默认/未设置密码的模块必须先在页面上设新密码（D-5 拍板接受的操作摩擦）。

/* 数据完整性横幅：HMAC 校验失败 → 页面顶部常驻提示 + 人工确认入口（服务端此时只读，不覆盖数据） */

    return mo ? 'member:' + mo.memberId : 'local:' + ((o.owner_name || '').trim() || '未归属');

  return list;

  for (var i = Math.max(2, current - 1); i <= Math.min(total - 1, current + 1); i++) pages.push(i);
  if (current < total - 2) pages.push('...');

/* 局部刷新订单明细区块（翻页/改每页条数/状态筛选），不影响其他图表 */

/* 分页事件（参考小程序 onPageChange/onPrevPage/onNextPage/onSelectPageSize） */

  if (isNaN(p) || p < 1 || p > totalPages || p === _ordersPage) return;

function onOrdersPerPage(v) {

  _ordersPage = 1;
  _rerenderOrdersOnly(true);

/* 成员映射 */

  if (b) { var m = getMember(b.memberId); if (m) return { memberId: m.id, name: m.name, color: m.color, nickname: true }; }
  return null;
}
/* 按成员名查找成员：本地订单归属人 owner_name 即成员名，命中后用户列渲染彩色胶囊，与云端绑定用户一致 */
function memberOfName(name) {
  if (!name) return null;
  var m = getMembers().find(function (x) { return x.name === name; });
  return m ? { memberId: m.id, name: m.name, color: m.color } : null;
}
function updateBinding(oid, memberId) {
  // 参数白名单校验（绑定属于设置级操作，改绑定需解锁设置）
  oid = safeId(oid);
  if (!oid) { toast('非法 openid', 'error'); return; }
  if (memberId && !safeId(memberId)) { toast('非法成员 ID', 'error'); return; }
  function doBind() {
    var arr = (STORE.config.memberBindings || []).filter(function (x) { return x.openid !== oid; });
    if (memberId) arr.push({ openid: oid, memberId: memberId });
    STORE.config.memberBindings = arr;
    save();
    invalidateUsage();   // v7.9：绑定关系决定订单归属 ⇒ 用量/摊销缓存重算
    renderCurrent();
  }
  if (unlocked.settings) { doBind(); return; }
  requestPassword('settings', '设置').then(function (ok) { if (ok) doBind(); });
}

/* ==================== 图表渲染 ==================== */
function chartTextColor() {
  return getComputedStyle(document.body).getPropertyValue('--text').trim() || '#1b1d2a';
}

/* 饼状图引线标签：从扇区内部一点出发 → 弧外折点 → 水平短段到文字（指示块属性，替代图例）。
   文字紧邻折点放置，超出画布边缘时自动回缩锚定边缘，引线尽可能短。
   防重叠处理（v4.4 修复）：
   · 过小扇区（弧角 < MIN_ARC）跳过标注，避免多状态时小扇区文字互相重叠（tooltip 仍可查明细）；
   · 同侧标签按 y 排序做碰撞检测：垂直间距不足时向下错开，放不下则隐藏；
   · 引线水平段只画到文字近边前 2px，杜绝「引线压在文字上」的叠字问题。 */
var _leaderLabelPlugin = {
  id: 'leaderLabels',
  afterDatasetsDraw: function (chart) {
    if (chart.config.type !== 'doughnut') return;
    var meta = chart.getDatasetMeta(0);
    var arcs = meta && meta.data;
    if (!arcs || !arcs.length) return;
    var ds = chart.data.datasets[0] || {};
    var bgs = ds.backgroundColor || [];
    var labels = chart.data.labels || [];
    var ctx = chart.ctx;
    var w = chart.width, h = chart.height;
    ctx.save();
    ctx.font = '600 12px -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.textBaseline = 'middle';

    var MIN_ARC = 0.09;   // 弧度：小于该弧角的扇区不画标签（≈5.2°，约 1.4%）。
                          // 足够低让 1%+ 的孤立小扇区也能标注；拥挤场景由下方碰撞检测错开/隐藏兜底
    var LABEL_GAP = 16;   // 同侧标签最小垂直间距（px）
    var EDGE = 12;        // 上下留边

    // ── 第 1 步：收集候选标签（跳过过小扇区）──
    var items = [];
    arcs.forEach(function (arc, i) {
      if (!arc || typeof arc.startAngle !== 'number') return;
      var span = arc.endAngle - arc.startAngle;
      if (span < MIN_ARC) return;
      var mid = arc.startAngle + span / 2;
      var cx = arc.x, cy = arc.y;
      var inner = arc.innerRadius, outer = arc.outerRadius;
      // 标注文字/线段颜色：取扇区色的「加深」色阶，与扇区填充色区分开——
      // 保留「标签→扇区」的色彩关联，同时避免文字/线段与扇区颜色完全重合（统一压暗 20%）
      var col = _mixToBlack(bgs[i] || '#888', 0.20);
      var cosM = Math.cos(mid), sinM = Math.sin(mid);
      var right = cosM >= 0;
      // 起点：扇区内部（环厚中点，指示该块）
      var r0 = inner + (outer - inner) / 2;
      var sx = cx + cosM * r0, sy = cy + sinM * r0;
      // 折点：弧外一点
      var bx = cx + cosM * (outer + 6), by = cy + sinM * (outer + 6);
      // 上下留边，避免垂直方向文字出界
      by = Math.max(EDGE, Math.min(h - EDGE, by));
      var txt = labels[i] || '';
      // v4.4：超长标签截断加省略号（悬停 tooltip 可看全文），防止文字溢出画布
      var MAX_TW = Math.max(110, Math.floor(w * 0.32));
      var tw = ctx.measureText(txt).width;
      if (tw > MAX_TW) {
        while (txt.length > 1 && ctx.measureText(txt + '…').width > MAX_TW) {
          txt = txt.slice(0, -1);
        }
        txt += '…';
        tw = ctx.measureText(txt).width;
      }
      items.push({ right: right, sx: sx, sy: sy, bx: bx, by: by, txt: txt, tw: tw, col: col, hidden: false });
    });
    if (!items.length) { ctx.restore(); return; }

    // ── 第 2 步：同侧标签碰撞检测 —— 按 y 排序，间距不足向下错开，放不下则隐藏 ──
    var sides = { true: [], false: [] };
    items.forEach(function (it) { sides[it.right].push(it); });
    [true, false].forEach(function (isRight) {
      var arr = sides[isRight];
      if (!arr.length) return;
      arr.sort(function (a, b) { return a.by - b.by; });
      var prevBy = -Infinity;
      arr.forEach(function (it) {
        if (!it.hidden && it.by - prevBy < LABEL_GAP) {
          var newBy = prevBy + LABEL_GAP;
          if (newBy <= h - EDGE) it.by = newBy;   // 向下错开，引线随之弯曲指向新位置
          else it.hidden = true;                   // 已无空间 → 隐藏该标注
        }
        if (!it.hidden) prevBy = it.by;
      });
    });

    // ── 第 3 步：绘制（水平段只到文字近边前 2px，避免压字）──
    items.forEach(function (it) {
      if (it.hidden) return;
      var bx = it.bx, by = it.by;
      var lx, align;
      if (it.right) {
        if (bx + 8 + it.tw <= w - 4) { lx = bx + 8; align = 'left'; }
        else { lx = w - 8; align = 'right'; }
      } else {
        if (bx - 8 - it.tw >= 4) { lx = bx - 8; align = 'right'; }
        else { lx = 8; align = 'left'; }
      }
      // 文字近边（水平段终点，线只画到文字前 2px，不压字）：
      // 文字在折点右侧 → 近边=文字左缘；文字在折点左侧 → 近边=文字右缘
      // v4.4：水平安全钳制 —— 文字左右缘绝不越出画布（超长标签已省略号截断，此处兜底）
      var tl = (align === 'left') ? (lx + 4) : (lx - 4 - it.tw);
      if (tl < 4) { align = 'left'; lx = 8; tl = 12; }
      else if (tl + it.tw > w - 4) { align = 'right'; lx = w - 8; tl = w - 12 - it.tw; }
      var textNear = it.right ? tl : (tl + it.tw);
      // 折线：内部起点 → 折点 → 水平段（止于文字近边前 2px）
      ctx.strokeStyle = it.col;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(it.sx, it.sy);
      ctx.lineTo(bx, by);
      ctx.lineTo(textNear - 2, by);
      ctx.stroke();
      // 文字
      ctx.fillStyle = it.col;
      ctx.textAlign = align;
      ctx.fillText(it.txt, align === 'left' ? lx + 4 : lx - 4, by);
    });
    ctx.restore();
  }
};

function _renderStatusDonut(canvasId, orderStatusCount) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var src = orderStatusCount;
  var sorted = Object.keys(src).sort(function (a, b) { return src[b] - src[a]; });
  var labels = [], data = [], colors = [];
  sorted.forEach(function (s) { labels.push(statusLabel(s) + ' ' + src[s]); data.push(src[s]); colors.push(_statusColor(s)); });
  var total = data.reduce(function (a, b) { return a + b; }, 0);
  _cloudCharts[canvasId] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, hoverBackgroundColor: colors.map(function (c) { return _mixToWhite(c, 0.15); }), hoverBorderColor: 'transparent', borderWidth: 2, borderColor: 'transparent', hoverOffset: 12 }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '58%',
      layout: { padding: 26 },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function (c) { var pct = total > 0 ? (c.parsed / total * 100).toFixed(1) : 0; return c.label + ' (' + pct + '%)'; } } }
      },
      animation: { animateRotate: true, duration: 1000, easing: 'easeOutQuart' }
    },
    plugins: [_leaderLabelPlugin]
  });
}
/* 订单构成的四个来源（**唯一真相**：环形图分段与下方图例都读这一份，改色/加来源只改这里）。
   v7.4：外部打印监视（print_watch 里「已处理」的作业）与云端三来源并列，颜色与
   _SOURCE_OPTIONS 的 external 同色 —— 来源筛选 / 明细徽标 / 环形图 / 图例一个色系。 */
var _SOURCE_SEGS = [
  { key: 'wechat', label: '小程序', color: '#07C160' },
  { key: 'app', label: 'APP', color: '#4F6EF7' },
  { key: 'local', label: '本地', color: '#FF9500' },
  { key: 'external', label: '外部监视', color: '#0d9488' }
];
/* 环形图下方的图例（**唯一实现**，三个环形图共用）：items = [{label, color, count, unit}]，
   count<=0 的不占位置。为什么需要它：引线标签插件对弧长 < MIN_ARC≈5.2° 的扇区直接跳过
   （外部监视 1 单 = 0.22%、放弃打印 1 单……），光看图看不出这些项存在过；图例把名称与
   计数直接写出来，与扇区同色，小到看不见的项也一眼能找到。 */
function _donutLegendHTML(items) {
  var parts = (items || []).map(function (it) {
    if (!it) return '';
    var n = Number(it.count) || 0;
    if (n <= 0) return '';
    return '<span class="dl-item"><i class="dl-dot" style="background:' + it.color + '"></i>'
      + it.label + ' <b class="dl-num">' + n + '</b>' + (it.unit || '单') + '</span>';
  }).filter(function (x) { return x; });
  return parts.length ? '<div class="donut-legend">' + parts.join('') + '</div>' : '';
}
/* 订单构成：四个来源（_SOURCE_SEGS 是唯一真相） */
function _sourceLegendHTML(rs) {
  return _donutLegendHTML(_SOURCE_SEGS.map(function (s) {
    return { label: s.label, color: s.color, count: (rs && rs[s.key + '_orders']) || 0 };
  }));
}
/* 订单状态分布：与环形图**同一排序**（按单数降序），否则图例顺序跟扇区对不上 */
function _statusLegendHTML(statusCount) {
  var src = statusCount || {};
  var sorted = Object.keys(src).sort(function (a, b) { return src[b] - src[a]; });
  return _donutLegendHTML(sorted.map(function (s) {
    return { label: statusLabel(s), color: _statusColor(s), count: src[s] };
  }));
}
/* 免费打印占比：两段（免费打印=管理员自行打印 / 实际订单），颜色与扇区一致 */
function _selfRatioLegendHTML(selfCount, totalCount) {
  var self = Number(selfCount) || 0;
  var total = Number(totalCount) || 0;
  return _donutLegendHTML([
    { label: '免费打印', color: '#007AFF', count: self },
    { label: '实际订单', color: '#FF9500', count: Math.max(0, total - self) }
  ]);
}
function _renderSourceDonut(canvasId, rs) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var segs = _SOURCE_SEGS;
  // v5.19：订单构成 —— 按来源订单数绘图（由「收益构成」改为「订单构成」）
  var labels = [], data = [], colors = [], keys = [];
  segs.forEach(function (s) {
    var v = rs[s.key + '_orders'] || 0;
    if (v <= 0) return;
    labels.push(s.label + ' ' + v + '单');
    data.push(v);
    colors.push(s.color);
    keys.push(s.key);        // 与 data 一一对应：扇形下标 → 来源 key（见下方 tooltip）
  });
  if (!data.length) return;   // 本月无订单，不画图
  _cloudCharts[canvasId] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, hoverBackgroundColor: colors.map(function (c) { return _mixToWhite(c, 0.15); }), hoverBorderColor: 'transparent', borderWidth: 2, borderColor: 'transparent', hoverOffset: 12 }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '55%',
      layout: { padding: 24 },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function (c) {
          // ⚠ 必须用 keys[c.dataIndex]：无单的来源不会推入 data，直接用 segs 下标会错位
          //（如 APP 为 0 时，悬停「本地」会报成 APP 的文件数与页数）
          var k = keys[c.dataIndex];
          return c.label + ' — 文件 ' + (rs[k + '_files'] || 0) + ' · ' + (rs[k + '_pages'] || 0) + '页';
        } } }
      },
      animation: { animateRotate: true, duration: 1000, easing: 'easeOutQuart' }
    },
    plugins: [_leaderLabelPlugin]
  });
}
/* 免费打印 vs 实际订单 比例环形图（免费打印=管理员自行打印） */
function _renderSelfRatioDonut(canvasId, selfCount, totalCount) {

    type: 'doughnut',
    data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, hoverBackgroundColor: colors.map(function (c) { return _mixToWhite(c, 0.15); }), hoverBorderColor: 'transparent', borderWidth: 2, borderColor: 'transparent', hoverOffset: 12 }] },
    options: {

        legend: { display: false },

      },
      animation: { animateRotate: true, duration: 1000, easing: 'easeOutQuart' }

    plugins: [_leaderLabelPlugin]
  });
}
/* 接单设备比例环形图（2026-12 多设备接单：按订单数，悬停看收益） */
function _renderDeviceDonut(canvasId, agg) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var labels = [], data = [], colors = [], revs = [];
  var palette = ['#4F6EF7', '#07C160', '#FF9500', '#AF52DE', '#FF3B30', '#00C7BE', '#FF6482', '#FFD60A'];
  Object.keys(agg).forEach(function (k, i) {

  });
  if (!data.length) return;   // 该口径无订单，不画图
  _cloudCharts[canvasId] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, hoverBackgroundColor: colors.map(function (c) { return _mixToWhite(c, 0.15); }), hoverBorderColor: 'transparent', borderWidth: 2, borderColor: 'transparent', hoverOffset: 12 }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '55%',
      layout: { padding: 24 },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function (c) { return c.label + ' · 收益 ' + RMB(revs[c.dataIndex]); } } }
      },
      animation: { animateRotate: true, duration: 1000, easing: 'easeOutQuart' }
    },
    plugins: [_leaderLabelPlugin]
  });
}
/* 颜色向白色混合生成高亮色，用于柱状图悬停放大效果 */
function _mixToWhite(c, amt) {
  var m = String(c).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  var r, g, b;
  if (m) { r = +m[1]; g = +m[2]; b = +m[3]; }
  else {
    var h = String(c).replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    r = parseInt(h.slice(0, 2), 16); g = parseInt(h.slice(2, 4), 16); b = parseInt(h.slice(4, 6), 16);
  }
  r = Math.round(r + (255 - r) * amt);
  g = Math.round(g + (255 - g) * amt);
  b = Math.round(b + (255 - b) * amt);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
/* 颜色向黑色混合（v5.11：浅色主题悬停时柱体变暗） */
function _mixToBlack(c, amt) {
  var m = String(c).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  var r, g, b;
  if (m) { r = +m[1]; g = +m[2]; b = +m[3]; }
  else {
    var h = String(c).replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    r = parseInt(h.slice(0, 2), 16); g = parseInt(h.slice(2, 4), 16); b = parseInt(h.slice(4, 6), 16);
  }
  r = Math.round(r * (1 - amt));
  g = Math.round(g * (1 - amt));
  b = Math.round(b * (1 - amt));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function _renderUserBar(canvasId, byUser, field, label, fmtLabel, barColorFn) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  // 注意：金额字段（revenue/paid）传入的数据必须是「元」（Chart 直接画数值），
  // tooltip 用 parseCents 还原为「分」显示 ¥xx.xx；若传整数分会把金额放大 100 倍。
  var sorted = byUser.slice().sort(function (a, b) { return b[field] - a[field]; });
  var labels = sorted.map(function (u) { return u._memberName || u.nickname || (u.openid || '').substring(0, 8); });
  var values = sorted.map(function (u) { return u[field]; });
  var maxVal = Math.max.apply(null, values.concat([0])) || 1;
  var barColors = sorted.map(function (u) { return barColorFn ? barColorFn(u, field, maxVal) : '#4f6ef7'; });
  var barHover = barColors.map(function (c) { return _mixToWhite(c, 0.4); });
  _cloudCharts[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels: labels, datasets: [{ label: label, data: values, backgroundColor: barColors, hoverBackgroundColor: barHover, hoverBorderColor: barColors, hoverBorderWidth: 3, borderRadius: 6 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function (c2) { return label + ': ' + (field === 'revenue' || field === 'paid' ? RMB(parseCents(c2.parsed.y)) : c2.parsed.y + ' 单'); } } }
      },
      scales: {
        y: { beginAtZero: true, max: maxVal * 1.25, grid: { color: 'rgba(120,130,160,.12)' }, ticks: { color: chartTextColor() } },
        x: { grid: { display: false }, ticks: { color: chartTextColor(), maxRotation: 30, font: { size: 10 } } }
      },
      animation: { duration: 1000, easing: 'easeOutQuart' }
    }
  });
}
/* 用户下单渠道分布：横向堆积柱状图（每根柱子 = 一位成员，小程序/APP 两段不同颜色） */
function _renderClientStackedBar(canvasId, byUser) {
  var canvas = document.getElementById(canvasId);
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  // 仅统计有下单记录的成员（排除本地任务伪行）
  var users = (byUser || []).filter(function (u) {
    return u.openid !== 'local' && ((u.wechat_orders || u.wechat || 0) + (u.app_orders || u.app || 0)) > 0;
  });
  if (!users.length) return;
  users = users.slice().sort(function (a, b) {
    return ((b.wechat_orders || b.wechat || 0) + (b.app_orders || b.app || 0)) - ((a.wechat_orders || a.wechat || 0) + (a.app_orders || a.app || 0));
  });
  var MAX_BARS = 12;
  var labels = [], wechatData = [], appData = [];
  function pushBar(name, w, a) { labels.push(name); wechatData.push(w); appData.push(a); }
  users.slice(0, MAX_BARS - 1).forEach(function (u) {
    pushBar(u._memberName || u.nickname || (u.openid || '').substring(0, 8), u.wechat_orders || u.wechat || 0, u.app_orders || u.app || 0);
  });
  if (users.length > MAX_BARS - 1) {
    var restW = 0, restA = 0;
    users.slice(MAX_BARS - 1).forEach(function (u) { restW += (u.wechat_orders || u.wechat || 0); restA += (u.app_orders || u.app || 0); });
    pushBar('其他', restW, restA);
  }
  var totals = labels.map(function (_, i) { return wechatData[i] + appData[i]; });
  var maxTotal = Math.max.apply(null, totals.concat([0])) || 1;
  _cloudCharts[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: {

   ⚠ 用量没就绪（loading / failed）时**退回旧口径**（整笔采购照旧计入），绝不把整笔钱
   静默剔除 —— 否则历史记录 / 添加转账 / 一键填入建议转账三个入口都会少记一笔，
   最坏情况（该月只有这一笔采购）会把「还欠采购人多少」算成 0 并报“全部结清”。
   页面在「收支清算」有横幅说明，取数成功后自动改为按月摊销。 */
function calcMonthWithUsage(key) {
  var st = amortStateOfMonth(key);
  var need = amortNeededMonths(key);
  var amort = { rows: [], lots: [], byBuyer: {}, totalCents: 0, totalUnits: 0,
                uncovered: { paper: {}, toner: {} }, state: st, needed: need };
  var ready = (st === 'ready');
  if (ready) {
    var um = {};
    need.forEach(function (mk) { um[mk] = usageOfMonth(mk); });
    amort = consumableAmort(consumablePurchases(), um, key);
    amort.state = 'ready';
    amort.needed = need;
  }
  var r = calcMonth(monthFromRecords(key), {
    usage: usageOfMonth(key),
    amort: (st === 'ready' || st === 'none') ? amort : null,   // 未就绪 ⇒ 旧口径
  });
  r.amort = amort;   // 展示层仍要知道「现在是 loading/failed」，提示与标记都靠它
  return r;
}

}
/* ── v7.9：长期耗材摊销区块（只展示 r.amort，不另算一份） ──
   四类信息：① 未参与摊销的耗材行为什么没参与（缺数量 / 采购人不在名单）；

   ④ 本月有用量但没库存可摊时明确提示（否则会以为"怎么没摊"）。 */
function consumableAmortSectionHTML(r, m) {
  var am = (r && r.amort) ? r.amort : null;
  var state = am && am.state ? am.state : 'none';
  var raw = (m.expenses || []).filter(isConsumableExpense);
  var pending = raw.filter(function (e) { return !isAmortizableExpense(e); });
  var h = '<div class="section" id="consumableSection"><h2>🧾 长期耗材摊销 <span class="hint">（A4纸按张 / 硒鼓按页 · 采购时先垫整笔，结算只认本月用掉的部分）</span></h2>';
  /* ⚠ 早退条件必须同时看「本月有没有耗材采购」与「有没有摊销批次」：
     购买月之后的月份，本月 expenses 里当然没有那笔采购，但 r.amort.lots 里还挂着
     它（按「最早采购月 → 结算月」重算）—— 只看 raw.length 会让购买月之后的**每个月**
     都显示“还没有长期耗材采购”，本月摊销 / 剩余 / 返还对象全部消失。
     取数中/失败时也不能早退（那时 lots 还没算出来，但下面有「正在统计 / 暂按整笔」提示）。 */
  var _busy = !!(am && (am.state === 'loading' || am.state === 'failed'));

      + pending.map(function (e) {

      + (state === 'failed'

          : '正在统计用量：本月长期耗材<b>暂按整笔采购计入</b>，统计完成后自动改为按月摊销。')
      + '</div></div>';

  if (state === 'ready' && am && am.lots && am.lots.length) {
    h += '<div class="table-wrap"><table><thead><tr><th>耗材</th><th>采购（日期 · 金额 · 采购人）</th><th>总量</th><th>单价</th><th>累计使用</th><th>已摊销</th><th>本月用量</th><th>本月摊销</th><th>剩余未摊销</th></tr></thead><tbody>';
    am.lots.forEach(function (d) {
      var buyer = getMember(d.payer);
      h += '<tr><td style="font-weight:700">' + esc(d.label) + (d.item ? '<div style="font-size:.72rem;color:var(--muted);font-weight:400">' + esc(d.item) + '</div>' : '') + '</td>';
      h += '<td style="font-size:.8rem;white-space:nowrap">' + esc(d.date) + ' · ' + RMB(d.priceCents) + '<div style="font-size:.72rem;color:var(--muted)">' + esc(buyer ? buyer.name : d.payer) + '</div></td>';
      h += '<td>' + fmtInt(d.units) + ' ' + d.unit + '</td>';

      h += '<td class="neg" style="font-weight:700">' + (d.monthCents > 0 ? RMB(d.monthCents) : '<span style="color:var(--muted)">¥0.00</span>') + '</td>';
      h += '<td>' + (d.remainingCents > 0 ? RMB(d.remainingCents) : '<span class="tag g">已摊销完</span>') + '</td></tr>';
    });

    h += '</tbody></table></div>';
    var buyers = Object.keys(am.byBuyer || {});

        + buyers.map(function (id) {

          }).join(' · ')
        + '<span style="color:var(--muted)">（已记在他们名下，结算时随「垫付差额」收回；实际收回 = 本月摊销 − 他自己应摊的那份）</span></div>';

    }
    /* 有用量但没有库存可摊 —— 说清楚，别让人以为摊销漏了 */
    ['paper', 'toner'].forEach(function (kind) {
      var n = (am.uncovered && am.uncovered[kind] && am.uncovered[kind][m.key]) || 0;
      if (n > 0) {
        h += '<div style="margin-top:6px;font-size:.8rem;color:var(--orange)">⚠ 本月有 ' + fmtInt(n) + ' ' + CONSUMABLE_KIND[kind].unit
          + ' ' + CONSUMABLE_KIND[kind].label + '用量没有对应库存（采购未录入或已用完），这部分未计摊销。</div>';
      }
    });
    /* v7.9：没有 created_at 的老订单无法归日 ⇒ 不进摊销（也绝不硬塞到月末 —— 那会把
       购买日之前的用量也摊进这批）。单独提示，别让人以为少算了。 */
    var _u = usageOfMonth(m.key) || {};
    var _undated = _u.undatedSheets || 0, _undatedP = _u.undatedPages || 0;
    if (_undated > 0 || _undatedP > 0) {
      h += '<div style="margin-top:6px;font-size:.8rem;color:var(--orange)">⚠ 本月有 ' + fmtInt(_undated) + ' 张纸 / ' + fmtInt(_undatedP)

    }
    h += '<div style="margin-top:6px;font-size:.78rem;color:var(--muted)">摊销只在<b>采购日之后</b>的用量上计算（买之前用的纸 / 鼓不算这批）；'

    return h;

  h += '<div style="color:var(--muted);font-size:.85rem">本月还没有可摊销的长期耗材（填好类型与数量后自动开始）。</div></div>';
  return h;
}

/* ==================== TAB: 收支清算 ==================== */
function renderDash() {
  var el = $('#tab-dash');
  var keys = allMonthKeys();
  if (!keys.includes(currentKey)) currentKey = keys[keys.length - 1] || currentMonthKey();
  var m = monthFromRecords(currentKey);
  var r = calcMonthWithUsage(currentKey);
  var hasData = (m.expenses.length + (STORE.records.income || []).filter(function (x) { return monthKeyOf(x.date) === currentKey; }).length + (STORE.records.scores || []).filter(function (x) { return monthKeyOf(x.date) === currentKey; }).length + m.transfers.length) > 0;

  // v4.2：无成员空态 —— 引导到「设置」添加成员（订单归属/收支结算的前提）
  if (!getMembers().length) {
    var hEmpty = '<div class="filter-bar" style="align-items:center">';
