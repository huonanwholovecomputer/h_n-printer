    hEmpty += '</div>';
    hEmpty += '<div class="section" style="text-align:center;padding:60px 20px"><div class="empty"><div class="ico">👥</div><h3>暂无成员</h3><p style="margin-top:6px">请先在「设置」中添加成员，成员将用于订单归属与收支结算，添加后本地打印工具的归属下拉会同步显示。</p><button class="btn pri" style="margin-top:16px" onclick="switchTab(\'settings\')">⚙️ 去设置添加成员</button></div></div>';
    el.innerHTML = hEmpty;
    playSettledEntrance(usageStateOfMonth(currentKey), 'none');   // 首屏占位也要淡入；并记下这套结构，成员载入后算跳变
    return;
  }

  /* 用量（按用量分摊 / 设备折旧 / 长期耗材摊销）按需拉取：首次进入或换月取一次，取回后就地重绘。
     失败不重试（避免打满请求），页面照旧可用并显式标注"未取到用量"。
     ⚠ 必须放在「无成员」早退**之后**：页面初始化时 STORE 还是空的（成员为空），
     若此时就发请求，回调里 `_orderMemberKey` 认不出成员 ⇒ 用量被缓存成「全部未归属」，
     按用量分摊会一直退回均摊（要等某次缓存失效才恢复）。 */
  if (usageStateOfMonth(currentKey) === 'idle') {
    var _uKey = currentKey;
    ensureUsage(_uKey, function () { if (currentTab === 'dash' && currentKey === _uKey) renderDash(); });
  }
  /* v7.9：长期耗材要回溯「最早采购月 ~ 本月」的逐日用量，缺月就补取（取回后自动重绘） */
  var _amKey = currentKey;

    kickAmortUsage(_amKey, function () {

  var h = '<div class="filter-bar" style="align-items:center">';
  h += '<div class="f-item"><label>📅 结算月份</label>' + monthSelectHTML('dash-month', currentKey) + '</div>';
  if (hasData) h += '<div class="f-item" style="margin-left:auto"><span class="tag b">' + m.label + '</span></div>';
  h += '</div>';

  if (!hasData) {
    h += '<div class="section" style="text-align:center;padding:50px 20px"><div class="empty"><div class="ico">📭</div><h3>' + m.label + ' 暂无数据</h3><p style="margin-top:6px">切换到「记账」标签录入采购 / 代收 / 评分，数据将自动归入对应月份。</p><button class="btn pri" style="margin-top:16px" onclick="switchTab(\'entry\')">📝 去记账</button></div></div>';
    el.innerHTML = h;

     否则"赚了多少"会虚高（打印机越用越旧，那部分价值是实打实消耗掉的）。 */
  var totalPL = 0;
  getMembers().forEach(function (mem) { totalPL += (r.bookPL[mem.id] || 0); });
  var basisLabel = r.useUsage
    ? ('按用量分摊 · 共 ' + r.usageTotal + ' 页')

  var ustate = usageStateOfMonth(currentKey);
  if (ustate === 'loading') {
    h += '<div class="alert-banner"><span class="msg"><span class="loading-spin"></span>正在统计「' + m.label + '」的实际出纸页数（用量）—— 按用量分摊与设备折旧随后自动刷新。</span></div>';

  } else if (r.basis === 'usage' && r.basisFallback) {

  /* v7.9：长期耗材摊销的取数状态（要回溯到最早采购月，第一次进页会多拉几个月）。
     未就绪时**暂按整笔采购计入**（旧口径）—— 宁可购买月暂时偏高，也不让整笔钱在
     历史记录 / 新增转账 / 一键填入建议转账里静默消失。 */
  if (r.amort && r.amort.state === 'loading') {
    h += '<div class="alert-banner"><span class="msg"><span class="loading-spin"></span>正在统计长期耗材（A4纸 / 硒鼓）的逐日用量（需回溯到最早采购月）：本月长期耗材<b>暂按整笔采购计入</b>，统计完成后自动改为按月摊销。</span></div>';
  } else if (r.amort && r.amort.state === 'failed') {

      + '<span class="sub">在取数成功前，先别「一键填入建议转账」。</span></span><button class="btn sm" onclick="retryAmortUsage()">重试</button></div>';

  // 采购明细（v7.4：分摊口径 = 均摊 / 按用量，比例与应摊额单列一张表；v7.9：含耗材本月摊销）
  h += '<div class="section"><h2>🧾 采购明细 <span class="hint">(' + esc(basisLabel) + ')</span></h2><div class="table-wrap"><table><thead><tr><th class="l">项目</th><th>金额</th><th>代付人</th></tr></thead><tbody>';

}

/* 取数完成时的入场动画（2026-10-29 用户反馈「分段加载会闪一下」）。
   用量统计与长期耗材摊销是**分两段**回来的：先渲染一版「正在统计…」的骨架，结果到了再整块
   重画成真实值 —— 两次 innerHTML 替换之间比例、金额一起跳变，眼睛看着就是闪。
   这里在「取数中 → 拿到结果」之后，给 KPI 卡与下方各区块补一段 fadeUp 入场
   （按顺序 stagger），把突变变成过渡。
   ⚠ 只认「完成那一次重画」不够（2026-10-29 现场逐帧截图：动画一次都没出现）：取数回调
   往往**连着**触发好几次重画（云端月份、设备列表、外部账本各通知一次），上一次播到一半的
   DOM 会被下一份 innerHTML 整个换掉 ⇒ 新节点上一条动画都不剩。所以在完成后的
   ENTRANCE_WINDOW_MS 内**每次重画都重播**（新节点从 opacity:0 淡入，不会有闪回感），
   窗口一过就彻底停。
   触发源有两个：①「取数中 → 拿到结果」；②可见结构跳变（首次渲染、暂无成员 → 卡片、
   区块/横幅增减）。只改数字与行数的重画（记金额、切份数、改密码、后台新进一单）不播。 */
var _dashLoadStates = { usage: '', amort: '' };
var ENTRANCE_WINDOW_MS = 600;      // 入场窗口：这段时间内每次重画都重播（见上）
var _dashEntranceUntil = 0;
/* 「可见结构」指纹：占位/空态、KPI 卡数、区块数、横幅数。
   刻意**不含表格行数** —— 外部打印自动记账是后台持续进来的（每出一单多一行），把行数算进指纹
   会让整页每来一单都淡入一次，比不动更扰。行级新增本来也不需要整页入场。
   取数完成只是**结构跳变**的一种 —— 页面上还有两种更早的跳变（2026-10-29 用户逐帧反馈
   「第三张图的动画有了，但是前两个没有」）：页面刚打开时 STORE 还没取回来 ⇒ 先渲染
   「暂无成员」占位，配置到达后整页换成 KPI 卡 + 两条「正在统计…」。这两次同样是 innerHTML
   整块替换，没有动画就是硬跳。指纹变了就补一段入场，指纹没变（只改了数字/金额）不播。 */
var _dashShape = '';
function dashShapeKey() {
  function n(sel) { return document.querySelectorAll('#tab-dash ' + sel).length; }
  return [n('.empty'), n('.kpi-card'), n('.section'), n('.alert-banner')].join('/');
}
function trackDashShape() {
  var key = dashShapeKey();
  var changed = key !== _dashShape;
  _dashShape = key;
  return changed;
}
function playSettledEntrance(ustate, amortState) {
  var now = (window.performance && window.performance.now) ? window.performance.now() : +new Date();
  var prev = _dashLoadStates;
  _dashLoadStates = { usage: ustate, amort: amortState };
  var wasLoading = prev.usage === 'loading' || prev.amort === 'loading';
  var settledNow = ustate !== 'loading' && amortState !== 'loading';
  if (wasLoading && settledNow) _dashEntranceUntil = now + ENTRANCE_WINDOW_MS;
  if (trackDashShape()) _dashEntranceUntil = now + ENTRANCE_WINDOW_MS;   // 占位→卡片、成员载入、区块增减
  if (!_dashEntranceUntil || now > _dashEntranceUntil) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var nodes = $$('#tab-dash .kpi-card, #tab-dash .section, #tab-dash .settle-box');
  if (!nodes || !nodes.forEach) return;
  nodes.forEach(function (node, i) {
    if (!node.animate) return;             // 老 Safari 没有 WAAPI：直接就是终态，不影响读数
    node.animate(
      [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }],
      { duration: 360, delay: Math.min(i, 12) * 45,
        easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'backwards' });
  });
}

/* 建议转账 vs 实际已转（渲染 + 就地刷新共用） */
function transferGapChipsHTML(m, r, disabledAttr) {
  var h = '';

/* 实际盈亏（现金口径）区块。金额为 0 时不带正负号，避免出现「−¥0.00」「+¥0.00」这类看着像 bug 的显示。 */

  h += '<div style="margin-top:8px;font-size:.8rem;color:var(--muted)">实际盈亏 = 这个月他<b>真正</b>拿到的钱减真正掏出去的钱，再扣掉自己用掉的<b>设备寿命价值</b>（折旧是非现金成本：机器早已买好，本月没有现金流出，但它确实被磨掉了）。<br>长期耗材（A4纸 / 硒鼓）的整笔采购款同理不算当月成本 —— 那是库存，按每月实际用量摊销后逐月记到采购人名下（见「垫付清算」脚注）。<br>转账是成员内部的钱，合计为 0，不影响团队总盈亏。全部结清时「实际盈亏」= 「应得盈亏」；没结清时差额就是<b>还没到位的钱</b> —— 差额为正的人被欠着，团队亏损实际由他垫着。</div></div>';

/* ==================== v7.4：云端数据「🖨️ 打印机」区块 ====================
   两张表：
     ① 每台机器在本口径区间内：页数 / 已耗寿命% / 该区间折旧（页数 × 每页成本）；
     ② 订单级：时间 / 订单号 / 成员 / 接单设备 / 打印机 / 页数 / 折旧 —— 回答"这单是哪台机打的"。
   机型来源：已登记机器（绑定设备或机型名命中）> 已知机型表（霍楠=1020 / 姚懿祥=M232）；
   只认得出机型但没登记的，**照实显示机型但折旧为 0**（没有价格/寿命就无从计提，不编数）。 */
function printerUsageSectionHTML(orders) {
  var list = orders || [];

    if (!info.name) { unmatchedPages += pages; unmatchedOrders++; return; }

        : '打印机列<b>默认锁定</b>（🔒 与上方台账共用同一把锁）：解锁后可逐单指定"这张单是哪台机打的"，未指定时按「默认设备」→ 已知机型表兜底。')
    + '折旧 = 页数 × 每页成本（价格 ÷ 寿命页数），只对<b>已登记且在役</b>的机器计提；'
    + '寿命口径为<b>累计实测</b>且还没结算的机器显示「累计中」—— 总寿命未知，所以暂不计提（不是漏了），'
    + '报废结算后这些页数会一次性回溯折旧。'
    + (unmatchedPages > 0 ? '<br>⚠ 有 <b>' + fmtInt(unmatchedPages) + ' 页 / ' + unmatchedOrders + ' 单</b>认不出是哪台机打的（设备未登记且不在已知机型表里）。' : '')
    + '</div></div>';
  return h;
}

/* ==================== 📐 结算公式（v7.4） ====================
   收支清算的完整算式：从「采购 / 代收 / 评分 / 实际转账 / 设备折旧」推到「本月盈亏」。
   ⚠ 本函数**只做展示** —— 所有金额都取自 calcMonth 的返回值（r.xxx），这里绝不做
   第二份计算 / 第二份取整。页面上任何数字只有一个来源，否则两套口径迟早漂移。
   （tests/verify_settle_formula.py 与 tests/verify_usage_depreciation.py 盯住这一点。）

   记法（金额一律整数分）：
     E     有效采购总额（付款人仍是成员的记录）        I_i  i 的代收      E_i  i 的垫付
     s_i   i 的服务得分（单项封顶 scoreCap）           k    投资分成比例
     P₁ = round(I·k) 投资回报池                        P₂ = I − P₁ 服务回报池
     R_i   应得收入 = 分摊(P₁, 等权) + 分摊(P₂, 按 s 加权)
     A_i   采购应摊 = 分摊(E, 权重)；权重 = 均摊时全 1，按用量时各人**实际出纸页数**
     D_i   设备折旧 = 每台机（本月页数 × 每页成本）按人分摊；每页成本 = 价格 ÷ 寿命页数
     N_i   建议转账 = (R_i − I_i) + (E_i − A_i)        T_i 实收−实付（真实转账）
     B_i   应得盈亏 = R_i − A_i − D_i                 C_i 实际盈亏 = I_i + T_i − E_i − D_i
     g_i   未结清 = N_i − T_i = B_i − C_i
   恒等式：ΣN_i ≡ 0；ΣC_i ≡ ΣB_i ≡ Π = I − E − D；T_i ≡ N_i ⇒ C_i = B_i（全额结清时两口径重合）。
   open 参数：就地刷新时保留展开态 —— 用户摊开公式在看，改一笔转账不该把它收起来。 */
function settleFormulaHTML(r, open) {
  var members = getMembers();
  var sumNet = 0, sumBook = 0, sumActual = 0;
  var depTotal = r.depTotal || 0;
  members.forEach(function (mem) {
    sumNet += r.net[mem.id] || 0;
    sumBook += (r.redist[mem.id] || 0) - (r.perPersonShare[mem.id] || 0) - (r.depByMember[mem.id] || 0);
    sumActual += r.actualPL[mem.id] || 0;
  });
  var teamPL = r.totalInc - r.totalExp - depTotal;
  /* 0 不带符号 —— 别渲染出「−¥0.00」「+¥0.00」这种看着像 bug 的东西 */
  var sg = function (c) { return (c > 0 ? '+' : '') + RMB(c); };
  var identOk = (sumNet === 0) && (sumBook === sumActual) && (sumActual === teamPL);

  var h = '<details class="formula-box" id="settleFormula"' + (open ? ' open' : '') + '>';
  h += '<summary>📐 结算公式 <span class="hint">（采购 / 代收 / 评分 / 实际转账 / 设备折旧 → 本月盈亏 的完整算式 · 金额一律整数分）</span></summary>';
  h += '<div class="formula-body">';

  /* ── ① 团队层 ── */
  h += '<h3>① 团队层：一行总式</h3>';
  h += '<pre class="formula-code">团队盈亏 Π = Σ代收 − Σ有效采购 − Σ设备折旧\n           = （投资回报池 P₁ + 服务回报池 P₂） − E − D      ※ P₁ + P₂ ≡ Σ代收</pre>';
  h += '<p>本月代入：Π = ' + RMB(r.totalInc) + ' − ' + RMB(r.totalExp) + (depTotal ? ' − ' + RMB(depTotal) : '')
     + ' = ' + RMB(r.investPool) + ' + ' + RMB(r.servicePool) + ' − ' + RMB(r.totalExp) + (depTotal ? ' − ' + RMB(depTotal) : '')
     + ' = <b>' + sg(teamPL) + '</b></p>';
  var _amNotReady = r.amort && (r.amort.state === 'loading' || r.amort.state === 'failed');
  h += '<p class="note">「有效采购」E = 付款人仍在成员名单里的记录 <b>+ 长期耗材本月摊销</b>'
     + (_amNotReady
        ? '（长期耗材的用量还没就绪：本月<b>暂按整笔采购计入</b>，统计完成后自动改为按月摊销）'
        : (r.amort && r.amort.totalCents > 0
            ? '（本月 A4纸 / 硒鼓摊销 ' + RMB(r.amort.totalCents) + '，已按实际用量折原价计入；'
              + '整笔耗材采购<b>不再在购买当月全额计入</b>，没用的部分留在库存里逐月摊销）'
            : '（长期耗材按每月实际用量摊销，购买当月不计入整笔采购）'))
     + '。'
     + (r.orphanPayerExp > 0
        ? '本月另有已删成员垫付的 ' + RMB(r.orphanPayerExp) + ' 不进结算（采购明细里标「未纳入结算」）'
          + '—— 否则这笔钱会被 ' + r.memberCount + ' 人分摊、却无人承接。'
        : '已删成员垫付的采购不进结算（本月没有这类记录）。')
     + (depTotal > 0
        ? ' 设备折旧 D 是<b>非现金成本</b>（机器早就买好了），它减少利润但不产生任何转账。'
        : ' 本月没有计提设备折旧（未登记打印机 / 本月无出纸页数）。')
     + '</p>';

  /* ── ② 成员层 ── */
  h += '<h3>② 成员层：从流水推到「实际盈亏」</h3>';
  h += '<div class="table-wrap"><table><thead><tr><th style="width:34px">步</th><th style="width:22%">量</th><th>公式</th><th>含义 / 守恒</th></tr></thead><tbody>';
  h += '<tr><td>1</td><td>收入池 <code>P₁ / P₂</code></td><td><code>P₁ = round(I·k)</code>、<code>P₂ = I − P₁</code></td><td>投资池按比例取整，余数全进服务池；<code>P₁ + P₂ = Σ代收</code></td></tr>';
  h += '<tr><td>2</td><td>应得收入 <code>Rᵢ</code></td><td><code>Rᵢ = 分摊(P₁, 等权) + 分摊(P₂, 按 sᵢ 加权)</code></td><td><code>ΣRᵢ = I</code>；服务分全为 0 时退化为等权均分</td></tr>';
  h += '<tr><td>3</td><td>采购应摊 <code>Aᵢ</code></td><td><code>Aᵢ = 分摊(E, 权重)</code></td><td><code>ΣAᵢ = E</code>；<b>权重 = 均摊时全 1，按用量时各人本月出纸页数</b>；<b>E = 普通采购 + 长期耗材本月摊销</b></td></tr>';
  h += '<tr><td>4</td><td>设备折旧 <code>Dᵢ</code></td><td><code>Dᵢ = Σ_团队共担机 (该机本月页数_i × 每页成本)</code></td><td><code>ΣDᵢ = D</code>；每页成本 = 价格 ÷ 寿命页数；<b>非现金成本</b></td></tr>';
  h += '<tr><td>5</td><td>损耗费 <code>Wᵢ</code></td><td><code>Wᵢ = Σ_收损耗费机 (收到的补偿ᵢ − 付给所有者的ᵢ)</code></td><td><b><code>ΣWᵢ ≡ 0</code></b>；使用者为负、所有者为正；只有"购买款已付过"的机器才有</td></tr>';
  h += '<tr><td>6</td><td>建议转账 <code>Nᵢ</code></td><td><code>Nᵢ = (Rᵢ − Iᵢ) + (Eᵢ − Aᵢ) + Wᵢ</code></td><td>即页面「收入调整 + 垫付差额 ± 损耗费」；<b><code>ΣNᵢ ≡ 0</code></b></td></tr>';
  h += '<tr><td>7</td><td>实收实付 <code>Tᵢ</code></td><td><code>Tᵢ = Σ转入ᵢ − Σ转出ᵢ</code></td><td>只认当月、收付双方仍在名单、非自转、非 0 元的记录（含损耗费是否真的付了）</td></tr>';
  h += '<tr><td>8</td><td><b>实际盈亏</b> <code>Cᵢ</code></td><td><code>Cᵢ = Iᵢ + Tᵢ − Eᵢ − Dᵢ</code></td><td>现金口径（损耗费通过 T 流过，不在这里另扣）</td></tr>';
  h += '<tr><td>9</td><td><b>应得盈亏</b> <code>Bᵢ</code></td><td><code>Bᵢ = Rᵢ − Aᵢ − Dᵢ + Wᵢ = Nᵢ + Iᵢ − Eᵢ − Dᵢ</code></td><td>账面口径：该赚该亏，与钱有没有真转无关</td></tr>';
  h += '<tr><td>10</td><td>未结清 <code>gᵢ</code></td><td><code>gᵢ = Nᵢ − Tᵢ = Bᵢ − Cᵢ</code></td><td>正 = 别人还欠他；负 = 已超付</td></tr>';
  h += '</tbody></table></div>';

  /* ── ③ 恒等式 + 本月实算自检 ── */
  h += '<h3>③ 三条恒等式（也是本月数据的自检）</h3>';
  h += '<pre class="formula-code">Σ 建议转账 Nᵢ ≡ 0                        ← 内部转账自平衡\nΣ 损耗费 Wᵢ ≡ 0                          ← 使用者付给所有者，只在成员间转移\nΣ 实际盈亏 Cᵢ ≡ Σ 应得盈亏 Bᵢ ≡ Π = I − E − D   ← 团队盈亏不因转账/损耗费改变\nTᵢ ≡ Nᵢ  ⇒  Cᵢ = Bᵢ                     ← 全额结清时两个口径重合</pre>';
  h += '<p>本月实算：<code>ΣN = ' + sg(sumNet) + '</code> · <code>ΣB = ' + sg(sumBook)
     + '</code> · <code>ΣC = ' + sg(sumActual) + '</code> · <code>Π = ' + sg(teamPL) + '</code> '
     + (identOk ? '<span class="chk ok">✅ 自检通过</span>' : '<span class="chk bad">❌ 三处对不上（数据异常，请核对采购 / 转账 / 打印机记录）</span>') + '</p>';
  h += '<p class="note">团队盈亏与转账无关：转账只改变「亏损由谁垫着」。全部结清时每个人的实际盈亏 = 应得盈亏；没结清时 '
     + '<code>gᵢ</code> 就是还没到位的钱 —— 垫了大头又收不到转账的人，实际亏损会远大于账面亏损。</p>';

  /* ── ④ 取整规则 ── */
  h += '<h3>④ 取整规则（唯一需要注意的坑）</h3>';
  h += '<p>五处分摊（采购应摊 / 团队折旧 / 损耗费 / 投资回报 / 服务回报）一律走 <code>apportionCents()</code>：先各自向下取整，'
     + '余下的分按小数部分从大到小各补 1 分，同值按成员顺序（稳定可复现），<b>保证 Σ 恒等于池子总额</b>。'
     + '绝不能各自四舍五入 —— 那样 3 人 ¥1.00 会成 ¥0.34×3 = ¥1.02，上面两条 <code>ΣN ≡ 0</code>、'
     + '「结清即相等」的恒等式就永久不成立了。</p>';

  /* ── ⑤ 页面各表 ↔ 公式记号 ── */
  h += '<h3>⑤ 页面上每张表用的是哪个量</h3>';
  h += '<div class="table-wrap"><table><thead><tr><th>页面区块</th><th>对应的量</th></tr></thead><tbody>';
  h += '<tr><td>🧾 采购明细</td><td><code>E</code> + 每人分摊比例与应摊额（<code>Aᵢ</code>）；长期耗材的购买 / 摊销明细另见表下方「🧾 长期耗材摊销」</td></tr>';
  h += '<tr><td>🖨️ 设备折旧</td><td><code>Dᵢ</code> / <code>Wᵢ</code> 的来源（团队共担 → 折旧；收损耗费 → 损耗费转账）</td></tr>';
  h += '<tr><td>💵 收入分配</td><td><code>Rᵢ</code>（「差额」= <code>Rᵢ − Iᵢ</code>）</td></tr>';
  h += '<tr><td>📊 经营损益</td><td><code>Bᵢ</code> = 应得收入 − 采购应摊 − 团队折旧 ± 损耗费</td></tr>';
  h += '<tr><td>💳 垫付清算</td><td><code>Eᵢ − Aᵢ</code>（垫付差额）</td></tr>';
  h += '<tr><td>🔄 资金重分配</td><td><code>Nᵢ</code>（再贪心配对成具体转账指令，仅建议）</td></tr>';
  h += '<tr><td>💸 实际转账</td><td><code>Tᵢ</code> 的来源（人工录入的真实转账）</td></tr>';
  h += '<tr><td>💰 实际盈亏</td><td><code>Cᵢ</code>（小字「应 …」= <code>Bᵢ</code>，末列「差额」= <code>gᵢ</code>）</td></tr>';
  h += '<tr><td>KPI「本月盈亏」</td><td><code>Π</code> = <code>Σ代收 − Σ有效采购 − Σ设备折旧</code></td></tr>';
  h += '</tbody></table></div>';

  h += '</div></details>';
  return h;
}
/* 只重绘两个派生区块（转出/入 状态条 + 实际盈亏表），不整体重绘 ——
   整体重绘会重建转账记录行的输入框，正在编辑的金额框会失焦。 */
function _refreshDashSummary() {
  if (currentTab !== 'dash') return;
  var m = monthFromRecords(currentKey);
  var r = calcMonthWithUsage(currentKey);
  var totalPL = 0;
  getMembers().forEach(function (mem) { totalPL += (r.bookPL[mem.id] || 0); });
  var g = $('#dashTransferGaps');
  if (g) g.innerHTML = transferGapChipsHTML(m, r, unlocked.transfer ? '' : ' disabled');
  var p = $('#dashRealPL');
  if (p) p.innerHTML = realPLSectionHTML(m, r, totalPL);
  /* 📐 结算公式：里面的「本月实算」跟着转账变（ΣC 与 g 依赖 T_i），必须一起刷新。
     但它是个 <details>，整体 innerHTML 重绘会把它收起来 —— 先记住展开态再按原样重绘。 */
  var f = $('#dashFormula');
  if (f) {
    var keepOpen = false;
    try { keepOpen = !!document.querySelector('#settleFormula[open]'); } catch (e) { keepOpen = false; }
    f.innerHTML = settleFormulaHTML(r, keepOpen);
  }
  var t = $('#dashTransferTotal');
  if (t) t.textContent = RMB(r.transferTotal);
}

function updateRate(val) {
  STORE.config.investRate = val / 100;
  save();
  renderCurrent();
}
function onRateSlide(val) {
  // 拖动过程中实时刷新右侧数值，不触发保存/重绘
  var b = $('#rateValLive');

  var s = $('#rateSvcLive');
  if (s) s.textContent = '服务按分占比 ' + (100 - val) + '%';
}
/* v7.4：采购分摊口径切换（均摊 ⇄ 按用量）。与其它结算参数一样要「设置」解锁。 */
function setPurchaseBasis(basis) {
  if (!unlocked.settings) {
    requestPassword('settings', '设置').then(function (ok) { if (ok) setPurchaseBasis(basis); });
    return;
  }
  STORE.config.purchaseBasis = (basis === 'usage') ? 'usage' : 'equal';
  save();
  // 切到按用量：该月的用量可能还没取过，顺手取一次再重绘（取不到就照旧显示"未取到"提示）
  if (STORE.config.purchaseBasis === 'usage' && usageStateOfMonth(currentKey) === 'idle') {
    ensureUsage(currentKey, function () { renderCurrent(); });
  }
  renderCurrent();
  toast(basis === 'usage' ? '✅ 采购改为按用量分摊（按各人实际出纸页数）' : '✅ 采购改为均摊', 'success');
}

  m.expenses.forEach(function (e, i) {
    var eid = safeId(e.id);
    if (!eid) return;   // 非法 ID 跳过该行（safeId 已 console.warn）

    h += '<tr>';

    h += '<td class="l"><input type="text" value="' + esc(e.item) + '" onchange="updExp(\'' + eid + '\',\'item\',this.value)" placeholder="项目名称" style="width:260px"' + disabled + '></td>';

    });

        h += '<td style="color:var(--muted)">—</td>';

/* ==================== 实际转账 CRUD ====================
   记录真实发生的成员间转账（决定现金口径的实际盈亏）。
   记录绑定「结算月份」month 而非日期：转账常在下个月才付，但那仍是本月的账，
   让付款时间决定归属会把结算搬到下个月。跨月补记 → 切到对应结算月份再录。
   改值后只刷新派生区块（_refreshDashSummary），不整表重绘 —— 整表重绘会让下拉框/输入框
   重建并失焦到下一行，无法连续修改多行。 */
function addTransfer() {
  if (!unlocked.transfer) { toast('🔒 请先解锁实际转账', 'error'); return; }
  var members = getMembers();
  if (members.length < 2) { toast('👥 至少需要 2 名成员才能记录转账', 'error'); return; }
  var m = monthFromRecords(currentKey);
  // 默认填第一条还没结清的建议转账，省去手填
  var from = members[0].id, to = members[1].id, amount = 0;
  /* v7.9：与收支清算同口径（含用量分摊 / 折旧 / 耗材摊销），否则默认金额会偏。
     用量还没就绪时**不预填金额**（此时耗材暂按整笔计入，预填会多算），只给默认收付方。 */
  var _st = amortStateOfMonth(currentKey);
  if (_st === 'ready' || _st === 'none') {
    var r = calcMonthWithUsage(currentKey);
    for (var i = 0; i < r.transfers.length; i++) {
      var t = r.transfers[i], done = 0;
      m.transfers.forEach(function (x) { if (x.from === t.from && x.to === t.to) done += parseCents(x.amount); });
      if (t.amount - done > 1) { from = t.from; to = t.to; amount = (t.amount - done) / 100; break; }
    }
  }
  STORE.records.transfers.push({ id: uid(), month: currentKey, from: from, to: to, amount: amount, note: '' });
  save(); renderDash();
}
function updTransfer(id, field, val) {
  if (!unlocked.transfer) { toast('🔒 请先解锁实际转账', 'error'); renderDash(); return; }
  var r = (STORE.records.transfers || []).find(function (x) { return x.id === id; });
  if (!r) return;
  if (field === 'amount') r.amount = Math.max(0, +val || 0);
  else if (field === 'from' || field === 'to') {
    if (val === r[field]) return;
    // 改成一端=另一端会产生自转账（无意义，且会让合计口径失真）→ 拒绝并还原
    if (val === (field === 'from' ? r.to : r.from)) { toast('❌ 付款人与收款人不能是同一人', 'error'); renderDash(); return; }
    r[field] = val;
  } else r[field] = val;
  save();
  // 只刷新派生区块（#dashTransferGaps / #dashRealPL / 合计单元格 都不含正在编辑的输入框，不会失焦）
  _refreshDashSummary();
}
function delTransfer(id) {
  if (!unlocked.transfer) { toast('🔒 请先解锁实际转账', 'error'); return; }
  STORE.records.transfers = (STORE.records.transfers || []).filter(function (x) { return x.id !== id; });
  save(); renderDash();
}
/* 一键套用建议转账指令：只补「还没转够」的部分，已转够的不重复添加。
   同一条建议路径若已有记录则累加到最上面那条（保持记录简洁）。 */
function fillSuggestedTransfers() {
  if (!unlocked.transfer) { toast('🔒 请先解锁实际转账', 'error'); return; }
  /* v7.9：用量未就绪时不能填 —— 此时耗材暂按整笔计入（旧口径），按它填的转账会多算；
     等取数完成（页面会自己重绘）再点。 */
  var _st = amortStateOfMonth(currentKey);
  if (_st === 'loading' || _st === 'failed') {
    toast(_st === 'failed' ? '⚠️ 长期耗材用量没取到，先点红条「重试」再填' : '⏳ 用量统计中，稍后再填建议转账', 'error');
    return;
  }
  var m = monthFromRecords(currentKey);
  var r = calcMonthWithUsage(currentKey);
  var added = 0;
  r.transfers.forEach(function (t) {
    var done = 0;
    m.transfers.forEach(function (x) { if (x.from === t.from && x.to === t.to) done += parseCents(x.amount); });
    var left = t.amount - done;
    if (left <= 1) return;
    STORE.records.transfers.push({ id: uid(), month: currentKey, from: t.from, to: t.to, amount: left / 100, note: '按建议填入' });
    added++;
  });
  if (!added) { toast('✅ 建议转账均已结清，无需填入'); return; }
  save(); renderDash();
  toast('⚡ 已填入 ' + added + ' 条建议转账，可按实际情况修改金额', 'success');
}
function updNote(val) {
  STORE.notes[currentKey] = val;
  save();

/* 本地模式：数据源切换为「本地订单库」(/api/local/orders)，返回与云端 revenue 同构结构，

var _localOrdersReady = false;
function fetchLocalScopeData(force) {
  var range = _scopeRange();

  if (force) { _scopeCache = {}; _scopeFailedKey = null; }
  var params = 'start_date=' + encodeURIComponent(range.start) + '&end_date=' + encodeURIComponent(range.end);
  var reqKey = _scopeRangeKey();
  _cloudLoading = true;
  _scopeDataKey = reqKey;        // 与云端模式同一套「口径失效」判据（外部订单的迟到合并也认它）
  _cloudDataFetchedAt = null;
  _renderScopeViews();
  _startExternalMerge(range, reqKey);   // v7.3：本地模式同样合并外部监视订单（两段式，失败静默）
  fetch('/api/local/orders?' + params, { headers: apiHeaders() })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      _cloudLoading = false;
      if (data && data.success && data.data) {
        _cloudData = _mergeExternalOrders(data.data, _takePendingExternal(reqKey));
        _scopeCache[reqKey] = _cloudData;
        _scopeFailedKey = null;
        _cloudDataFetchedAt = new Date().toTimeString().substring(0, 8);
      } else { _cloudData = null; _scopeFailedKey = reqKey; }
      _renderScopeViews();
    })
    .catch(function () { _cloudLoading = false; _cloudData = null; _scopeFailedKey = reqKey; _renderScopeViews(); });
}
function _scopeRangeKey() { var r = _scopeRange(); return r ? (r.start + '_' + r.end) : ''; }

/* 本地模式：进入 tab-cloud 时复用云端驾驶舱渲染，数据源为本地订单库；
   本地无「云端月份」接口，故直接置就绪并走 shared 渲染。 */
function _renderLocalCloud() {

}

function renderCloud() {
  // 本地模式：复用云端驾驶舱布局，数据源为本地订单库

function _renderCloudShared() {

  if (!keys.includes(cm)) keys.unshift(cm);   // 本月始终可选（即使当月尚无数据）
  if (!_scopeTime.month) _scopeTime.month = cm;
  if (_scopeTime.mode === 'month' && keys.length && !keys.includes(_scopeTime.month)) _scopeTime.month = keys[0];

  var h = _renderScopeBar(keys);   // v6.0：全局口径栏（时间/成员/来源 唯一筛选入口，普通文档流卡片）

  if (_cloudLoading) {
    _destroyCloudCharts();
    h += '<div class="section" style="text-align:center;padding:46px"><span class="loading-spin"></span> <span style="margin-left:6px;color:var(--muted)">正在' + (FINANCE_MODE === 'local' ? '读取本地订单' : '从云端获取数据') + '…</span></div>';
    el.innerHTML = _lz(h);
    return;
  }
  if (FINANCE_MODE !== 'local' && !_cloudMonthsReady) {
    h += '<div class="empty"><div class="ico">📡</div><h3>正在加载云端月份…</h3></div>';
    el.innerHTML = _lz(h);
    return;
  }
  if (!_cloudData) {
    var rk = _scopeRange(), rkKey = rk ? (rk.start + '_' + rk.end) : '';
    if (rk && _scopeFailedKey !== rkKey) { (FINANCE_MODE === 'local' ? fetchLocalScopeData : fetchScopeData)(); return; }
    _destroyCloudCharts();
    h += '<div class="empty"><div class="ico">📡</div><h3>查询失败或无数据</h3><p>统计各成员及本地任务的订单数、盈利与订单构成，用于核对手动代收收入。</p><button class="btn pri" style="margin-top:14px" onclick="' + (FINANCE_MODE === 'local' ? 'fetchLocalScopeData(true)' : 'fetchScopeData(true)') + '">🔍 重试查询</button></div>';
    el.innerHTML = _lz(h);

function confirmUnlockSettings(fn) {

function delMonth(key) {
  confirmUnlockSettings(function () {
    openConfirm('确定删除「' + labelOf(key) + '」的所有采购 / 代收 / 评分数据，以及该月归属的实际转账（🔴-F8）？此操作不可恢复。', '删除').then(function (ok) {
      if (!ok) return;

      /* 🔴-F8：实际转账按「结算月份」归属（记录只存 month，没有 date）。漏删它这个月就

         （成员觉得"删了还在"，对账也永远差这笔钱）。 */
      var droppedTransfers = 0;

function downloadJSON(data, filename) {
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}
function exportData() { downloadJSON(STORE, '打印项目_清算备份_' + todayStr() + '.json'); toast('✅ 已导出', 'success'); }
function importData(e) {
  var file = e.target.files[0];
  if (!file) return;
  confirmUnlockSettings(function () {
    var reader = new FileReader();
    reader.onload = function (ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (!data.records && !data.months) throw new Error('格式错误');
        STORE = migrateConfig(sanitizeStore(data));   // 导入即净化 name/id/color
        currentKey = currentMonthKey();
        save();
        renderAll();
        toast('✅ 已导入 ' + allMonthKeys().length + ' 个月', 'success');
      } catch (err) { toast('❌ 导入失败：' + err.message, 'error'); }
    };
    reader.readAsText(file);
  });
}
function resetData() {

/* 「首次设置密码」入口**按服务端状态显示**：只有真的还有模块没设密码时才出现。

/* ==================== 打印价格（收支统计设置 → 全局定价） ====================
   云端模式：读写服务器 pricing.json（/api/proxy/pricing，printer token 鉴权），
             小程序/APP 计费显示、后端订单计价、本地打印首页全部共用这一份价格。
   本地模式：存 STORE.config.pricing（print_data.json），仅影响本地打印工具。 */
var _pricingDpKeys = [], _pricingUpKeys = [];
var _cloudPricing = null;
/* 优先级档位业务顺序（低→中→高）；渲染加急价列表时强制按此排序，不依赖数据键顺序 */
var URGENCY_ORDER = ['低', '中', '高'];
function pricingRowsHTML(prefix, dict, unit, keyArr, editable) {
  var h = '', i = 0;
  keyArr.length = 0;
  var keys = Object.keys(dict || {});
  if (prefix === 'up') {
    // 优先级加急价：按 低→中→高 顺序展示；未知档位按字典序排最后
    keys = keys.slice().sort(function (a, b) {
      var ia = URGENCY_ORDER.indexOf(a), ib = URGENCY_ORDER.indexOf(b);
      if (ia >= 0 && ib >= 0) return ia - ib;
      if (ia >= 0) return -1;
      if (ib >= 0) return 1;
      return a < b ? -1 : (a > b ? 1 : 0);
    });
  }
  keys.forEach(function (k) {
    keyArr.push(k);
    h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">' +
         '<span style="min-width:110px;font-size:.85rem;color:var(--text)">' + esc(k) + '</span>' +
         '<input type="number" id="' + prefix + i + '" step="0.01" min="0" max="100" value="' + (+dict[k] || 0) + '" style="width:80px">' +
         '<span style="font-size:.78rem;color:var(--muted)">' + unit + '</span>' +
         (editable ? '<button class="btn danger sm" style="padding:2px 8px" onclick="removePricingRow(\'' + prefix + '\',' + i + ')">✕</button>' : '') +
         '</div>';
    i++;
  });
  if (editable) {
    h += '<div style="margin-top:6px"><button class="btn sm" onclick="addPricingRow(\'' + prefix + '\')">➕ 添加地点</button></div>';
  }
  return h || '<span style="color:var(--muted);font-size:.82rem">无</span>';
}
function addPricingRow(prefix) {
  var name = prompt('输入新地点名称：', '新地点');
  if (!name || !name.trim()) return;
  name = name.trim();
  if (_pricingDpKeys.indexOf(name) >= 0) { toast('该地点已存在', 'error'); return; }
  _pricingDpKeys.push(name);
  renderPricingList('dp');
  toast('已添加「' + name + '」，点击「保存价格」生效', 'success');
}
function removePricingRow(prefix, idx) {
  var keys = prefix === 'dp' ? _pricingDpKeys : _pricingUpKeys;
  if (idx < 0 || idx >= keys.length) return;
  var name = keys[idx];
  if (!confirm('确定删除地点「' + name + '」吗？')) return;
  keys.splice(idx, 1);
  renderPricingList(prefix);
  toast('已删除「' + name + '」，点击「保存价格」生效', 'success');
}
function renderPricingList(prefix) {
  var keys = prefix === 'dp' ? _pricingDpKeys : _pricingUpKeys;
  var vals = {};
  keys.forEach(function (k, i) {
    var el = document.getElementById(prefix + i);
    vals[k] = el ? (+el.value || 0) : 0;
  });
  var el = document.getElementById(prefix === 'dp' ? 'pricingDeliveryList' : 'pricingUrgencyList');
  if (el) el.innerHTML = pricingRowsHTML(prefix, vals, prefix === 'dp' ? '百分比' : '元', keys, prefix === 'dp');
}
function loadCloudPricingForm() {
  if (_cloudPricing) { fillPricingForm(_cloudPricing); return; }
  fetch('/api/proxy/pricing', { headers: apiHeaders() })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!(res && res.success)) return;

      fillPricingForm(_cloudPricing);

    .catch(function () {});
}
function fillPricingForm(p) {
  var el = document.getElementById('pricingSimplex');
  if (el) el.value = (p.simplex_price != null) ? p.simplex_price : '';
  el = document.getElementById('pricingDuplex');
  if (el) el.value = (p.duplex_price != null) ? p.duplex_price : '';
  el = document.getElementById('pricingCover');
  if (el) el.value = (p.cover_page_price != null) ? p.cover_page_price : '';

  if (dl) dl.innerHTML = pricingRowsHTML('dp', p.delivery_percentages || {}, '百分比', _pricingDpKeys, true);

function collectPricingForm() {
  var p = { simplex_price: 0, duplex_price: 0, cover_page_price: 0, delivery_percentages: {}, urgency_prices: {} };
  var e = document.getElementById('pricingSimplex'); if (e) p.simplex_price = +e.value || 0;
  e = document.getElementById('pricingDuplex'); if (e) p.duplex_price = +e.value || 0;
  e = document.getElementById('pricingCover'); if (e) p.cover_page_price = +e.value || 0;
  _pricingDpKeys.forEach(function (k, i) {
    e = document.getElementById('dp' + i);
    p.delivery_percentages[k] = e ? (+e.value || 0) : 0;
  });
  _pricingUpKeys.forEach(function (k, i) {

    p.urgency_prices[k] = e ? (+e.value || 0) : 0;

function savePricing() {
  var p = collectPricingForm();
  if (!(p.simplex_price > 0) || !(p.duplex_price > 0)) { toast('单面价 / 双面价必须大于 0', 'error'); return; }
  if (FINANCE_MODE === 'local') {
    STORE.config.pricing = p;
    save();
    renderSettings();
    toast('✅ 打印价格已保存（本地 print_data.json）', 'success');
    return;
  }
  fetch('/api/proxy/pricing', { method: 'POST', headers: apiHeaders(), body: JSON.stringify({ pricing: p }) })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res && res.success) {
        _cloudPricing = res.pricing || p;
        toast('✅ 打印价格已保存到云端，全端生效', 'success');
      } else if (!_writeAuthProblem(res)) {
        toast('❌ ' + ((res && res.message) || '保存失败'), 'error');
      }
    })
    .catch(function () { toast('❌ 网络错误', 'error'); });
}
function updatePassword(key) {
  var input = $('#pwd-' + key);
  if (!input) return;
  var v = input.value.trim();
  if (!v || v.length < FINANCE_PASSWORD_MIN_LEN) {
    toast('密码至少 ' + FINANCE_PASSWORD_MIN_LEN + ' 位', 'error');
    return;
  }
  // S1-05：改密走服务端（PBKDF2 + 每模块独立 salt），前端只负责传新密码、把服务端回执的哈希带回页面
  fetch('/api/local/finance_auth/password', {
    method: 'POST', headers: apiHeaders(),
    body: JSON.stringify({ module: key, new_password: v })
  }).then(function (r) { return r.json(); })
    .then(function (res) {
      if (!(res && res.success)) {
        if (_writeAuthProblem(res)) return;
        toast('❌ ' + ((res && res.message) || '密码保存失败'), 'error');
        return;
      }
      STORE.config.passwords = STORE.config.passwords || {};
      if (res.stored_hash) STORE.config.passwords[key] = res.stored_hash;
      save();
      input.value = '';
      toast('✅ ' + MODULE_NAMES[key] + ' 密码已更新（PBKDF2，服务端保存）', 'success');
    })
    .catch(function () { toast('❌ 网络错误，密码未改动', 'error'); });
}

function addMember() {

function removeMember(mid) {
  var members = getMembers();
  var idx = members.findIndex(function (m) { return m.id === mid; });
  if (idx === -1) return;
  var name = members[idx].name;
  // 删除前扫描该成员名下的垫付 / 代收记录，避免金额静默消失
  var paidN = 0, paidC = 0, incN = 0, incC = 0, consN = 0;
  (STORE.records.expenses || []).forEach(function (e) {
    if (e.payer !== mid) return;
    paidN++; paidC += parseCents(e.amount);
    /* v7.9：长期耗材的采购人是唯一收款方 —— 成员被删后这批就退出摊销（剩余未摊销部分
       既不会返还给他、也不会分摊给别人），必须在确认框里说清楚。 */
    if (isConsumableExpense(e) && expenseUnits(e) > 0) consN++;
  });
  (STORE.records.income || []).forEach(function (r) { if (r.memberId === mid) { incN++; incC += parseCents(r.amount); } });
  var msg = '确定移除成员「' + name + '」？';
  if (paidN || incN) {
    var parts = [];
    if (paidN) parts.push(paidN + ' 条垫付（合计 ' + RMB(paidC) + ' 元）');
    if (incN) parts.push(incN + ' 条代收（合计 ' + RMB(incC) + ' 元）');
    msg += '该成员名下有 ' + parts.join('、') + '，删除后这些金额将从结算中消失。';
  }
  if (consN) {
    msg += '其中 ' + consN + ' 笔长期耗材（A4纸 / 硒鼓）的采购人就是该成员：删除后这批耗材不再摊销，'
      + '剩余未摊销的采购款既不会返还给他、也不会分摊给其他成员（建议先结清或保留该成员）。';
  }
  msg += '已有记录不会丢失，但不再参与后续计算。';
  openConfirm(msg, '移除').then(function (ok) {
    if (!ok) return;
    members.splice(idx, 1);
    STORE.config.members = members;
    save();
    invalidateUsage();   // v7.9：成员名单变了 ⇒ 订单归属 / 按用量分摊 / 耗材摊销都要重算
    renderSettings();
    toast('已移除：' + name);
  });
}

/* ==================== TAB: 授权（2026-11） ====================
   多设备共连云服务器时的设备授权管理：
   1. 本设备所有者 —— 从成员列表选择，绑定到后端设备注册表（计算机名 → 成员姓名）；
   2. 云端设备列表 —— 所有连接过云服务器的设备：计算机名称 / 在线状态 / 所有者 / 是否接单 /
      自动双面能力（v6.6：三态人工标注，决定该设备能否无人值守打双面）。
   独立密码保护（密码 key = 'auth'，默认与其它模块一致，可在「设置」中修改）。 */
/* ==================== v7.4 / v7.6：打印机台账（「🖨️ 打印机折旧」页） ====================
   一台机一行：名称 / 价格 / 寿命页数 / 归属与计费 / 默认设备 / 状态。
   折旧不需要"手工录入本月成本"——它按「本口径这台机出纸页数 × 每页成本」实时算出来，
   所以这里只要把机器、价格与寿命登记对，结算页就能自动计提。

   v7.6（2026-10-25 用户要求）：
     ① 台账从「🔒 授权」搬到「🖨️ 打印机折旧」页 —— 授权管"谁能连上来"，台账管"我们有什么机器"；
     ② 单独一把锁（密码模块 orderprinter，设置页可改）：「订单 → 打印机」的人工指定也锁在里面，
        因为它直接决定折旧摊到谁头上（= 钱）；
     ③ 「所有者」+「计费方式」两个下拉合成**一个**「归属 / 计费」（用户选定方案 A）：
        底层 owner / billing 两个字段照旧（账务一分不改），只是界面上一次选完。 */
var _authDevices = null;      // 设备列表缓存（「默认设备」下拉用；避免每次重绘都打接口）

/* ---- 归属 / 计费 合成一个下拉（v7.6） ----
   旧写法两个下拉交叉起来很反直觉：1020 = 个人所有 + 团队共担、M232 = 共有 + 收损耗费，
   看上去像两列在说同一件事。但账上它们不冗余：
     · 团队共担（team）：机器的钱**没有**进过「采购」，磨损只能当团队成本（按页分摊、不产生转账）；

function updPrinter(id, field, val) {
  if (!unlocked.orderprinter) { toast('🔒 请先解锁「' + MODULE_NAMES.orderprinter + '」', 'error'); renderPrinters(); return; }
  var p = printerById(id);
  if (!p) return;
  if (field === 'price') p.price = Math.max(0, +val || 0);
  else if (field === 'life_pages') p.life_pages = Math.max(0, Math.round(+val || 0));
  else if (field === 'status') p.status = (val === 'retired') ? 'retired' : 'active';
  else if (field === 'client_id') p.client_id = safeId(val) || '';
  else if (field === 'owner') p.owner = (val === 'shared') ? 'shared' : (safeId(val) || 'shared');
  else if (field === 'billing') p.billing = (val === 'wear') ? 'wear' : 'team';
  else p[field] = String(val == null ? '' : val);
  normalizePrinter(p);
  if (field === 'name') p.model = p.name;
  save();
  invalidateUsage();   // 机器归属/寿命变了 ⇒ 折旧映射要重算（下次进结算页自动重新取数）
  /* ⚠ 这里**不整页重绘**（v7.5b 用户反馈「切任意选项整页闪一下」）：
     旧写法每次改一个下拉都重建整页，画面闪、下拉被拉回去。
     现在只更新这一行里会变的「每页成本」；归属与计费 / 默认设备 / 状态本身就是选中态。 */
  var pidSafe = safeId(id);
  var unitCell = pidSafe ? document.getElementById('printer-unit-' + pidSafe) : null;
  if (unitCell) unitCell.innerHTML = printerUnitCellHTML(p);
  var nameEl = pidSafe ? document.getElementById('printer-name-' + pidSafe) : null;
  if (nameEl && document.activeElement !== nameEl && nameEl.value !== (p.name || '')) nameEl.value = p.name || '';
}
function delPrinter(id) {
  if (!unlocked.orderprinter) { toast('🔒 请先解锁「' + MODULE_NAMES.orderprinter + '」', 'error'); return; }
  var p = printerById(id);
  if (!p) return;
  openConfirm('删除打印机「' + p.name + '」？\n\n折旧是按「页数 × 每页成本」实时算的，删掉这台机之后它本月的折旧就不再计提 —— 历史月份不会留痕。', '删除').then(function (ok) {
    if (!ok) return;
    STORE.config.printers = getPrinters().filter(function (x) { return x.id !== id; });
    save();
    invalidateUsage();
    renderPrinters();
    toast('已删除打印机', 'success');
  });
}

/* ==================== v7.7：累计实测寿命（不预估总寿命） ====================
   用户的真实处境：两台在役机 HP 官方只给「月打印负荷 / 建议月印量 / 硒鼓寿命」，
   **整机总寿命本来就是个未知数**（1020 甚至能跑十几年）。硬填一个估计值 = 拿猜测去分钱，
   所以新增「累计实测」口径：
     ① 不填寿命 —— 台账一直累计这台机的出纸页数（起算日到今天，含「起算前已用页数」）；
     ② 机器报废时点「💥 结算」：把累计页数写成**实测寿命**，并按各月页数把整机价折成每月金额，
        历史各月立刻回溯计提（Σ各月 == 追踪期应承担的寿命价值）；
     ③ 结算结果**冻结成快照**：之后改订单归属 / 改名 / 换绑 / 删设备，都不会把已经报给成员的账改掉
        （历史板的账不能因为一次误操作就变）。
   ⚠ 累计期间该机**不计提折旧**（寿命未知 ⇒ 每页成本未知）—— 这是设计，不是漏算：
     金额等到结算那天一次性回溯，永远不会出现「先按猜的值扣了、后来又改」的来回。 */

function _todayStr() {
  var n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
}
var _rangeOrdersCache = {};   // 'start|end' -> orders[]（报废结算与累计读数共用）
/* 取任意区间的订单（与按月用量同一个接口、同一份鉴权）：结算要跨好几个月，
   按月发 N 次请求太慢 —— 一次拉完，本地按月聚合。 */
function fetchOrdersRange(start, end, cb) {
  var key = start + '|' + end;
  if (_rangeOrdersCache[key]) { if (cb) cb(_rangeOrdersCache[key], null); return; }
  var url = FINANCE_MODE === 'local'
    ? '/api/local/orders?start_date=' + encodeURIComponent(start) + '&end_date=' + encodeURIComponent(end)
    : '/api/proxy/admin/statistics/revenue?start_date=' + encodeURIComponent(start) + '&end_date=' + encodeURIComponent(end);
  fetch(url, { headers: apiHeaders() })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data && data.success && data.data && Array.isArray(data.data.orders)) {
        _rangeOrdersCache[key] = data.data.orders;
        if (cb) cb(data.data.orders, null);
      } else if (cb) cb(null, '接口返回失败');
    })
    .catch(function () { if (cb) cb(null, '网络异常'); });
}
/* 「累计到今天多少页」—— 台账每格显示一次（缓存到 invalidateUsage 为止） */
var _cumCache = {};           // printerId -> { pages, tracked, months, since, at }
var _cumFetching = {};
function printerCumulative(p, cb) {
  if (!p) { if (cb) cb(null); return; }
  var pid = safeId(p.id);
  if (_cumCache[pid]) { if (cb) cb(_cumCache[pid]); return; }
  var since = p.started_at || '2000-01-01', at = _todayStr();
  fetchOrdersRange(since, at, function (orders) {
    if (!orders) { if (cb) cb(null); return; }
    var agg = _printerPagesFromOrders(orders, p);
    _cumCache[pid] = { pages: agg.pages + Math.max(0, Math.round(+p.pre_pages || 0)),
                       tracked: agg.pages, months: agg.months, since: since, at: at };
    if (cb) cb(_cumCache[pid]);
  });
}
/* 台账里「累计中」单元格的读数（fetch 回来后原地替换，不整页重绘） */
function _cumCellInner(p, rec) {
  if (!rec) return '<span style="color:var(--muted)">累计中 · 读数失败</span>';
  var pre = Math.max(0, rec.pages - rec.tracked);
  /* 只留「累计 N 页」—— 明细（多少页有单 / 起算前多少页 / 统计区间）放 title。
     这一格在台账里必须短：写全（含括号明细 + 三个按钮）会把「状态 / 删除」整列挤出屏幕。 */
  return '<span style="font-weight:700;white-space:nowrap" title="累计页数 = 起算日之后这台机的出纸页数 '
    + fmtInt(rec.tracked) + ' 页'
    + (pre > 0 ? ' + 起算前已用 ' + fmtInt(pre) + ' 页' : '')
    + '（' + rec.since + ' ~ ' + rec.at + '）">累计 ' + fmtInt(rec.pages) + ' 页</span>';
}
/* 进「🖨️ 打印机折旧」页时把累计读数取回来（只取在役、未结算的；失败只在格子里显示"读数失败"） */
function _kickCumulativeFetch() {
  getPrinters().forEach(function (p) {
    if (printerLifeState(p) !== 'accumulating') return;
    var pid = safeId(p.id);
    if (!pid || _cumFetching[pid]) return;
    _cumFetching[pid] = true;
    /* 延后一拍：台账的 innerHTML 由 renderPrinters 在本函数之后才写入 */
    setTimeout(function () {
      printerCumulative(p, function (rec) {
        _cumFetching[pid] = false;
        var el = document.getElementById('printer-cum-' + pid);
        if (el) el.innerHTML = _cumCellInner(p, rec);
      });
    }, 0);
  });
}
/* 通用「多输入框」模态（openModal 只支持一个输入框）：返回 { 字段id: 值 } 或 null。
   只用于台账的两个累计参数，不承担别的职责（别拿它改密码 / 改金额这类敏感写操作）。 */
function openInputsModal(opts) {
  return new Promise(function (resolve) {
    var root = $('#modalRoot');
    if (!root) { resolve(null); return; }
    var m = document.createElement('div');
    m.className = 'modal-backdrop';
    var h = '<div class="modal-card" role="dialog"><h3>' + (opts.title || '') + '</h3><div class="modal-body">';
    if (opts.intro) h += '<p style="margin:0 0 12px;color:var(--muted);font-size:.86rem">' + opts.intro + '</p>';
    (opts.fields || []).forEach(function (f) {
      h += '<label style="display:block;margin:0 0 10px"><div style="font-size:.82rem;margin-bottom:4px">' + esc(f.label) + '</div>'
        + '<input id="im-' + esc(f.id) + '" type="' + esc(f.type || 'text') + '" value="'
        + esc(String(f.value == null ? '' : f.value)) + '" style="width:100%">'
        + (f.hint ? '<div style="font-size:.74rem;color:var(--muted);margin-top:3px">' + f.hint + '</div>' : '')
        + '</label>';
    });
    h += '</div><div class="modal-actions"><button class="btn ghost" data-act="cancel">取消</button>'
      + '<button class="btn pri" data-act="ok">' + esc(opts.confirmText || '确定') + '</button></div></div>';
    m.innerHTML = h;
    root.appendChild(m);
    requestAnimationFrame(function () { m.classList.add('in'); });
    var first = m.querySelector('input');
    if (first) setTimeout(function () { first.focus(); }, 60);
    var done = false;
    function close(val) {
      if (done) return;
      done = true;
      m.classList.remove('in');
      setTimeout(function () { m.remove(); }, 190);
      resolve(val);
    }
    m.addEventListener('click', function (e) { if (e.target === m) close(null); });
    m.querySelector('[data-act=cancel]').addEventListener('click', function () { close(null); });
    m.querySelector('[data-act=ok]').addEventListener('click', function () {
      var out = {};
      (opts.fields || []).forEach(function (f) {
        var el2 = m.querySelector('#im-' + f.id);
        out[f.id] = el2 ? el2.value : '';
      });
      close(out);
    });
  });
}
/* 累计参数：起算日 + 起算前已用页数（后者最容易漏 —— 机器进系统之前打掉的量不补上，
   实测寿命就会偏小、每页成本偏高，等于让现在的人替过去的人出钱） */
function openPrinterAccumModal(id) {
  if (!unlocked.orderprinter) { toast('🔒 请先解锁「' + MODULE_NAMES.orderprinter + '」', 'error'); return; }
  var p = printerById(id);
  if (!p) return;
  openInputsModal({
    title: '⚙ 累计参数 · ' + (p.name || '打印机'),
    intro: '累计页数 = <b>起算前已用页数</b> + 起算日之后这台机的出纸页数。机器在进这套系统之前打掉的量，'
      + '请填在下面第二项 —— 不补的话实测寿命会偏小、每页成本偏高。',
    fields: [
      { id: 'started_at', label: '累计起算日', type: 'date', value: p.started_at || '',
        hint: '留空 = 从有记录以来（全部历史）。只统计这个日期之后的订单' },
      { id: 'pre_pages', label: '起算前已用页数', type: 'number', value: p.pre_pages || 0,
        hint: '起算日之前这台机已经打掉的页数（0 = 忽略；只影响实测寿命的分母，不会被摊给某个月）' }
    ],
    confirmText: '保存'
  }).then(function (v) {
    if (!v) return;
    p.pre_pages = Math.max(0, Math.round(+v.pre_pages || 0));
    p.started_at = _legalDateStr(v.started_at);
    normalizePrinter(p);
    save();
    invalidateUsage();     // 起算范围变了 ⇒ 累计读数与结算预览都要重算
    renderPrinters();
    toast('✅ 已更新累计参数', 'success');
  });
}
/* 寿命口径切换（⚠ 会把「预估 / 实测」互斥地清掉，两处都要提示清楚） */
function setPrinterLifeMode(id, mode) {
  if (!unlocked.orderprinter) { toast('🔒 请先解锁「' + MODULE_NAMES.orderprinter + '」', 'error'); return; }
  var p = printerById(id);
  if (!p) return;
  var want = (mode === 'accumulate') ? 'accumulate' : 'estimate';
  if (want === 'accumulate') {
    if (p.settled || p.measured) {
      toast('这台机已经按实测寿命结算过 —— 想重新累计请点「🧾」重算', 'error');
      return;
    }
    if (p.life_mode === 'accumulate') return;
    openConfirm('改用「累计实测」？\n\n'
      + (p.life_pages > 0 ? '现在填的预估寿命 ' + fmtInt(p.life_pages) + ' 页会被清零' : '现在没有预估寿命')
      + '，本月起不再按估算计提折旧（改回估算法需要重新填）。\n\n'
      + '机器报废时点「💥 结算」：把累计页数写成实测寿命，历史各月按当天页数回溯计提。', '改用累计实测')
      .then(function (ok) {
        if (!ok) return;
        p.life_mode = 'accumulate';
        p.life_pages = 0;
        p.measured = false;
        p.settled_at = '';
        normalizePrinter(p);
        save(); invalidateUsage(); renderPrinters();
        toast('✅ 已改为累计实测：先累计用量，报废时再结算', 'success');
      });
    return;
  }
  if (p.life_mode === 'estimate') return;
  var frozen = 0;
  if (p.settled && p.settled.months) {
    Object.keys(p.settled.months).forEach(function (k) { frozen += (+p.settled.months[k].cents || 0); });
  }
  openConfirm('改回「预估总寿命」？\n\n'
    + (p.settled
        ? '会解除已冻结的历史折旧（' + fmtInt(p.life_pages) + ' 页 / 合计 ' + RMB(frozen) + '，涉及 '
          + Object.keys(p.settled.months || {}).length + ' 个月），之后历史各月改按「价格 ÷ 寿命页数」现算'
          + '（订单归属一改，历史金额就会跟着变）。寿命页数保留 ' + fmtInt(p.life_pages) + ' 页，可再改。'
        : '之后按「价格 ÷ 寿命页数」计提折旧。')
    + '\n\n继续？', '改回估算').then(function (ok) {
    if (!ok) return;
    p.life_mode = 'estimate';
    p.settled = null;
    p.measured = false;
    p.settled_at = '';
    normalizePrinter(p);
    save(); invalidateUsage(); renderPrinters();
    toast('✅ 已改回预估总寿命口径', 'success');
  });
}
/* 报废结算（点「💥 结算」/ 已结算机的「🧾 重算」都走这里）：
     ① 一次拉全区间订单 → ② 按本机归属聚出「各月页数」→ ③ 预览（实测寿命 / 每页成本 / 逐月金额）
     → ④ 确认后写回台账（寿命=实测、标记报废、冻结快照）。
   不做任何"临时估算"：取数失败就一个字节都不改。 */
function openPrinterSettle(id) {
  if (!unlocked.orderprinter) { toast('🔒 请先解锁「' + MODULE_NAMES.orderprinter + '」', 'error'); return; }
  var p = printerById(id);
  if (!p) return;
  var priceCents = parseCents(p.price);
  if (!(priceCents > 0)) {
    toast('这台机还没填「价格」—— 折旧 = 价格 × 页数 ÷ 实测总页数，没有价格算不出每页成本', 'error');
    return;
  }
  var since = p.started_at || '2000-01-01', at = _todayStr();
  var oldCents = 0, oldMonths = 0;
  if (p.settled && p.settled.months) {
    oldMonths = Object.keys(p.settled.months).length;
    Object.keys(p.settled.months).forEach(function (k) { oldCents += (+p.settled.months[k].cents || 0); });
  }
  toast('正在统计 ' + since + ' ~ ' + at + ' 的出纸页数…');
  fetchOrdersRange(since, at, function (orders, err) {
    if (!orders) { toast('取数失败（' + (err || '未知') + '），未做任何修改', 'error'); return; }
    var agg = _printerPagesFromOrders(orders, p);
    if (!(agg.pages > 0)) {
      toast('这台机在 ' + since + ' ~ ' + at + ' 内没有认领到任何已完成的出纸页数 —— 请先在「订单 → 打印机」里把它打过的单指定过来，或填「⚙ 累计参数 → 起算前已用页数」', 'error');
      return;
    }
    var pre = Math.max(0, Math.round(+p.pre_pages || 0));
    var total = agg.pages + pre;
    var snap = _buildSettledSnapshot(priceCents, total, agg.pages, agg.months);
    var keys = Object.keys(snap.months).sort();
    var rows = keys.map(function (k) {
      var mm = snap.months[k];
      return '<tr><td style="white-space:nowrap">' + esc(k) + '</td><td>' + fmtInt(mm.pages) + ' 页</td>'
        + '<td class="neg" style="white-space:nowrap">' + RMBneg(mm.cents) + '</td></tr>';
    }).join('');
    var body = '<p style="margin:0 0 10px;color:var(--muted);font-size:.86rem">'
      + '统计区间 <b>' + esc(since) + ' ~ ' + esc(at) + '</b>，只算已完成的子任务'
      + (pre > 0 ? '（另加「起算前已用」<b>' + fmtInt(pre) + '</b> 页）' : '') + '。<br>'
      + '实测寿命 = <b>' + fmtInt(total) + ' 页</b>；整机价 ¥' + formatCents(priceCents)
      + ' ⇒ 每页 <b>¥' + ((priceCents / total) / 100).toFixed(4) + '</b>。<br>'
      + '确认后：台账寿命写成 ' + fmtInt(total) + ' 页（标「实测」）、这台机标记<b>报废 / 退役</b>，'
      + '下面这些月份的折旧立刻回溯进各自月份（合计 ¥' + formatCents(snap.poolCents) + '）'
      + (pre > 0 ? '；起算前那 ' + fmtInt(pre) + ' 页对应的 ¥' + formatCents(priceCents - snap.poolCents)
          + ' 属于账开始之前的磨损，不摊进这些月份' : '')
      + '。</p>'
      + (p.settled ? '<p style="margin:0 0 10px;font-size:.84rem;color:var(--orange)">⚠ 这台机已结算过（'
          + fmtInt(p.life_pages) + ' 页 / ' + oldMonths + ' 个月 / 合计 ' + RMB(oldCents)
          + '）。下面是<b>重算</b>结果，确认后覆盖旧的快照。</p>' : '')
      + '<div class="table-wrap" style="max-height:260px;overflow:auto"><table><thead><tr><th>月份</th><th>出纸页数</th><th>该月折旧</th></tr></thead><tbody>'
      + (rows || '<tr><td colspan="3" style="color:var(--muted)">没有可分摊的月份</td></tr>')
      + '<tr class="tfoot"><td>合计</td><td>' + fmtInt(agg.pages) + ' 页</td>'
      + '<td class="neg" style="white-space:nowrap">' + RMBneg(snap.poolCents) + '</td></tr>'
      + '</tbody></table></div>';
    openModal({ title: (p.settled ? '🧾 重算报废结算 · ' : '💥 报废结算 · ') + (p.name || '打印机'),
                body: body, confirmText: p.settled ? '重算并覆盖' : '写回台账', cancelText: '取消' })
      .then(function (ok) {
        if (!ok) return;
        p.life_mode = 'accumulate';
        p.life_pages = total;
        p.measured = true;
        p.settled_at = at;
        p.settled = { at: at, pages: total, trackedPages: agg.pages, prePages: pre,
                      cents: snap.poolCents, months: snap.months };
        p.status = 'retired';
        normalizePrinter(p);
        save();
        invalidateUsage();
        if (currentTab === 'printers') renderPrinters(); else renderCurrent();
        toast('✅ 已按实测 ' + fmtInt(total) + ' 页结算；' + keys.length + ' 个月的折旧已回溯', 'success');
      });
  });
}

function loadAuthData(members) {
  // ── 本设备信息 + 所有者绑定（所有者以后端设备注册表为准）──
  Promise.all([
    fetch('/api/local/device', { headers: apiHeaders() }).then(function (r) { return r.json(); }),
    fetch('/api/proxy/printer/devices', { headers: apiHeaders() }).then(function (r) { return r.json(); }).catch(function () { return null; })
  ]).then(function (results) {
    /* 设备列表先缓存给「打印机 → 绑定设备」下拉用（首次到达时补一次重绘 —— 之前下拉里
       只有"未绑定"）。即便后面本设备信息取不到，绑定下拉也已经可用。 */
    var _dl = results[1] && (results[1].devices || (results[1].data && results[1].data.devices));
    if (Array.isArray(_dl) && !_authDevices) {
      _authDevices = _dl;
      /* 「默认设备」下拉在「🔒 授权」与「🖨️ 打印机折旧」两页都要用 ⇒ 哪一页在前台就补画哪一页 */
      setTimeout(function () {
        if (currentTab === 'auth') renderAuth();
        else if (currentTab === 'printers') renderPrinters();
      }, 0);
    }
    var box = $('#auth-local-device');
    if (!box) return;
    var dev = results[0] && results[0].device;
    if (!dev || !dev.client_id) { box.innerHTML = '<span style="color:var(--muted)">无法获取本机设备信息</span>'; return; }
    // 从后端设备列表反查本机所有者与自动双面能力（若列表拉取失败则显示未绑定/未确认）
    // 兼容两种响应形态：顶层 devices（/api/printer/devices）或 data.devices 包装
    var currentOwner = '';
    var myCap = null;
    var devList = results[1] && (results[1].devices || (results[1].data && results[1].data.devices));
    if (Array.isArray(devList)) {
      devList.forEach(function (d) {
        if (d.client_id === dev.client_id) { currentOwner = d.owner_name || ''; myCap = d; }
      });
    }
    var h = '<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:10px">';
    h += '<div><span style="color:var(--muted);font-size:.8rem">计算机名称</span><div style="font-weight:700">' + esc(dev.device_name || dev.client_id) + '</div></div>';
    h += '<div><span style="color:var(--muted);font-size:.8rem">设备 ID</span><div style="font-family:monospace;font-size:.78rem">' + esc(dev.client_id) + '</div></div>';
    h += '<div><span style="color:var(--muted);font-size:.8rem">接单状态</span><div>' + (dev.take_orders ? '<span class="tag g">接单中</span>' : '<span class="tag">未接单</span>') + '</div></div>';
    h += '<div><span style="color:var(--muted);font-size:.8rem">自动双面</span><div>' + capTextHtml(myCap) +
         (myCap && myCap.printer_name ? '<span style="color:var(--muted);font-size:.72rem;margin-left:6px">' + esc(myCap.printer_name) + '</span>' : '') +
         '</div></div>';
    h += '</div>';
    if (myCap && myCap.auto_duplex === false) {
      h += '<div class="hint" style="margin-bottom:10px">⚠ 本机已标注为<b>不支持自动双面</b>：双面订单需人工翻纸；无障碍（无人值守）打印遇双面会在打完第一趟后挂起等人翻纸（不再拦截下单）—— 可在下方「云端设备列表」里改回。</div>';
    }
    h += '<div class="settings-row"><label>本设备所有者</label>';
    if (!members.length) {
      h += '<select id="authOwnerSel" disabled><option value="">（暂无成员，请先在「设置」添加）</option></select>';
    } else {
      h += '<select id="authOwnerSel">';
      h += '<option value="">（未绑定）</option>';
      members.forEach(function (m) { h += '<option value="' + esc(m.name) + '"' + (m.name === currentOwner ? ' selected' : '') + '>' + esc(m.name) + '</option>'; });
      h += '</select>';
    }
    h += '<button class="btn green sm" onclick="saveAuthOwner()">💾 保存</button>';
    h += '<span style="color:var(--muted);font-size:.78rem">' + (currentOwner ? '当前所有者：' + esc(currentOwner) : '未绑定所有者') + '</span>';
    h += '</div>';
    box.innerHTML = h;
  }).catch(function () { var b = $('#auth-local-device'); if (b) b.innerHTML = '<span style="color:var(--muted)">本机信息获取失败</span>'; });

  // ── 云端设备列表（经 stats_server 代理，携带打印机 token）──
  fetch('/api/proxy/printer/devices', { headers: apiHeaders() })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      var box = $('#auth-devices');
      if (!box) return;
      if (!res || !res.success) {
        box.innerHTML = '<span style="color:var(--muted)">' + esc((res && res.message) || '设备列表获取失败（云端未连接？）') + '</span>';
        return;
      }
      var list = res.devices || (res.data && res.data.devices) || [];
      if (!list.length) {
        box.innerHTML = '<span style="color:var(--muted)">暂无设备记录（本地打印工具连接云端后自动登记）</span>';
        return;
      }
      // 缓存当前这一份（每次重渲染整体替换，避免旧设备残留）：保存人工结论时要取设备所有者当标注人
      _devicesById = {};
      list.forEach(function (d) { if (d && d.client_id) _devicesById[d.client_id] = d; });
      var h = '<div class="table-wrap"><table><thead><tr><th class="l">计算机名称</th><th>在线状态</th><th>所有者</th><th>接单</th><th>自动双面</th><th>操作</th></tr></thead><tbody>';
      list.forEach(function (d) {
        h += '<tr><td class="l">' + esc(d.device_name) +
             '<div style="font-family:monospace;font-size:.72rem;color:var(--muted)">' + esc(d.client_id) + '</div></td>';
        h += '<td>' + (d.online ? '<span class="tag g">🟢 在线</span>' : '<span class="tag">⚫ 离线</span>') + '</td>';
        h += '<td>' + (d.owner_name ? esc(d.owner_name) : '<span style="color:var(--muted)">未绑定</span>') + '</td>';
        h += '<td>' + (d.is_active
              ? (d.online ? '<span class="tag g">接单中</span>'
                          : '<span class="tag" title="该设备已离线，但接单记录还留着（僵尸记录）。'
                            + '点右侧「🗑 删除」可一并清空，否则它会一直显示为接单中。">接单中（离线）</span>')
              : '<span style="color:var(--muted)">—</span>') + '</td>';
        h += '<td>' + capCellHtml(d) + '</td>';
        // P1（审计 2026-12）：client_id 由客户端自报，禁止拼进内联 onclick。
        // esc() 是 HTML 实体转义，拼进内联 JS 字符串时 &#39; 会被 HTML 解码回 ' ——
        // 恰好闭合字符串，等于把注入点交给 devices.json 的写入方。
        // 改用 safeId() 白名单 + data-client-id + 事件委托（本页订单行同款范式）。
        var cidSafe = safeId(d.client_id);
        h += '<td><button class="btn danger sm" data-device-delete="' + esc(cidSafe) + '"' +
             (cidSafe ? '' : ' disabled title="设备 ID 含非法字符，已禁用删除"') +
             '>🗑 删除</button></td></tr>';
      });
      h += '</tbody></table></div>';
      // 被隐藏的测试设备（联调/冒烟脚本注册的 debug-* 等）：默认不占表格，只给一行提示 + 一键清理。
      // 后端每 30 分钟也会自己清掉其中"离线"的那部分，这里只是让人能立刻处理。
      // 另有"无主 + 离线"的陌生设备（云主机上的临时客户端等）：单独一个按钮，须人工判断。
      var hidden = res.hidden_test_devices || 0;
      var gray = list.filter(function (d) { return !d.online && !d.owner_name; }).length;
      h += '<div style="margin-top:10px"><button class="btn sm" onclick="loadAuthData(getMembers())">🔄 刷新</button>';
      if (hidden > 0) {
        h += '<button class="btn sm" style="margin-left:8px" onclick="cleanupTestDevices()">🧹 清理测试设备（' + hidden + '）</button>';
      }
      if (gray > 0) {
        h += '<button class="btn sm" style="margin-left:8px" onclick="cleanupUnboundDevices()">🧹 清理无主离线设备（' + gray + '）</button>';
      }
      h += '<span style="color:var(--muted);font-size:.78rem;margin-left:10px">每 15 秒自动刷新' +
           (hidden > 0 ? ' · 测试设备已隐藏，后端每 30 分钟自动清理离线的那部分' : '') +
           (gray > 0 ? ' · 无主且离线的设备若不是自己的机器，可一键清理（在线/已绑定/盖过章的都会跳过）' : '') +
           '</span>';
      h += '</div>';
      h += '<div class="hint" style="margin-top:10px">「自动双面」= 该设备能否<b>无人值守</b>打印双面：选「不支持（需人工翻纸）」后，双面订单在这台机器上要人工翻纸；无障碍打印（无人值守）遇双面会打完第一趟就挂起等人翻纸 —— <b>不再拦截下单</b>，此标注只用于提示。人工结论优先于本地打印工具的自动探测，且不会被探测覆盖（旧机型如 HP LaserJet 1018/1020/1022 的驱动会把「手动双面」也报成双面能力，必须人工确认）。</div>';
      box.innerHTML = h;
    })
    .catch(function () { var b = $('#auth-devices'); if (b) b.innerHTML = '<span style="color:var(--muted)">设备列表获取失败</span>'; });
}

function saveAuthOwner() {
  var sel = $('#authOwnerSel');
  if (!sel) { toast('请先在「设置」中添加成员', 'error'); return; }
  var owner = sel.value.trim();
  fetch('/api/local/device', { headers: apiHeaders() })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      var dev = res && res.device;
      if (!dev || !dev.client_id) { toast('无法获取本机设备 ID', 'error'); return null; }
      return fetch('/api/proxy/printer/bind_owner', {
        method: 'POST', headers: apiHeaders(),
        body: JSON.stringify({ client_id: dev.client_id, owner_name: owner })
      }).then(function (r) { return r.json(); });
    })
    .then(function (res) {
      if (!res) return;
      if (res && res.success) { toast('✅ 本设备所有者已保存', 'success'); loadAuthData(getMembers()); }
      else toast('❌ ' + ((res && res.message) || '保存失败'), 'error');
    })
    .catch(function () { toast('❌ 网络错误', 'error'); });
}
/* 授权页设备删除按钮：事件委托（按钮由 innerHTML 反复重建，绑在 document 上最稳）。
   委托读取的是 safeId() 白名单过滤后的 data-client-id，不再有内联事件注入面。 */
document.addEventListener('click', function (e) {
  var t = e.target;
  var btn = (t && t.closest) ? t.closest('[data-device-delete]') : null;
  if (!btn) return;
  e.preventDefault();
  var cid = safeId(btn.getAttribute('data-device-delete'));
  if (!cid) { toast('❌ 设备 ID 非法，已拒绝操作', 'error'); return; }
  deleteDevice(cid);
});

/* 删除设备注册表中的一台设备（清理软件升级产生的同机旧 ID 等历史遗留）。
   经 stats_server 代理调用后端 /api/printer/devices/delete（携带打印机 token）。 */
function deleteDevice(clientId) {
  if (!clientId) return;
  openConfirm('确定删除该设备吗？删除后离线设备不会自动恢复（在线设备下次连接会重新登记）；若该设备是当前「接单」设备，接单状态将一并清空。', '删除').then(function (ok) {
    if (!ok) return;
    fetch('/api/proxy/printer/devices/delete', {
      method: 'POST', headers: apiHeaders(),
      body: JSON.stringify({ client_id: clientId })
    }).then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.success) { toast('✅ 设备已删除', 'success'); loadAuthData(getMembers()); }
        else toast('❌ ' + ((res && res.message) || '删除失败'), 'error');
      })
      .catch(function () { toast('❌ 网络错误', 'error'); });
  });
}

/* 批量清理设备：先 dry-run 拿清单 → 弹窗确认 → 再显式传 dry_run:false 真删（两段式）。
   extraBody 决定范围：
     {}                                    → 测试/联调设备（debug-* 等，安全）
     {include_offline_unbound:true, min_offline_days:0} → 无主且离线的陌生设备（含刚连过的）
   后端默认 dry_run=true（防误点），且一律跳过在线设备、跳过人工盖过章的设备。 */
function runDeviceCleanup(extraBody, label) {
  fetch('/api/proxy/printer/devices/cleanup', {
    method: 'POST', headers: apiHeaders(),
    body: JSON.stringify(Object.assign({ dry_run: true }, extraBody || {}))
  }).then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res || !res.success) { toast('❌ ' + ((res && res.message) || '查询失败'), 'error'); return null; }
      var ids = res.client_ids || [];
      if (!ids.length) { toast('✅ 没有需要清理的' + label, 'success'); return null; }
      var preview = ids.slice(0, 10).map(function (x) { return esc(x); }).join('<br>');
      var more = ids.length > 10 ? '<br>…（共 ' + ids.length + ' 台）' : '';
      var skipped = (res.skipped_online || []).length;
      return openConfirm(
        '将清理 <b>' + ids.length + '</b> 台' + label +
        (skipped ? '（另有 ' + skipped + ' 台在线已跳过）' : '') +
        '：<br><span style="font-family:monospace;font-size:.75rem">' + preview + more + '</span>',
        '清理'
      ).then(function (ok) {
        if (!ok) return null;
        return fetch('/api/proxy/printer/devices/cleanup', {
          method: 'POST', headers: apiHeaders(),
          body: JSON.stringify(Object.assign({ dry_run: false }, extraBody || {}))
        }).then(function (r2) { return r2.json(); });
      });
    })
    .then(function (res2) {
      if (!res2) return;
      if (res2.success) { toast('✅ ' + (res2.message || '已清理'), 'success'); loadAuthData(getMembers()); }
      else toast('❌ ' + (res2.message || '清理失败'), 'error');
    })
    .catch(function () { toast('❌ 网络错误', 'error'); });
}

/* 测试设备（联调/冒烟脚本注册的 debug-* / socketio-debug-* 等）。 */
function cleanupTestDevices() { return runDeviceCleanup({}, '测试设备'); }

/* 无主且离线的陌生设备（含今天才连过一次的）—— 例如云主机上的临时客户端。
   后端会跳过：在线设备、已绑定所有者的设备、人工盖过「自动双面」章的设备。 */
function cleanupUnboundDevices() {
  return runDeviceCleanup({ include_offline_unbound: true, min_offline_days: 0 },
                          '无主离线设备');
}

/* ── 设备「自动双面」能力（v6.6）────────────────────────────────────────────
   三态：true=支持自动双面 / false=不支持（需人工翻纸） / null=未确认。
   后端解析优先级「人工盖章 > 本地工具自动探测 > 未确认」，且人工结论不会被探测覆盖
   （旧机型驱动的 DC_DUPLEX 会把「手动双面」也算成双面能力，必须人能盖章）。
   点选下拉 → 写后端 /api/printer/capability（source=manual）→ 立即广播给本地工具。 */

/* 能力文案（本设备信息区用；传设备对象，缺失按未确认）。 */
function capTextHtml(d) {
  var v = d ? d.auto_duplex : null;
  if (v === true) return '<span class="tag g">✅ 支持自动双面</span>';
  if (v === false) return '<span class="tag r">🖐 不支持（需人工翻纸）</span>';
  return '<span class="tag">未确认</span>';
}

/* 能力单元格（云端设备列表用）：三态下拉 + 来源标记 + 「探测与人工不一致」提示。 */
function capCellHtml(d) {
  var v = (typeof d.auto_duplex === 'boolean') ? d.auto_duplex : null;
  var src = d.capability_source || 'unknown';
  var cidSafe = safeId(d.client_id);
  var title = d.printer_name ? ('当前打印队列：' + d.printer_name) : '该设备尚未上报打印队列名';
  var h = '<select data-device-cap="' + esc(cidSafe) + '"' + (cidSafe ? '' : ' disabled') +
          ' title="' + esc(title) + '" style="max-width:220px">' +
          '<option value=""' + (v === null ? ' selected' : '') + '>未确认</option>' +
          '<option value="1"' + (v === true ? ' selected' : '') + '>✅ 支持自动双面</option>' +
          '<option value="0"' + (v === false ? ' selected' : '') + '>🖐 不支持（需人工翻纸）</option>' +
          '</select>';
  // 来源标签：说的是"这条结论谁定的"，不是结论本身 —— 文案带「标注」二字，避免被读成
  // "这台机器要人工翻纸"（曾把「✅ 支持自动双面」旁边的「人工」误读成这样）。
  if (src === 'manual') {
    var who = d.capability_verified_by ? ('人工标注：' + d.capability_verified_by) : '人工标注（未记录标注人）';
    if (d.capability_verified_at) who += ' · ' + d.capability_verified_at;
    h += ' <span class="tag b" title="' + esc(who + '（优先于自动探测，且不会被探测覆盖）') + '">👤 人工标注</span>';
  } else if (src === 'probe') {
    h += ' <span class="tag" title="由本地打印工具自动探测上报">🔍 探测</span>';
  }
  // 人工与探测结论不一致时露出来，便于事后核对（尤其是"驱动虚报支持"的老机型）
  if (src === 'manual' && typeof d.capability_probe === 'boolean' && d.capability_probe !== v) {
    h += '<div style="font-size:.7rem;color:var(--muted)">探测结果：' + (d.capability_probe ? '支持' : '不支持') + '（已被人工结论覆盖）</div>';
  }
  return h;
}

/* 保存人工结论。autoDuplex: true / false / null（null = 清除人工结论、回到自动探测）。
   一起上报 by（标注人）：本页没有登录身份，用**该设备绑定的所有者**作为确认者 ——
   设备的打印机能力最终是机主确认的；未绑定所有者时留空，前端会显示"未记录标注人"。 */
function saveDeviceCapability(clientId, autoDuplex) {
  if (!clientId) { toast('❌ 设备 ID 非法，已拒绝操作', 'error'); return; }
  var dev = _devicesById[clientId] || {};
  var by = dev.owner_name || '';
  fetch('/api/proxy/printer/capability', {
    method: 'POST', headers: apiHeaders(),
    body: JSON.stringify({ client_id: clientId, source: 'manual', auto_duplex: autoDuplex, by: by })
  }).then(function (r) { return r.json(); })
    .then(function (res) {
      if (res && res.success) {
        var msg = autoDuplex === false ? '✅ 已标注「不支持自动双面」：双面订单需人工翻纸（仅提示，不拦截无障碍/双面下单）'
                : (autoDuplex === true ? '✅ 已标注「支持自动双面」' : '✅ 已清除人工结论（回到自动探测结果）');
        if (by) msg += '（' + by + '）';
        toast(msg, 'success');
        loadAuthData(getMembers());
      } else {
        toast('❌ ' + ((res && res.message) || '保存失败'), 'error');
        loadAuthData(getMembers());   // 失败也回读一次，避免下拉停在未保存的状态
      }
    })
    .catch(function () { toast('❌ 网络错误', 'error'); loadAuthData(getMembers()); });
}
/* 设备列表缓存（当前渲染的这一份）：保存人工结论时取「设备所有者」当标注人 */
var _devicesById = {};
/* 授权页「自动双面」下拉：事件委托（下拉由 innerHTML 反复重建，绑在 document 上最稳）。
   本页还有别的 select（成员/模块/月份等）也冒泡 change，必须用 data-device-cap 过滤。 */
document.addEventListener('change', function (e) {
  var t = e.target;
  if (!t || !t.getAttribute || t.getAttribute('data-device-cap') === null) return;
  var cid = safeId(t.getAttribute('data-device-cap'));
  if (!cid) { toast('❌ 设备 ID 非法，已拒绝操作', 'error'); return; }
  saveDeviceCapability(cid, t.value === '' ? null : (t.value === '1'));
});
/* 授权页设备列表自动刷新（仅当前处于授权页且已解锁时执行，避免后台空转） */
setInterval(function () {
  if (currentTab === 'auth' && unlocked.auth && FINANCE_MODE !== 'local') loadAuthData(getMembers());
}, 15000);

/* ==================== TAB: 关于 ==================== */
function renderAbout() {
  var el = $('#tab-about');
  el.innerHTML = _lz(
    '<div class="section" style="text-align:center;padding:46px 20px">' +
    '<div style="font-size:3rem;margin-bottom:12px">🖨️</div>' +
    '<h2 style="font-size:1.35rem;margin-bottom:6px;justify-content:center;text-align:center">打印项目 · 收支清算</h2>' +
    '<div style="font-size:1rem;color:var(--primary);font-weight:700;margin-bottom:18px">v7.9</div>' +
    '<div style="width:100%;text-align:left;line-height:1.9;font-size:.9rem;color:var(--muted)">' +
    '<p>多人均摊采购 · 按服务贡献分配收入 · 智能转账清算 · 云端订单对账。</p>' +
    '<p style="margin-top:10px">v3.0 重构：日期流水自动归月、分模块密码保护、云端成员维度统计、现代化布局与动画。</p>' +
    '<p style="margin-top:10px">v4.0：云端展示重构 —— 统一「已入账」金额口径，订单明细补自打/接单、自动打印、预约、免费标记与文件级状态，附加服务新增自动打印/预约维度，对账提示未绑定成员的用户收益。</p>' +
    '<p style="margin-top:10px">v5.0：云端运营驾驶舱 —— 对账/异常提示条置顶，Hero KPI 4 卡（迷你趋势线/环比徽标/完成率仪表盘），订单漏斗，收益/运营视角图表分组，异常监控卡与订单状态快捷筛选，成员排行榜进度条，每日趋势渐变面积图 + 峰值标注 + 指标切换，订单表状态色条与入账进度条，状态体系补全预约/待打印/下载中；宽屏内容限宽居中。</p>' +
    '<p style="margin-top:10px">v5.1：收益口径 —— 自打订单（管理员自行打印）不计入已入账/应收未收/收益构成/趋势/排行榜等一切收益统计，订单数、页数等运营量与明细金额仍正常展示。</p>' +
    '<p style="margin-top:10px">v5.2：趋势区间 —— 趋势分析支持近7天/近30天/自定义起止日期；宽范围（&gt;45 天）自动按月聚合、超 2 年自动按年聚合，避免横向渲染海量日点；区间数据独立缓存，随成员/来源过滤联动。</p>' +
    '<p style="margin-top:10px">v5.3：0 值占位 —— 趋势图按区间补全时间轴，收益/订单为 0 的日期（月/年）保留位置并显示 0，不再跳空省略。</p>' +
    '<p style="margin-top:10px">v5.4：指标配色 —— 趋势分析四指标专属颜色（收益绿/订单蓝/页数紫/文件青），峰值同色放大/实色突出，指标切换按钮高亮跟随指标色。</p>' +
    '<p style="margin-top:10px">v5.5：单指标展示 —— 趋势图切换指标时仅显示当前指标对应数据，移除叠加的订单数辅助序列与双轴。</p>' +
    '<p style="margin-top:10px">v5.6：移除「本月」维度 —— 趋势分析始终基于独立时间区间，默认近30天，首次进入自动加载。</p>' +
    '<p style="margin-top:10px">v5.7：曲线细节 —— 日粒度曲线平时不显示数据点（仅峰值标注点常显），鼠标悬停到某天时显示该天的选中点；曲线与 x 轴围成的面积改为纯色填充。</p>' +
    '<p style="margin-top:10px">v5.8：主题联动 —— 切换浅色/深色主题时，图表中的图例文字（可点击隐藏维度）、坐标轴刻度与轴标题颜色同步刷新，不再残留旧主题配色。</p>' +
    '<p style="margin-top:10px">v5.9：趋势切片 —— 新增近60天区间；≤60 天用柱状图（每天一柱），&gt;60 天用平滑折线图；宽范围不再按月/年划分，改为时间轴均匀切片、固定最多 60 片，保留数据变化趋势。</p>' +
    '<p style="margin-top:10px">v5.10：图表交互 —— 不再高亮/加亮最大值（柱状图所有柱同色、折线不突出峰值点，仅保留峰值文字标注）；图例仅作标识，点击不再切换数据集显隐。</p>' +
    '<p style="margin-top:10px">v5.11：柱体样式 —— 趋势柱状图柱体改为不透明实色；鼠标悬停时深色模式柱体加亮、浅色模式柱体变暗，且随主题切换自动生效。</p>' +
    '<p style="margin-top:10px">v5.12：折线填充 —— 平滑折线图与 x 轴围成的面积改为不透明实色填充（与柱体一致）。</p>' +
    '<p style="margin-top:10px">v5.13：趋势区间扩充 —— 新增近90天、近1年快捷区间（&gt;60 天自动进入 60 片切片平滑折线展示）。</p>' +
    '<p style="margin-top:10px">v5.14：自定义日期范围限制 —— 日期选择器禁止选择未来日期，最早可选日期限定为最早有数据的月份；提交时二次校验兜底。</p>' +
    '<p style="margin-top:10px">v5.15：自绘日历组件 —— 自定义日期改用自研弹出日历（周一开头、选中/今天/区间高亮、范围外日期禁用、取消自动回滚），浅色/深色主题随 CSS 变量自动适配，选完起止日期自动应用。</p>' +
    '<p style="margin-top:10px">v5.16：趋势切片 60→90 —— 宽区间（&gt;60 天）平滑折线图的切片数由 60 增至 90，细节更丰富；≤60 天仍为逐日柱状图；日历月份导航禁止切入全部日期不可用的月份；移除 Hero 卡片右下角迷你趋势线；趋势指标切换改为局部重绘（不再整页重建导致全部图表闪烁）；订单明细移除「入账进度/已入账」两列，分解信息并入金额列悬浮提示；订单明细新增分页（10/20/50/100 条每页，页码省略号导航，参考小程序/APP 打印任务分页），翻页/状态筛选只局部刷新订单区块；移除「⚠️ 需要处理」异常监控卡片（打印失败/放弃打印/查看异常订单入口），订单异常仍可在明细状态筛选中查看。</p>' +
    '<p style="margin-top:10px">v5.17：收益口径合并 —— 「应收未收」并入「已入账」，统一改名为「云端收益记录」（= 已打印完成 sent + 待处理金额合计）；KPI 合并为单卡，成员收益明细 / 对账 / 收益构成 / 趋势 / 排行榜同步使用合并口径，待处理文件数保留在卡片副行提示。</p>' +
    '<p style="margin-top:10px">v5.18：趋势区间 —— 新增「本月」并与顶部云端月份绑定（切换月份自动跟随）；移除「本周」「近7天」快捷区间；趋势分析卡片置顶展示；成员收益明细 / 排行榜按归属成员合并（本地订单并入归属管理员行，本地/云端不再分行）。</p>' +
    '<p style="margin-top:10px">v5.19：云端页精简 —— 移除订单漏斗与成员排行榜；「管理员订单统计」与「成员收益明细」合并精简为「🧾 成员订单数量统计」（编号 / 成员 / 免费打印 / 订单总数四列，管理员与普通用户统一口径，不再请求后端 owners 统计）。</p>' +
    '<p style="margin-top:10px">v5.20：统一口径栏 —— 顶部新增全局口径栏（时间 / 成员 / 来源），单选决定「看哪些数据」，指标 / 视角 / 状态 / 分页等「怎么展示」控件留在模块内部；KPI、趋势、图表、订单明细共用同一份筛选数据；「成员账目」合并展示（成员 / 免费打印 / 订单/云端收益记录 / 手动代收 / 差额），来源筛选不影响对账列，上月环比徽标（自然月口径）。</p>' +
    '<p style="margin-top:10px">v5.21：打印价格统一管理 + 收益口径修正 —— 设置页新增「打印价格」区块（单双面价 / 派送地点百分比 / 优先级加急价 / 首页费：云端模式写服务器 pricing.json 全端生效，本地模式存 print_data.json；支持添加 / 删除派送地点，密码保护）；收益统计计入订单级附加服务费（派送 / 加急 / 首页，按订单有效文件状态归入已入账或应收未收，放弃 / 取消 / 打回 / 失败订单不计）；订单明细金额配色：自打且已完成订单金额用蓝色与「自打」标记一致；设置页移除「外观」主题板块（右上角主题切换保留）；优先级加急价按 低 → 中 → 高 顺序展示。</p>' +
    '<p style="margin-top:10px">v5.22：设备授权 + 多设备接单 —— 新增「🔐 授权」标签页（独立密码保护）：① 本设备所有者从成员列表绑定，绑定后本地打印工具新建标签页默认归属该所有者、默认关闭「管理员自行打印」；② 云端设备列表展示所有连接过云服务器的设备（计算机名称 / 在线状态 / 所有者 / 是否接单，每 15 秒自动刷新，绑定后即时广播生效）。多设备共连服务器时仅「启用接单」的设备接收订单（同一时间唯一接管者，被其他设备占用时提示接管者名称与所有者）；订单明细「用户」列改为显示下单用户昵称（绑定微信小程序/APP 后优先微信小程序昵称，修改昵称实时同步）；修复授权页设备列表/所有者刷新被代理过滤的问题。</p>' +
    '<p style="margin-top:10px">v5.23：设备删除 + 图表与价格修正 —— ① 授权页云端设备列表新增「🗑 删除」按钮（清理软件升级产生的同机旧 ID 与历史遗留设备；删除当前接单设备时自动清空接管记录）；② 饼状图引线标签防重叠：过小扇区跳过标注、同侧标签碰撞检测自动错开/隐藏、引线水平段只画到文字近边前 2px（不再压字）；③ 打印价格：本地模式首页费默认值统一为 0.10（与云端 pricing.json 一致）。</p>' +
    '<p style="margin-top:10px">v5.24：多设备接单 + 时间到秒 —— ① 「启用接单」重构为可接单设备列表（多台设备可同时启用），订单记录实际接单设备；订单明细新增「接单设备」列（{所有者}的设备 | {设备}，历史订单统一归入历史设备）；② 运营视角新增「接单设备比例」饼图（按订单数，悬停看收益）；③ 订单明细「时间」「开始打印」精确到秒；④ 口径栏滚动收起：滚动到订单明细附近时口径栏平滑上滑淡出、向上滚动自动滑回；⑤ 订单明细新增「开始打印」列（悬停展示下单→开始打印的等待时长）。</p>' +
    '<p style="margin-top:10px">v5.25：界面细节优化 —— ① 口径栏改为普通固定卡片：移除吸顶悬浮与滚动收起动画，不再遮挡订单明细；② 刷新记住所在标签页：F5 刷新后停留在原 tab（新开会话仍从收支清算开始）；③ 消除刷新时「收支清算」选中态闪烁：tab 恢复提前到首帧绘制前同步完成。</p>' +
    '<p style="margin-top:10px">v6.2：纸张张数统计 —— ① Hero KPI 新增「纸张张数」卡（单面每页 1 张、双面每张 2 页，奇数页最后一张仍占 1 张，含份数），副行显示单面/双面张数拆分；② 趋势分析新增「纸张」第五指标（≤60 天自动渲染为逐日柱状图，>60 天为切片折线；专属橙色，峰值/提示同步）；③ 修复「单双面构成」饼图此前按文件数计数却标注「张」的模糊统计，改为按实际纸张张数；④ 订单明细文件级新增「张数」列（含份数的实际用纸量）；⑤ 汇总行补充「· X 张纸」。</p>' +
    '<p style="margin-top:10px">v6.3：张数列补全 —— ① 订单明细订单行「页数」右侧新增「张数」列，显示该订单消耗的纸张总张数（悬停看单面/双面拆分）；② 展开的文件子列表「张数」列移至「页数」右侧，与订单行列序一致，仍显示该文件消耗的纸张张数（含份数）。</p>' +
    '<p style="margin-top:10px">v6.4：实际转账 + 实际盈亏 —— 原「经营损益 / 历史记录净额」只算账面该赚该亏，「资金重分配」里的转账指令也只是建议，钱有没有真的转并不影响显示，导致垫钱的人反被记成盈利（例：某月一人垫付 1125.77、代收仅 101.80，账面记他 +862.36，实际亏 1023.97）。现新增：① 「💸 实际转账」区块（独立密码，默认需在设置页另行设置），可一键套用建议转账指令、逐条增删改（付款人 / 收款人 / 金额 / 备注），并实时显示每条建议的「已转 / 还差」；转账<b>不记日期、直接归属当前结算月份</b>（钱即使下个月才转，也还是这个月的结算，不会随付款时间跑到下个月），跨月补记请切到对应结算月份再录；② 「💰 实际盈亏」表按现金口径（代收 + 实收转账 − 垫付 − 实付转账）列出每人真正拿到手多少钱、与应得盈亏差多少，差额即「还没到位的钱」；③ 「历史记录」各成员列改为显示当月实际盈亏（小字标注应得盈亏），与实际转账联动。转账是成员内部的钱，团队总盈亏不受影响，变的是亏损实际由谁垫着。原有「资金重分配」改称「建议转账指令」以示区别。</p>' +
    '<p style="margin-top:10px">v6.5：订单明细金额列改为「订单金额」展示口径（不再清零）—— 此前该列直接用收益记录口径（放弃/取消/打回/失败一律剔除），于是整单被放弃时显示 ¥0.00，与展开后的文件级金额（如 ¥1.20 / ¥0.80）自相矛盾。现统一为：① 整单被排除（放弃/取消/打回/失败）→ 显示订单本身金额（父订单 total_price，缺失时退回子任务费合计），颜色取该状态的状态色（放弃=紫），悬停提示「订单金额 ¥X · 放弃打印，不计入收益」；② 混合单（同一订单既有已打印完成、又有被放弃/打回的文件）→ 显示整单金额、末尾标 <b>*</b>，悬停提示「订单金额 ¥X · 计入收益 ¥Y · 含 N 个不计入收益的文件」；③ 历史老订单（v5 之前无 order_files 明细）→ 显示父订单 total_price（不再是 ¥0.00），悬停提示注明该单无文件明细、未计入收益统计。<b>收益统计口径完全不变</b>（仍按 sent + 待处理 计入，放弃/取消/打回/失败一律剔除），订单明细标题的说明同步为「自打/放弃/取消/打回/失败订单金额仅展示、不计入收益 · 带 * 的金额含未计入收益的部分」。</p>' +
    '<p style="margin-top:10px">v6.6：设备自动双面能力标注 —— ① 「🔐 授权」页云端设备列表新增「自动双面」列（三态下拉：✅ 支持自动双面 / 🖐 不支持（需人工翻纸）/ 未确认），可直接标注每一台设备；② 能力解析优先级为「人工标注 &gt; 本地打印工具自动探测 &gt; 未确认」，人工结论<b>不会被后续探测覆盖</b>（旧机型如 HP LaserJet 1018/1020/1022 有手动双面功能，驱动的双面能力位会虚报"支持"，只有人能盖章）；③ 后端 <b>/api/claiming_devices</b> 与 <b>/api/printer/devices</b> 下发 <b>auto_duplex</b>（true/false/null）与来源标记，本地工具 <b>printer_state</b> 同步本机能力 —— 这解决"现场有旧机型不支持自动双面、程序却一律按支持自动双面提交任务，结果静默打成单面还收双面的钱"的问题；移动端与本地工具据此提示 —— ⚠ 2026-10 晚些时候起，原先据此实施的「无障碍 × 双面 × 该设备」拦截（移动端三处入口 + 提交兜底 + 服务端 409）已<b>全部放开</b>，此标注只用于提示、不再拦单。</p>' +
    '<p style="margin-top:10px">v6.7：测试设备不再堆在授权页 —— 联调/冒烟脚本每次运行都会以固定前缀（<b>debug-*</b> / <b>socketio-debug-*</b> / <b>deploy-check*</b> / <b>wscheck-*</b> 等）注册设备，历史上直连生产，攒出了 48 台"测试设备"、还留着僵尸「接单中」记录。现改为：① 后端识别这些 id 并在设备列表中<b>默认隐藏</b>（列表下方提示数量），不再占满一屏；② 新增 <b>POST /api/printer/devices/cleanup</b>（默认 dry_run，只列不删；一律跳过在线设备）与授权页「🧹 清理测试设备」按钮（先预览清单再确认）；③ 后端每 30 分钟自动清掉<b>离线</b>的测试设备，并同步清空它们的接单记录（否则 get_active_printer_client() 可能挑到一台永远不会干活的机器）；④ 另加「🧹 清理无主离线设备」按钮（针对云主机上的临时客户端等陌生设备：<b>在线、已绑定所有者、人工盖过「自动双面」章的设备都会跳过</b>，先预览再确认）；⑤ 离线却仍挂着接单记录的设备显示为「接单中（离线）」并提示可删除清空。真机再连会自动重新登记，删除是幂等的。</p>' +

    + '③ 每月摊销<b>记在采购人名下</b>（整笔钱是他先垫的）⇒ 结算时他随「垫付差额」逐月收回，'
    + '等价于"每月给采购者原价返还"；「收支清算」新增<b>「🧾 长期耗材摊销」</b>区块，'
    + '逐批列出采购 / 总量 / 单价 / 累计使用 / 已摊销 / 本月用量 / 本月摊销 / 剩余未摊销，并标注本月返还对象。'
    + '④ 缺数量（0）的耗材<b>暂按普通采购全额计入</b>并显式提示"填数量后改为按月摊销"，'
    + '绝不让这笔钱凭空消失；用量没取到时摊销按 ¥0 计并给重试，绝不静默算错。</p>' +
    '<p style="margin-top:10px">页面仅由本地打印工具启动，数据实时保存在云端服务器。</p>' +
    '</div>' +
    '</div>');
}

/* ==================== 初始化 ==================== */
/* ── 本地 / 云端都有数据时的「安全合并」（2026-10-23 现场反馈后重写） ──
   合并要把结果写回**云端配置**（/api/proxy/finance/config）与**本机文件**（/api/local/data），
   两者都是写操作 ⇒ 都必须带 finance_session。旧写法在页面刚打开、什么都没解锁的时候就弹框，
   点「合并」必然 403 → 红字「需要先解锁财务模块（finance_session）才能写入」，数据一点没合并，
   下次打开照旧再弹（现场审计日志：每次开页两条 write_denied）。现在的口径：
     · 有会话 → 立刻问；没会话 → **先不问**，把上下文挂到 _afterUnlock，等真解锁了再问；
     · 合并成功 → 清空本机那份**重复副本**（业务数据以云端为准），否则下次打开又会问一遍；
       凭据不清 —— 服务端 _preserve_credentials 会保留 _finance_credentials 并回填
       config.passwords，密码不会因为这次清空而丢；
     · 上传失败 → 本机副本原样保留（不丢数据），下次解锁后可以再合并。 */
var _mergeCtx = null;
function _queueMergePrompt(localData, cloudData) {
  _mergeCtx = { local: localData, cloud: cloudData };
  if (FINANCE_SESSION) return _openMergeConfirm();
  _afterUnlock(_openMergeConfirm);
  toast('ℹ️ 本机还留有一份离线收支数据；解锁任一财务模块后会询问是否合并上传');
  return null;
}
function _openMergeConfirm() {
  if (!_mergeCtx) return null;
  if (!FINANCE_SESSION) { _afterUnlock(_openMergeConfirm); return null; }   // 还没解锁：继续等
  var ctx = _mergeCtx;
  _mergeCtx = null;
  return openConfirm(
    '检测到本地与云端均存在收支数据（本地为离线期间产生，云端为多人共用）。\n\n' +
    '为避免数据丢失，将执行「安全合并」：\n' +
    '· 订单/流水/成员按记录合并（去重；示例占位名不并入）\n' +
    '· 密码与服务评分以云端为权威（本地无法覆盖云端密码与评分）\n\n' +
    '合并结果会上传云端，并清空本机这份重复副本。是否合并？',
    '合并'
  ).then(function (ok) {
    if (!ok) {
      // 取消 = 以云端为准（云端是多人共用权威）；本机副本保留，下次解锁后还会问一次
      toast('已按云端数据展示（本机副本保留，解锁后可再合并）');
      return;
    }
    _applyMerge(ctx.local, ctx.cloud);
  });
}
function _applyMerge(localData, cloudData) {
  STORE = mergeStores(localData, cloudData || localData);
  invalidateUsage();   // 成员 / 采购 / 打印机台账刚合并 —— 旧用量缓存作废（口径见 finishLoad）
  var keys = allMonthKeys();
  currentKey = keys.length ? keys[keys.length - 1] : currentMonthKey();
  renderAll();
  return _saveToServer(STORE, true).then(function (sr) {
    if (!sr.ok) {
      toast('⚠️ 合并结果没能上传云端，本机副本已保留（解锁后可重试）', 'error', true);
      return;
    }
    toast('✅ 已安全合并本地与云端数据并上传', 'success');
    _clearLocalDuplicate();
  });
}
function _clearLocalDuplicate() {
  var blank = { config: {}, records: { expenses: [], income: [], scores: [], transfers: [] },
                notes: {}, meta: { version: 0 } };
  _saveToLocalFile(blank).then(function (lr) {
    if (lr.ok) toast('🧹 已清空本机重复副本（收支数据以云端为准）', 'success');
    else toast('⚠️ 本机重复副本清理失败（云端数据不受影响）', 'error');
  });
}
var _configLoaded = false;
function loadConfig() {
  if (FINANCE_MODE === 'local') {
    // 本地模式：不查云端，直接读本地 print_data.json；无本地数据则用空 STORE
    _loadFromLocalFile().then(function (localData) {
      if (localData) STORE = migrateConfig(localData);
      else STORE = migrateConfig(null);
      finishLocalLoad();
    });
    return;
  }
  // 云端模式：先拉云端，再比对本地，决定是否合并同步
  _loadFromServer().then(function (res) {
    if (!res.ok) { setCloudState(false); return; }
    setCloudState(true);
    var cloudData = res.data;
    var hadCloud = !!cloudData;
    if (cloudData) STORE = migrateConfig(cloudData);
    else STORE = migrateConfig(null);
    // 拉本地，判断是否两者都有真实数据 → 弹「合并」询问
    _loadFromLocalFile().then(function (localData) {
      if (localData) localData = migrateConfig(localData);
      var localReal = hasRealData(localData);
      var cloudReal = hasRealData(cloudData);
      if (localReal && cloudReal && localData) {
        // 两边都有真实数据 → 询问「安全合并」（写操作要有会话：没解锁就先不问、等解锁再问）
        _queueMergePrompt(localData, cloudData);
        finishLoad(true);
        return;
      }
      // 无云端真实数据但本地有 → 本地一次性迁移到云端（CEO 首次部署）
      if (!cloudReal && localReal && localData) {
        STORE = migrateConfig(localData);
        save();
        // CEO 首次部署：数据已上云，清空本地副本（成员/密码/评分/流水以云端为准）
        // S1-05：DELETE 也是写操作（要 finance_session），没解锁就先记下来、解锁后补做
        _afterUnlock(function () {
          fetch('/api/local/data', { method: 'DELETE', headers: apiHeaders() })
            .then(function (r) { return r.json(); })
            .then(function (res) {
              if (res && res.success) toast('✅ 已从本地文件迁移到云端，本地数据副本已清空', 'success');
              else toast('✅ 已从本地文件迁移到云端（本地副本清理失败，可在「设置 → 数据管理」重置）', 'success');
            })
            .catch(function () {
              toast('✅ 已从本地文件迁移到云端（本地副本清理失败，可在「设置 → 数据管理」重置）', 'success');
            });
        });
      }
      // 旧版本地绑定迁移（仅当尚无云端绑定）
      if (!(STORE.config.memberBindings || []).length) {
        fetch('/api/local/bindings', { headers: apiHeaders() })
          .then(function (r) { return r.json(); })
          .then(function (bres) {
            if (bres && bres.success && bres.bindings) {
              var arr = [];
              Object.keys(bres.bindings).forEach(function (oid) { var mid = bres.bindings[oid]; if (mid) arr.push({ openid: oid, memberId: mid }); });
              if (arr.length) { STORE.config.memberBindings = arr; save(); }
            }
            finishLoad(hadCloud);
          })
          .catch(function () { finishLoad(hadCloud); });
      } else {
        finishLoad(hadCloud);
      }
    });
  });
}
function finishLocalLoad() {
  replayOfflinePending();   // 本地模式同样重放暂存
  /* v7.9：配置刚就位（成员 / 采购 / 打印机）—— 之前基于空配置缓存的用量一律作废，
     否则「按用量分摊 / 折旧 / 耗材摊销」会拿一份成员全认不出的旧缓存算账。 */
  invalidateUsage();
  var keys = allMonthKeys();
  currentKey = keys.length ? keys[keys.length - 1] : currentMonthKey();
  renderAll();
  // 本地模式：cloud tab 走本地订单库，无需 loadCloudMonths
  _localOrdersReady = false;
  renderCloud();
  setCloudStateLocal();     // 本地模式云端徽标固定显示"本地模式"
  if (hasRealData(STORE)) toast('✅ 已加载本地收支数据（' + monthRecordCount(currentKey) + ' 条当月记录）');
  else toast('ℹ️ 欢迎使用，请在「记账」录入数据（本地模式）');
}
function setCloudStateLocal() {
  var pill = $('#cloudPill');
  if (pill) {
    pill.className = 'cloud-pill ok';
    pill.innerHTML = '<span class="dot"></span> 本地模式';
  }
  var ind = $('#storageFilePath');
  if (ind) ind.textContent = '📁 本地';
  var ov = $('#blockOverlay');
  if (ov) ov.classList.remove('show');
}
function finishLoad(hadCloud) {
  replayOfflinePending();   // 云端可达：重放上次离线暂存的未保存数据
  /* v7.9：配置刚就位（成员 / 采购 / 打印机）—— 之前基于空配置缓存的用量一律作废 */
  invalidateUsage();
  var keys = allMonthKeys();
  currentKey = keys.length ? keys[keys.length - 1] : currentMonthKey();
  // 云端月份预加载
  loadCloudMonths().then(function () { _cloudMonthsReady = true; _renderScopeViews(); });
  renderAll();
  checkHealth();
  setInterval(checkHealth, 30000);
  if (hadCloud) toast('✅ 已加载云端配置（' + monthRecordCount(currentKey) + ' 条当月记录）');
  else toast('ℹ️ 欢迎使用，请在「记账」录入数据');
}
function replayOfflinePending() {
  try {
    var raw = localStorage.getItem('finance_offline_pending');
    if (!raw) return;
    var pending = JSON.parse(raw);
    localStorage.removeItem('finance_offline_pending');
    STORE = migrateConfig(sanitizeStore(pending));
    save();
    toast('🔄 已恢复本地暂存数据并重新保存', 'success');
  } catch (e2) { /* 暂存数据损坏则直接丢弃 */ }
}

(function () {
  // 导航
  $$('#tabNav button').forEach(function (btn) {
    btn.addEventListener('click', function () { switchTab(this.dataset.tab); });
  });
  // 本地模式：把「云端」页按钮改名为「本地订单」；「授权」模块仅云端模式可用 → 隐藏入口
  if (FINANCE_MODE === 'local') {
    var _cloudBtn = document.querySelector('#tabNav button[data-tab="cloud"]');
    if (_cloudBtn) _cloudBtn.innerHTML = '<span class="ico">📡</span>本地订单';
    var _authBtn = document.querySelector('#tabNav button[data-tab="auth"]');
    if (_authBtn) _authBtn.style.display = 'none';
  }
  $('#themeToggle').addEventListener('click', cycleThemeMode);
  // 返回顶部：滚动超过 200px 显示，点击平滑回到顶部
  var _backToTop = $('#backToTop');
  function _updateBackToTop() { _backToTop.classList.toggle('show', (window.scrollY || document.documentElement.scrollTop) > 200); }
  _updateBackToTop();
  window.addEventListener('scroll', _updateBackToTop, { passive: true });
  _backToTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  $('#blockRetry').addEventListener('click', retryConnect);
  // 初始 tab 早在 <main> 后的防闪脚本里已定（深链 > 上次 tab > 总览，存 window.__initialTab），
  // 此处选中态已就位，switchTab 只补走正常初始化（currentTab/渲染/动画），不会产生视觉跳变
  switchTab(window.__initialTab || 'dash');
  // 初始为 loading 骨架
  renderAll();
  // S1-05：先问服务端「哪些模块还没设密码 / 数据是否只读」——默认密码已停用，
  // 需要时立即进强制改密流程（D-5 拍板接受的操作摩擦）；随后再加载数据。
  try { checkFinanceSetup(); } catch (e) {}
  loadConfig();
})();
</script>
